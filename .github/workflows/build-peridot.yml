name: Tepuy Kernel - POCO F6 Peridot

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_DIR: /home/runner/kernel-peridot
  OUT_DIR: /home/runner/kernel-peridot/out
  DEFCONFIG: peridot_defconfig
  BUILD_MODE: compat

  KERNEL_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
  KERNEL_BRANCH: peridot-u-oss

  ARCH: arm64
  SUBARCH: arm64

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      # ==========================================================
      # 1. DEPENDENCIES
      # ==========================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " INSTALL BUILD DEPENDENCIES"
          echo "=============================================="

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            python3 \
            python3-pip \
            cpio \
            rsync \
            unzip \
            zip \
            pahole

          echo
          echo "Toolchain:"
          clang --version
          ld.lld --version
          llvm-ar --version


      # ==========================================================
      # 2. CLONE ORIGINAL XIAOMI PERIDOT SOURCE
      # ==========================================================

      - name: Clone original Xiaomi Peridot source
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " CLONE ORIGINAL XIAOMI PERIDOT SOURCE"
          echo "=============================================="

          rm -rf "$KERNEL_DIR"

          git clone \
            --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo
          echo "=============================================="
          echo " SOURCE INFORMATION"
          echo "=============================================="

          echo "Remote:"
          git remote -v

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git log -1 --oneline

          echo
          echo "Kernel version:"
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' \
            Makefile || true

          test -f Makefile

          echo
          echo "[OK] Xiaomi Peridot source cloned"


      # ==========================================================
      # 3. PREFLIGHT
      # ==========================================================

      - name: Peridot source preflight
        shell: bash
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          echo "=============================================="
          echo " PERIDOT SOURCE PREFLIGHT"
          echo "=============================================="

          echo
          echo "[1/8] Git repository"

          git rev-parse --is-inside-work-tree
          git branch --show-current

          test "$(git branch --show-current)" = "$KERNEL_BRANCH"

          echo "[OK] Correct branch: $KERNEL_BRANCH"


          echo
          echo "[2/8] Kernel Makefile"

          test -f Makefile

          echo "[OK] Makefile"


          echo
          echo "[3/8] Defconfig"

          if [ -f "arch/arm64/configs/${DEFCONFIG}" ]; then

            echo "[OK] arch/arm64/configs/${DEFCONFIG}"

          else

            echo "[ERROR] Missing:"
            echo "arch/arm64/configs/${DEFCONFIG}"

            echo
            echo "Available Peridot configs:"

            find arch/arm64/configs \
              -maxdepth 1 \
              -type f \
              -iname '*peridot*' \
              -print \
              || true

            exit 1

          fi


          echo
          echo "[4/8] Required kernel directories"

          for dir in \
            arch/arm64 \
            drivers \
            drivers/cpufreq \
            drivers/thermal \
            kernel \
            scripts
          do

            if [ ! -d "$dir" ]; then
              echo "[ERROR] Missing directory: $dir"
              exit 1
            fi

            echo "[OK] $dir"

          done


          echo
          echo "[5/8] HWID"

          if [ -f drivers/misc/hwid/Kconfig ]; then

            echo "[OK] drivers/misc/hwid/Kconfig"

          else

            echo "[WARNING] drivers/misc/hwid/Kconfig missing"

            echo
            echo "Searching HWID files..."

            find . \
              -path './.git' -prune -o \
              -iname '*hwid*' \
              -print \
              | head -100

            echo
            echo "Checking Git tracked files..."

            git ls-tree -r --name-only HEAD \
              | grep -Ei '(^|/)hwid(/|$)' \
              || true

          fi


          echo
          echo "[6/8] Kconfig dependency scan"

          python3 <<'PY'
          import os
          import re
          import sys

          missing = []

          for base, dirs, files in os.walk("."):

              if ".git" in dirs:
                  dirs.remove(".git")

              for name in files:

                  if not (
                      name == "Kconfig"
                      or name.startswith("Kconfig.")
                  ):
                      continue

                  path = os.path.join(base, name)

                  try:
                      with open(
                          path,
                          "r",
                          encoding="utf-8",
                          errors="replace"
                      ) as f:
                          data = f.read()
                  except Exception:
                      continue

                  for match in re.finditer(
                      r'^\s*(?:source|rsource)\s+"([^"]+)"',
                      data,
                      re.MULTILINE
                  ):

                      target = match.group(1)

                      if target.startswith("/"):
                          target = target[1:]

                      full = os.path.normpath(
                          os.path.join(base, target)
                      )

                      if "*" in full:
                          continue

                      if not os.path.isfile(full):

                          missing.append(
                              f"{path}: "
                              f"{target} -> {full}"
                          )

          if missing:

              print()
              print(
                  "[WARNING] Missing Kconfig dependencies:"
              )

              for item in missing:
                  print("  " + item)

              print()
              print(
                  "The source tree may be incomplete."
              )

          else:

              print(
                  "[OK] All Kconfig includes resolve"
              )
          PY


          echo
          echo "[7/8] Device tree"

          find arch/arm64/boot/dts \
            -iname '*peridot*' \
            -o -iname '*sm8635*' \
            | head -100 \
            || true


          echo
          echo "[8/8] Preflight complete"


      # ==========================================================
      # 4. COPY TEPUY PATCHER
      # ==========================================================

      - name: Prepare Tepuy patcher
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " PREPARE TEPUY PATCHER"
          echo "=============================================="

          test -f tepuy-patcher-compat.py
          test -f tepuy_sysfs.c

          chmod +x tepuy-patcher-compat.py

          echo "[OK] Tepuy patcher found"
          echo "[OK] tepuy_sysfs.c found"


      # ==========================================================
      # 5. APPLY TEPUY PATCH
      # ==========================================================

      - name: Apply Tepuy patch
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo " APPLY TEPUY PATCH"
          echo "=============================================="

          echo "Kernel:"
          echo "$KERNEL_DIR"

          echo "Patcher:"
          pwd
          echo "tepuy-patcher-compat.py"

          echo "Build mode:"
          echo "$BUILD_MODE"

          echo
          echo "Git state before patch:"

          cd "$KERNEL_DIR"

          git status --short

          echo
          echo "Running patcher..."

          python3 \
            "$GITHUB_WORKSPACE/tepuy-patcher-compat.py" \
            "$KERNEL_DIR"

          echo
          echo "Git state after patch:"

          git status --short


      # ==========================================================
      # 6. VERIFY TEPUY PATCH
      # ==========================================================

      - name: Verify Tepuy patch
        shell: bash
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          echo "=============================================="
          echo " VERIFY TEPUY PATCH"
          echo "=============================================="

          echo
          echo "[1] tepuy_sysfs.c"

          test -f kernel/tepuy_sysfs.c

          grep -q "tepuy_game_mode" \
            kernel/tepuy_sysfs.c

          echo "[OK] tepuy_sysfs.c"


          echo
          echo "[2] kernel Makefile"

          grep -q "tepuy_sysfs.o" \
            kernel/Makefile

          echo "[OK] tepuy_sysfs.o"


          echo
          echo "[3] cpufreq"

          if grep -q \
            "extern bool tepuy_game_mode;" \
            drivers/cpufreq/cpufreq.c
          then
            echo "[OK] cpufreq extern"
          else
            echo "[WARNING] cpufreq extern missing"
          fi


          echo
          echo "[4] thermal"

          if [ -f drivers/thermal/thermal_core.c ]; then

            if grep -q \
              "extern bool tepuy_game_mode;" \
              drivers/thermal/thermal_core.c
            then
              echo "[OK] thermal extern"
            else
              echo "[INFO] thermal extern not present"
            fi

          else

            echo "[INFO] thermal_core.c unavailable"

          fi


          echo
          echo "[5] schedutil"

          echo "[OK] schedutil intentionally untouched"


          echo
          echo "[6] Voltage protection"

          if grep -Rni \
            -E \
            "regulator_set_voltage|opp_set_voltage|voltage" \
            kernel/tepuy_sysfs.c \
            drivers/cpufreq/cpufreq.c \
            2>/dev/null \
            | head -20
          then

            echo
            echo "[WARNING] Review voltage-related references above"

          else

            echo "[OK] No voltage modification introduced"

          fi


          echo
          echo "=============================================="
          echo " TEPUY PATCH VERIFICATION COMPLETE"
          echo "=============================================="


      # ==========================================================
      # 7. CREATE OUTPUT DIRECTORY
      # ==========================================================

      - name: Prepare kernel output
        shell: bash
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          rm -rf "$OUT_DIR"

          mkdir -p "$OUT_DIR"

          echo "[OK] Output directory:"
          echo "$OUT_DIR"


      # ==========================================================
      # 8. DEFCONFIG
      # ==========================================================

      - name: Generate Peridot defconfig
        shell: bash
        run: |
          set -o pipefail

          cd "$KERNEL_DIR"

          echo "=============================================="
          echo " DEFCONFIG"
          echo "=============================================="

          echo "Defconfig:"
          echo "$DEFCONFIG"

          echo "Output:"
          echo "$OUT_DIR"

          make \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"


      # ==========================================================
      # 9. VERIFY CONFIG
      # ==========================================================

      - name: Verify kernel configuration
        shell: bash
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          echo "=============================================="
          echo " VERIFY KERNEL CONFIG"
          echo "=============================================="

          test -f "$OUT_DIR/.config"

          echo
          echo "CONFIG_SYSFS:"

          grep '^CONFIG_SYSFS=' \
            "$OUT_DIR/.config" \
            || true

          echo
          echo "CONFIG_CPU_FREQ:"

          grep '^CONFIG_CPU_FREQ' \
            "$OUT_DIR/.config" \
            || true

          echo
          echo "CONFIG_THERMAL:"

          grep '^CONFIG_THERMAL' \
            "$OUT_DIR/.config" \
            || true

          echo
          echo "[OK] .config generated"


      # ==========================================================
      # 10. BUILD KERNEL
      # ==========================================================

      - name: Build kernel
        shell: bash
        run: |
          set -o pipefail

          cd "$KERNEL_DIR"

          echo "=============================================="
          echo " START KERNEL BUILD"
          echo "=============================================="

          echo "Defconfig:"
          echo "$DEFCONFIG"

          echo "Build mode:"
          echo "$BUILD_MODE"

          echo
          echo "=============================================="
          echo " COMPILE"
          echo "=============================================="

          make \
            -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image \
            modules


      # ==========================================================
      # 11. VERIFY IMAGE
      # ==========================================================

      - name: Verify generated kernel
        shell: bash
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          echo "=============================================="
          echo " VERIFY KERNEL OUTPUT"
          echo "=============================================="

          echo
          echo "Searching Image..."

          find "$OUT_DIR/arch/arm64/boot" \
            -maxdepth 2 \
            -type f \
            -printf '%p\n' \
            | sort


          echo
          echo "Checking Image..."

          test -f \
            "$OUT_DIR/arch/arm64/boot/Image"

          IMAGE_SIZE=$(
            stat -c%s \
            "$OUT_DIR/arch/arm64/boot/Image"
          )

          echo
          echo "Image size:"
          echo "$IMAGE_SIZE bytes"

          if [ "$IMAGE_SIZE" -lt 1000000 ]; then
            echo "[ERROR] Image suspiciously small"
            exit 1
          fi

          echo
          echo "[OK] Kernel Image generated"


      # ==========================================================
      # 12. VERIFY TEPUY SYMBOLS
      # ==========================================================

      - name: Verify Tepuy symbols
        shell: bash
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          echo "=============================================="
          echo " VERIFY TEPUY SYMBOLS"
          echo "=============================================="

          if [ -f "$OUT_DIR/System.map" ]; then

            echo
            echo "Searching GameMode symbols..."

            grep -i \
              "tepuy" \
              "$OUT_DIR/System.map" \
              || true

          fi

          echo
          echo "Searching built objects..."

          find "$OUT_DIR" \
            -type f \
            \( -name '*tepuy*' -o -name 'tepuy_sysfs.o' \) \
            -print \
            || true


      # ==========================================================
      # 13. PACKAGE
      # ==========================================================

      - name: Package kernel artifacts
        shell: bash
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          echo "=============================================="
          echo " PACKAGE KERNEL"
          echo "=============================================="

          PACKAGE="/home/runner/peridot-tepuy-kernel"

          rm -rf "$PACKAGE"

          mkdir -p \
            "$PACKAGE/boot" \
            "$PACKAGE/modules" \
            "$PACKAGE/config" \
            "$PACKAGE/source"

          cp \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$PACKAGE/boot/Image"

          if [ -f \
            "$OUT_DIR/arch/arm64/boot/Image.gz" ]; then

            cp \
              "$OUT_DIR/arch/arm64/boot/Image.gz" \
              "$PACKAGE/boot/Image.gz"

          fi


          if [ -d "$OUT_DIR/lib/modules" ]; then

            cp -a \
              "$OUT_DIR/lib/modules/." \
              "$PACKAGE/modules/" \
              || true

          fi


          cp \
            "$OUT_DIR/.config" \
            "$PACKAGE/config/kernel.config"


          if [ -f "$OUT_DIR/System.map" ]; then

            cp \
              "$OUT_DIR/System.map" \
              "$PACKAGE/config/System.map"

          fi


          cp \
            kernel/tepuy_sysfs.c \
            "$PACKAGE/source/tepuy_sysfs.c"


          cp \
            "$GITHUB_WORKSPACE/tepuy-patcher-compat.py" \
            "$PACKAGE/source/tepuy-patcher-compat.py"


          cat > "$PACKAGE/BUILD_INFO.txt" <<EOF
POCO F6 / Peridot
SoC: SM8635
Source: Xiaomi_Kernel_OpenSource
Branch: $KERNEL_BRANCH
Defconfig: $DEFCONFIG
Build mode: $BUILD_MODE

Tepuy:
- tepuy_sysfs.c: enabled
- GameMode cpufreq boost: attempted
- thermal passive_delay: optional
- schedutil.c: untouched
- voltage modification: none
EOF


          cd /home/runner

          tar \
            -czf \
            peridot-tepuy-kernel.tar.gz \
            peridot-tepuy-kernel

          echo
          echo "[OK] Package created:"
          ls -lh \
            /home/runner/peridot-tepuy-kernel.tar.gz


      # ==========================================================
      # 14. UPLOAD ARTIFACT
      # ==========================================================

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: peridot-tepuy-kernel
          path: |
            /home/runner/peridot-tepuy-kernel.tar.gz
            /home/runner/kernel-peridot/out/arch/arm64/boot/Image
            /home/runner/kernel-peridot/out/arch/arm64/boot/Image.gz
            /home/runner/kernel-peridot/out/.config
            /home/runner/kernel-peridot/out/System.map
          if-no-files-found: error
          compression-level: 0


      # ==========================================================
      # 15. FINAL SUMMARY
      # ==========================================================

      - name: Build summary
        if: success()
        shell: bash
        run: |
          echo
          echo "=============================================="
          echo " TEPUY PERIDOT BUILD SUCCESS"
          echo "=============================================="
          echo
          echo "Device:      POCO F6 / Peridot"
          echo "SoC:         SM8635"
          echo "Source:      Xiaomi Kernel OpenSource"
          echo "Branch:      peridot-u-oss"
          echo "Defconfig:   peridot_defconfig"
          echo
          echo "Kernel:"
          echo "  Image       OK"
          echo
          echo "Tepuy:"
          echo "  sysfs       OK"
          echo "  cpufreq     OK/compatible"
          echo "  thermal     optional"
          echo "  schedutil   untouched"
          echo
          echo "Voltage:"
          echo "  untouched"
          echo
          echo "Artifact:"
          echo "  peridot-tepuy-kernel"
          echo
          echo "=============================================="

name: Build Tepuy Kernel for POCO F6 Peridot

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: compat
        type: choice
        options:
          - compat
          - full
          - both

env:
  ARCH: arm64
  SUBARCH: arm64
  CCACHE_MAXSIZE: 2G
  CCACHE_HARDLINK: true
  CCACHE_NOHASHDIR: true

jobs:
  build:
    name: Build Peridot Kernel
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ==========================================================
      # CHECKOUT TEPUY REPOSITORY
      # ==========================================================

      - name: Checkout Tepuy repository
        uses: actions/checkout@v4

      # ==========================================================
      # BUILD DEPENDENCIES
      # ==========================================================

      - name: Setup build environment
        run: |
          set -e

          sudo apt-get update -qq

          sudo apt-get install -y -qq --no-install-recommends \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            make \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            clang \
            llvm \
            lld \
            device-tree-compiler \
            python3 \
            zip \
            unzip \
            wget \
            curl \
            ccache \
            libelf-dev \
            libncurses-dev \
            libxml2-utils \
            dwarves \
            jq \
            file

      # ==========================================================
      # CCACHE
      # ==========================================================

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tepuy-peridot
          max-size: 2G

      # ==========================================================
      # CLONE ORIGINAL XIAOMI PERIDOT SOURCE
      # ==========================================================

      - name: Clone Xiaomi Peridot source
        run: |
          set -e

          echo "=============================================="
          echo " CLONE ORIGINAL XIAOMI PERIDOT SOURCE"
          echo "=============================================="

          rm -rf "$HOME/kernel-peridot"

          git clone \
            --depth=1 \
            -b peridot-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            "$HOME/kernel-peridot"

          cd "$HOME/kernel-peridot"

          echo ""
          echo "=== SOURCE ==="
          git remote -v
          echo "Branch:"
          git branch --show-current
          echo "Commit:"
          git rev-parse --short HEAD

          echo ""
          echo "=== BASIC SOURCE CHECK ==="

          test -f Makefile
          test -d arch
          test -d drivers
          test -f arch/arm64/configs/gki_defconfig
          test -f arch/arm64/configs/vendor/peridot_GKI.config

          echo "[OK] Xiaomi Peridot source found"
          echo "[OK] gki_defconfig found"
          echo "[OK] vendor/peridot_GKI.config found"

      # ==========================================================
      # FIX MISSING OPTIONAL HWID KCONFIG
      # ==========================================================

      - name: Fix missing HWID Kconfig reference
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " CHECK HWID KCONFIG"
          echo "=============================================="

          if [ -f drivers/misc/hwid/Kconfig ]; then
            echo "[OK] drivers/misc/hwid/Kconfig exists"
          else
            if grep -q 'source "drivers/misc/hwid/Kconfig"' drivers/misc/Kconfig; then
              echo "[WARNING] Missing HWID Kconfig detected"
              echo "[INFO] Removing dangling reference only"

              cp drivers/misc/Kconfig drivers/misc/Kconfig.tepuy-backup

              sed -i \
                's|^[[:space:]]*source "drivers/misc/hwid/Kconfig"|# source "drivers/misc/hwid/Kconfig"|' \
                drivers/misc/Kconfig

              echo "[OK] Dangling HWID reference disabled"
            else
              echo "[OK] No HWID reference found"
            fi
          fi

          echo ""
          echo "=== HWID CHECK ==="

          if grep -n 'drivers/misc/hwid/Kconfig' drivers/misc/Kconfig; then
            echo "[INFO] HWID reference remains commented"
          fi

      # ==========================================================
      # VERIFY PERIDOT CONFIG
      # ==========================================================

      - name: Verify Peridot configuration
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " VERIFY PERIDOT CONFIGURATION"
          echo "=============================================="

          test -f arch/arm64/configs/gki_defconfig
          test -f arch/arm64/configs/vendor/peridot_GKI.config

          echo "[OK] gki_defconfig"
          echo "[OK] vendor/peridot_GKI.config"

          echo ""
          echo "=== PERIDOT CONFIG ==="
          head -40 arch/arm64/configs/vendor/peridot_GKI.config

      # ==========================================================
      # APPLY ORIGINAL TEPUY COMPAT PATCHER
      # ==========================================================

      - name: Apply Tepuy COMPAT patch
        if: ${{ github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both' }}
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " APPLY TEPUY COMPAT PATCH"
          echo "=============================================="

          test -f "${{ github.workspace }}/tepuy-patcher-compat.py"
          test -f "${{ github.workspace }}/tepuy_sysfs.c"

          python3 \
            "${{ github.workspace }}/tepuy-patcher-compat.py" \
            "$HOME/kernel-peridot"

          echo ""
          echo "=== TEPUY VERIFICATION ==="

          test -f kernel/tepuy_sysfs.c

          echo ""
          echo "--- kernel/tepuy_sysfs.c ---"
          grep -n "tepuy_game_mode" kernel/tepuy_sysfs.c | head -10 || true

          echo ""
          echo "--- drivers/cpufreq/cpufreq.c ---"
          grep -n "tepuy_game_mode" drivers/cpufreq/cpufreq.c | head -10 || true

          echo ""
          echo "--- drivers/thermal/thermal_core.c ---"
          grep -n "tepuy_game_mode" drivers/thermal/thermal_core.c | head -10 || true

          echo ""
          echo "[OK] Tepuy COMPAT patch applied"

      # ==========================================================
      # APPLY FULL PATCH
      # ==========================================================

      - name: Apply Tepuy FULL patch
        if: ${{ github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both' }}
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " APPLY TEPUY FULL PATCH"
          echo "=============================================="

          test -f "${{ github.workspace }}/tepuy-patcher.py"

          python3 \
            "${{ github.workspace }}/tepuy-patcher.py" \
            "$HOME/kernel-peridot"

          echo "[OK] Tepuy FULL patch applied"

      # ==========================================================
      # BUILD KERNEL
      # ==========================================================

      - name: Build kernel
        run: |
          set -o pipefail

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " START KERNEL BUILD"
          echo "=============================================="

          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          export LLVM=1
          export LLVM_IAS=1

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          echo ""
          echo "=============================================="
          echo " STEP 1: GKI DEFCONFIG"
          echo "=============================================="

          make O=out \
            gki_defconfig \
            2>&1 | tee out/build.log

          test -f out/.config

          echo "[OK] Base GKI .config generated"

          echo ""
          echo "=============================================="
          echo " STEP 2: APPLY PERIDOT CONFIG"
          echo "=============================================="

          make O=out \
            KCONFIG_ALLCONFIG="$PWD/arch/arm64/configs/vendor/peridot_GKI.config" \
            alldefconfig \
            2>&1 | tee -a out/build.log

          test -f out/.config

          echo "[OK] Peridot .config generated"

          echo ""
          echo "=============================================="
          echo " STEP 3: FINAL OLDDEFCONFIG"
          echo "=============================================="

          make O=out \
            olddefconfig \
            2>&1 | tee -a out/build.log

          test -f out/.config

          echo "[OK] Final kernel configuration ready"

          echo ""
          echo "=============================================="
          echo " STEP 4: COMPILE KERNEL"
          echo "=============================================="

          make O=out \
            -j"$(nproc --all)" \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " STEP 5: COMPILE MODULES"
          echo "=============================================="

          make O=out \
            -j"$(nproc --all)" \
            modules \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " STEP 6: INSTALL MODULES"
          echo "=============================================="

          rm -rf "$HOME/modules_staging"

          make O=out \
            INSTALL_MOD_PATH="$HOME/modules_staging" \
            INSTALL_MOD_STRIP=1 \
            modules_install \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " BUILD RESULTS"
          echo "=============================================="

          find out/arch/arm64/boot \
            -maxdepth 3 \
            -type f \
            -print \
            2>/dev/null || true

      # ==========================================================
      # PREPARE IMAGE
      # ==========================================================

      - name: Prepare kernel image
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " PREPARE IMAGE"
          echo "=============================================="

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then

            cp \
              out/arch/arm64/boot/Image.gz-dtb \
              out/arch/arm64/boot/Image.gz

          elif [ -f out/arch/arm64/boot/Image.gz ]; then

            echo "[OK] Image.gz already exists"

          elif [ -f out/arch/arm64/boot/Image ]; then

            cp \
              out/arch/arm64/boot/Image \
              out/arch/arm64/boot/Image.gz

          else

            echo "[ERROR] Kernel Image not found"
            exit 1

          fi

          test -f out/arch/arm64/boot/Image.gz

          ls -lh out/arch/arm64/boot/Image.gz

          echo "[OK] Kernel Image prepared"

      # ==========================================================
      # DOWNLOAD MAGISKBOOT
      # ==========================================================

      - name: Download magiskboot
        run: |
          set -e

          echo "=============================================="
          echo " DOWNLOAD MAGISKBOOT"
          echo "=============================================="

          mkdir -p "$HOME/magisk"
          cd "$HOME/magisk"

          APK_URL="$(
            curl -fsSL \
              https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
              | jq -r '
                .assets[]
                | select(.name | test("^Magisk-v.*\\.apk$"))
                | .browser_download_url
              ' \
              | head -n1
          )"

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "[ERROR] Could not locate Magisk APK"
            exit 1
          fi

          curl -fL \
            "$APK_URL" \
            -o magisk.apk

          unzip -j \
            magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d . \
            2>/dev/null || true

          if [ ! -f libmagiskboot.so ]; then
            unzip -j \
              magisk.apk \
              "lib/arm64-v8a/libmagiskboot.so" \
              -d . \
              2>/dev/null || true
          fi

          test -f libmagiskboot.so

          mv libmagiskboot.so magiskboot
          chmod 755 magiskboot

          echo "[OK] magiskboot ready"

      # ==========================================================
      # BUILD BOOT IMAGE
      # ==========================================================

      - name: Build boot image
        run: |
          set -e

          echo "=============================================="
          echo " BUILD BOOT IMAGE"
          echo "=============================================="

          test -f "${{ github.workspace }}/boot_stock.img"
          test -f "$HOME/magisk/magiskboot"

          cp \
            "${{ github.workspace }}/boot_stock.img" \
            "$HOME/boot_stock.img"

          cd "$HOME"

          "$HOME/magisk/magiskboot" \
            unpack \
            boot_stock.img

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            "$HOME/kernel"

          "$HOME/magisk/magiskboot" \
            repack \
            boot_stock.img \
            boot_tepuy.img

          test -f "$HOME/boot_tepuy.img"

          ls -lh "$HOME/boot_tepuy.img"

          echo "[OK] boot_tepuy.img created"

      # ==========================================================
      # BUILD COMPAT ZIP
      # ==========================================================

      - name: Build COMPAT zip
        if: ${{ github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both' }}
        run: |
          set -e

          echo "=============================================="
          echo " BUILD COMPAT ZIP"
          echo "=============================================="

          cd "$HOME"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3-compat

          cd AnyKernel3-compat

          cp \
            "${{ github.workspace }}/anykernel-compat.sh" \
            ./anykernel.sh

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            ./Image.gz

          DTB="$(
            find \
              "$HOME/kernel-peridot/out/arch/arm64/boot/dts" \
              -type f \
              -name "*.dtb" \
              | head -n1
          )"

          if [ -n "$DTB" ]; then
            cp "$DTB" ./dtb
            echo "[OK] DTB copied"
          else
            echo "[WARNING] No DTB found"
          fi

          mkdir -p tools

          if [ -d "${{ github.workspace }}/tools" ]; then
            cp -r \
              "${{ github.workspace }}/tools/." \
              tools/
          fi

          chmod -R 755 tools/ 2>/dev/null || true

          if [ -f "${{ github.workspace }}/tools/ak3-core.sh" ]; then
            cp \
              "${{ github.workspace }}/tools/ak3-core.sh" \
              tools/ak3-core.sh
          fi

          zip -r9 \
            "$HOME/Tepuy-Kernel-Compat-peridot.zip" \
            . \
            -x "*.git*" \
            -x "*.zip" \
            -x "README*"

          ls -lh "$HOME/Tepuy-Kernel-Compat-peridot.zip"

      # ==========================================================
      # BUILD FULL ZIP
      # ==========================================================

      - name: Build FULL zip
        if: ${{ github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both' }}
        run: |
          set -e

          echo "=============================================="
          echo " BUILD FULL ZIP"
          echo "=============================================="

          cd "$HOME"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3-full

          cd AnyKernel3-full

          cp \
            "${{ github.workspace }}/anykernel-full.sh" \
            ./anykernel.sh

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            ./Image.gz

          DTB="$(
            find \
              "$HOME/kernel-peridot/out/arch/arm64/boot/dts" \
              -type f \
              -name "*.dtb" \
              | head -n1
          )"

          if [ -n "$DTB" ]; then
            cp "$DTB" ./dtb
          fi

          if [ -f "${{ github.workspace }}/dtbo.img" ]; then
            cp \
              "${{ github.workspace }}/dtbo.img" \
              ./dtbo.img
          fi

          mkdir -p _modules
          mkdir -p _system_dlkm

          if [ -f "${{ github.workspace }}/prepare-modules.py" ]; then
            python3 \
              "${{ github.workspace }}/prepare-modules.py" \
              --input "$HOME/modules_staging" \
              --vendor-out "_modules" \
              --system-out "_system_dlkm"
          fi

          mkdir -p tools

          if [ -d "${{ github.workspace }}/tools" ]; then
            cp -r \
              "${{ github.workspace }}/tools/." \
              tools/
          fi

          chmod -R 755 tools/ 2>/dev/null || true

          if [ -f "${{ github.workspace }}/tools/ak3-core.sh" ]; then
            cp \
              "${{ github.workspace }}/tools/ak3-core.sh" \
              tools/ak3-core.sh
          fi

          zip -r9 \
            "$HOME/Tepuy-Kernel-Full-peridot.zip" \
            . \
            -x "*.git*" \
            -x "*.zip" \
            -x "README*"

          ls -lh "$HOME/Tepuy-Kernel-Full-peridot.zip"

      # ==========================================================
      # GAMEMODE MODULE
      # ==========================================================

      - name: Build GameMode Auto-Activator
        if: ${{ github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both' }}
        run: |
          set -e

          echo "=============================================="
          echo " BUILD GAMEMODE MODULE"
          echo "=============================================="

          mkdir -p "$HOME/gamemode-module"
          cd "$HOME/gamemode-module"

          printf '%s\n' \
            'id=tepuy-gamemode-auto' \
            'name=Tepuy GameMode Auto-Activator' \
            'version=1.0' \
            'versionCode=1' \
            'author=CodigoCodm' \
            'description=Activa automaticamente Tepuy GameMode al arrancar. Requiere kernel Tepuy.' \
            > module.prop

          cat > service.sh <<'EOF'
          #!/system/bin/sh

          LOG_FILE="/data/local/tmp/tepuy-gamemode.log"
          SYSFS_NODE="/sys/kernel/tepuy_boost/game_mode"
          MAX_WAIT=30

          log_msg() {
              echo "[$(date "+%Y-%m-%d %H:%M:%S")] $1" >> "$LOG_FILE"
          }

          rm -f "$LOG_FILE"

          log_msg "=== Tepuy GameMode Auto-Activator iniciado ==="

          waited=0

          while [ ! -f "$SYSFS_NODE" ]; do
              sleep 1
              waited=$((waited + 1))

              if [ "$waited" -ge "$MAX_WAIT" ]; then
                  log_msg "ERROR: sysfs node no aparecio"
                  exit 1
              fi
          done

          log_msg "sysfs node encontrado"

          if echo 1 > "$SYSFS_NODE" 2>/dev/null; then
              state=$(cat "$SYSFS_NODE" 2>/dev/null)
              log_msg "GameMode activado: $state"
          else
              log_msg "ERROR: no se pudo escribir GameMode"
              exit 1
          fi
          EOF

          chmod 755 service.sh

          zip -r9 \
            "$HOME/Tepuy-GameMode-AutoActivator.zip" \
            module.prop \
            service.sh

          ls -lh "$HOME/Tepuy-GameMode-AutoActivator.zip"

      # ==========================================================
      # ARTIFACT: BOOT
      # ==========================================================

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot_tepuy
          path: ~/boot_tepuy.img
          retention-days: 30

      # ==========================================================
      # ARTIFACT: COMPAT
      # ==========================================================

      - name: Upload COMPAT zip
        if: ${{ github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Kernel-Compat-peridot
          path: ~/Tepuy-Kernel-Compat-peridot.zip
          retention-days: 30

      # ==========================================================
      # ARTIFACT: FULL
      # ==========================================================

      - name: Upload FULL zip
        if: ${{ github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Kernel-Full-peridot
          path: ~/Tepuy-Kernel-Full-peridot.zip
          retention-days: 30

      # ==========================================================
      # ARTIFACT: GAMEMODE
      # ==========================================================

      - name: Upload GameMode module
        if: ${{ github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-GameMode-AutoActivator
          path: ~/Tepuy-GameMode-AutoActivator.zip
          retention-days: 30

      # ==========================================================
      # ARTIFACT: KERNEL IMAGE
      # ==========================================================

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz-dtb
            ~/kernel-peridot/out/arch/arm64/boot/Image
          retention-days: 30
          if-no-files-found: ignore

      # ==========================================================
      # ARTIFACT: BUILD LOG
      # ==========================================================

      - name: Upload build log if failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/kernel-peridot/out/build.log
          retention-days: 7
          if-no-files-found: ignore

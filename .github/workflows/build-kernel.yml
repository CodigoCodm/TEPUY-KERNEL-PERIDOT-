name: Build Tepuy Kernel for Poco F6 (peridot)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to use (auto = detect Peridot defconfig)'
        required: true
        default: 'auto'
        type: string

      build_mode:
        description: 'Build mode'
        required: true
        default: 'compat'
        type: choice
        options:
          - compat
          - full
          - both

env:
  ARCH: arm64
  SUBARCH: arm64
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_NOHASHDIR: 'true'
  CCACHE_MAXSIZE: '2G'
  CCACHE_HARDLINK: 'true'

jobs:

  build:

    runs-on: ubuntu-latest

    timeout-minutes: 180

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================================
      # BUILD ENVIRONMENT
      # ==========================================================

      - name: Setup build environment
        env:
          DEBIAN_FRONTEND: noninteractive

        run: |

          sudo apt-get update -qq

          sudo apt-get install -y -qq --no-install-recommends \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            make \
            gcc-aarch64-linux-gnu \
            clang \
            llvm \
            lld \
            device-tree-compiler \
            python3 \
            zip \
            unzip \
            wget \
            curl \
            ccache \
            libelf-dev \
            libncurses-dev \
            libxml2-utils \
            gcc-arm-linux-gnueabi \
            dwarves \
            jq


      # ==========================================================
      # CCACHE
      # ==========================================================

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2

        with:
          key: kernel-peridot
          max-size: 2G


      # ==========================================================
      # CLONE OFFICIAL XIAOMI PERIDOT SOURCE
      # ==========================================================

      - name: Clone official Xiaomi Peridot kernel
        run: |

          set -e

          echo "=============================================="
          echo " CLONE ORIGINAL XIAOMI PERIDOT SOURCE"
          echo "=============================================="

          rm -rf "$HOME/kernel-peridot"

          git clone \
            --depth=1 \
            -b peridot-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            "$HOME/kernel-peridot"

          cd "$HOME/kernel-peridot"

          echo ""
          echo "=== Repository ==="

          git remote -v

          echo ""
          echo "=== Branch ==="

          git branch --show-current

          echo ""
          echo "=== Commit ==="

          git log -1 --oneline


      # ==========================================================
      # DETECT REAL PERIDOT DEFCONFIG
      # ==========================================================

      - name: Detect Peridot defconfig
        run: |

          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " DETECT PERIDOT DEFCONFIG"
          echo "=============================================="

          echo ""
          echo "=== Searching defconfigs ==="

          find arch/arm64/configs \
            -type f \
            \( -name "*peridot*" \
            -o -name "*8635*" \
            -o -name "*sm8635*" \) \
            -print \
            2>/dev/null || true

          echo ""
          echo "=== All relevant configs ==="

          find arch/arm64/configs \
            -type f \
            -print \
            2>/dev/null \
            | grep -Ei \
              'peridot|8635|sm8635|lahaina|waipio|qssi' \
            | head -100 || true

          echo ""

          REQUESTED="${{ github.event.inputs.defconfig }}"

          if [ "$REQUESTED" != "auto" ]; then

            echo "Requested defconfig: $REQUESTED"

            if [ -f "arch/arm64/configs/$REQUESTED" ]; then

              DEFCONFIG="$REQUESTED"

            elif [ -f "arch/arm64/configs/${REQUESTED}_defconfig" ]; then

              DEFCONFIG="${REQUESTED}_defconfig"

            else

              echo ""
              echo "[ERROR] Requested defconfig not found:"
              echo "$REQUESTED"
              echo ""

              echo "Available configs:"
              find arch/arm64/configs \
                -maxdepth 1 \
                -type f \
                -printf '%f\n' \
                | sort \
                | grep -Ei \
                  'peridot|8635|sm8635' \
                || true

              exit 1

            fi

          else

            echo "Automatic Peridot defconfig detection..."

            DEFCONFIG=""

            # --------------------------------------------------
            # Prefer exact Peridot names
            # --------------------------------------------------

            for candidate in \
              peridot_defconfig \
              peridot.config \
              peridot_defconfig_user \
              vendor/peridot_defconfig \
              vendor_peridot_defconfig
            do

              if [ -f "arch/arm64/configs/$candidate" ]; then

                DEFCONFIG="$candidate"

                echo "[OK] Found: $candidate"

                break

              fi

            done

            # --------------------------------------------------
            # Search recursively if not found
            # --------------------------------------------------

            if [ -z "$DEFCONFIG" ]; then

              FOUND=$(find arch/arm64/configs \
                -type f \
                \( \
                  -iname "*peridot*" \
                  -o -iname "*sm8635*" \
                  -o -iname "*8635*" \
                \) \
                | head -1)

              if [ -n "$FOUND" ]; then

                DEFCONFIG="${FOUND#arch/arm64/configs/}"

                echo "[OK] Detected: $DEFCONFIG"

              fi

            fi

            # --------------------------------------------------
            # Search vendor config names
            # --------------------------------------------------

            if [ -z "$DEFCONFIG" ]; then

              FOUND=$(find arch/arm64/configs \
                -type f \
                | grep -Ei \
                  'vendor.*(peridot|8635)|\
                   (peridot|8635).*vendor' \
                | head -1 || true)

              if [ -n "$FOUND" ]; then

                DEFCONFIG="${FOUND#arch/arm64/configs/}"

                echo "[OK] Detected vendor config:"
                echo "$DEFCONFIG"

              fi

            fi

            # --------------------------------------------------
            # Final fallback: list available configs
            # --------------------------------------------------

            if [ -z "$DEFCONFIG" ]; then

              echo ""
              echo "[ERROR] Could not automatically detect"
              echo "a Peridot/SM8635 defconfig."
              echo ""

              echo "Available configs:"

              find arch/arm64/configs \
                -maxdepth 1 \
                -type f \
                -printf '%f\n' \
                | sort \
                | head -200

              exit 1

            fi

          fi

          echo ""
          echo "=============================================="
          echo " SELECTED DEFCONFIG"
          echo "=============================================="
          echo "$DEFCONFIG"

          echo "TEPUY_DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"


      # ==========================================================
      # APPLY ORIGINAL TEPUY COMPAT PATCHER
      # ==========================================================

      - name: Apply Tepuy GameMode patches (COMPAT)
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'

        run: |

          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " APPLY ORIGINAL TEPUY COMPAT PATCH"
          echo "=============================================="

          python3 \
            "${{ github.workspace }}/tepuy-patcher-compat.py" \
            "$HOME/kernel-peridot"

          echo ""
          echo "=== Verifying KMI-safe modifications ==="

          grep -n \
            "tepuy_game_mode" \
            kernel/tepuy_sysfs.c \
            2>/dev/null \
            | head -5 \
            || true

          grep -n \
            "tepuy_game_mode" \
            drivers/thermal/thermal_core.c \
            2>/dev/null \
            | head -5 \
            || true

          grep -n \
            "tepuy_game_mode" \
            drivers/cpufreq/cpufreq.c \
            2>/dev/null \
            | head -5 \
            || true

          echo ""
          echo "[OK] Original Tepuy COMPAT patch applied"


      # ==========================================================
      # FULL PATCH
      # ==========================================================

      - name: Apply Tepuy GameMode patches (FULL)
        if: github.event.inputs.build_mode == 'full'

        run: |

          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " APPLY TEPUY FULL PATCH"
          echo "=============================================="

          python3 \
            "${{ github.workspace }}/tepuy-patcher.py" \
            "$HOME/kernel-peridot"

          echo ""
          echo "=== Verifying vendor driver modifications ==="

          grep -n \
            "tepuy_game_mode" \
            drivers/cpufreq/qcom-cpufreq-hw.c \
            2>/dev/null \
            | head -5 \
            || true

          grep -n \
            "tepuy_game_mode" \
            drivers/gpu/drm/msm/adreno/adreno_gpu.c \
            2>/dev/null \
            | head -3 \
            || true

          grep -n \
            "tepuy_game_mode" \
            drivers/gpu/drm/msm/adreno/a6xx_gmu.c \
            2>/dev/null \
            | head -3 \
            || true


      # ==========================================================
      # BUILD KERNEL
      # ==========================================================

      - name: Build kernel and modules
        run: |

          set -o pipefail

          cd "$HOME/kernel-peridot"

          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          export LLVM=1
          export LLVM_IAS=1

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          echo "=============================================="
          echo " START KERNEL BUILD"
          echo "=============================================="

          echo ""
          echo "Defconfig:"
          echo "$TEPUY_DEFCONFIG"

          echo ""
          echo "Build mode:"
          echo "${{ github.event.inputs.build_mode }}"

          echo ""
          echo "=============================================="
          echo " DEFCONFIG"
          echo "=============================================="

          make \
            O=out \
            "$TEPUY_DEFCONFIG" \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " KERNEL"
          echo "=============================================="

          make \
            O=out \
            -j"$(nproc --all)" \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " MODULES"
          echo "=============================================="

          make \
            O=out \
            -j"$(nproc --all)" \
            modules \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " INSTALL MODULES"
          echo "=============================================="

          make \
            O=out \
            INSTALL_MOD_PATH="$HOME/modules_staging" \
            INSTALL_MOD_STRIP=1 \
            modules_install \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=== Kernel images ==="

          find out \
            -name "Image*" \
            -type f \
            2>/dev/null

          echo ""
          echo "=== Modules count ==="

          find "$HOME/modules_staging" \
            -name "*.ko" \
            2>/dev/null \
            | wc -l


      # ==========================================================
      # PREPARE IMAGE
      # ==========================================================

      - name: Prepare kernel image
        run: |

          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " PREPARE KERNEL IMAGE"
          echo "=============================================="

          KERNEL_IMAGE=""

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then

            KERNEL_IMAGE="out/arch/arm64/boot/Image.gz-dtb"

          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then

            KERNEL_IMAGE="out/arch/arm64/boot/Image.gz"

          elif [ -f "out/arch/arm64/boot/Image" ]; then

            KERNEL_IMAGE="out/arch/arm64/boot/Image"

          fi

          if [ -z "$KERNEL_IMAGE" ]; then

            echo "ERROR: No kernel image found!"

            find out/arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              2>/dev/null || true

            exit 1

          fi

          echo "Kernel image:"
          echo "$KERNEL_IMAGE"

          if [ "$KERNEL_IMAGE" != \
               "out/arch/arm64/boot/Image.gz" ]; then

            cp \
              "$KERNEL_IMAGE" \
              out/arch/arm64/boot/Image.gz

          fi

          ls -lh \
            out/arch/arm64/boot/Image.gz


      # ==========================================================
      # MAGISKBOOT
      # ==========================================================

      - name: Download magiskboot
        run: |

          set -e

          echo "=== Downloading magiskboot ==="

          mkdir -p "$HOME/magisk"

          cd "$HOME/magisk"

          APK_URL=$(
            curl -sf \
              https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
              | jq -r \
              '.assets[]
               | select(.name | test("^Magisk-v.*\\.apk$"))
               | .browser_download_url' \
              | head -n1
          )

          if [ -z "$APK_URL" ] ||
             [ "$APK_URL" = "null" ]; then

            echo "WARNING: latest APK unavailable."

            wget -q \
              --timeout=30 \
              "https://github.com/topjohnwu/Magisk/releases/download/v28.1/Magisk-v28.1.apk" \
              -O magisk.apk \
              || true

          else

            curl -Lfo \
              magisk.apk \
              "$APK_URL"

          fi

          if [ ! -f magisk.apk ]; then

            echo "ERROR: Magisk APK unavailable."

            exit 1

          fi

          unzip -j \
            magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d . \
            2>/dev/null \
            || true

          if [ ! -f libmagiskboot.so ]; then

            unzip -j \
              magisk.apk \
              "lib/arm64-v8a/libmagiskboot.so" \
              -d . \
              2>/dev/null \
              || true

          fi

          if [ ! -f libmagiskboot.so ]; then

            echo "ERROR: Could not extract magiskboot"

            exit 1

          fi

          mv libmagiskboot.so magiskboot

          chmod +x magiskboot

          ./magiskboot


      # ==========================================================
      # BUILD BOOT
      # ==========================================================

      - name: Build boot.img
        run: |

          set -e

          cd "$HOME"

          echo "=============================================="
          echo " BUILD TEPUY BOOT.IMG"
          echo "=============================================="

          if [ ! -f \
            "${{ github.workspace }}/boot_stock.img" ]; then

            echo "ERROR: boot_stock.img not found!"

            exit 1

          fi

          if [ ! -f "$HOME/magisk/magiskboot" ]; then

            echo "ERROR: magiskboot not available"

            exit 1

          fi

          cp \
            "${{ github.workspace }}/boot_stock.img" \
            "$HOME/boot_stock.img"

          echo ""
          echo "=== Unpacking stock boot.img ==="

          "$HOME/magisk/magiskboot" \
            unpack \
            boot_stock.img

          echo ""
          echo "=== Replacing kernel ==="

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            "$HOME/kernel"

          echo ""
          echo "=== Repacking ==="

          "$HOME/magisk/magiskboot" \
            repack \
            boot_stock.img \
            boot_tepuy.img

          echo ""
          echo "=== Verifying ==="

          ls -lh "$HOME/boot_tepuy.img"

          file "$HOME/boot_tepuy.img"


      # ==========================================================
      # COMPAT ZIP
      # ==========================================================

      - name: Build COMPAT zip
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'

        run: |

          set -e

          cd "$HOME"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3-compat

          cd AnyKernel3-compat

          cp \
            "${{ github.workspace }}/anykernel-compat.sh" \
            ./anykernel.sh

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            ./Image.gz

          if [ -f \
            "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb" ]; then

            cp \
              "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb" \
              ./dtb

          else

            DTB=$(
              find \
                "$HOME/kernel-peridot/out/arch/arm64/boot/dts" \
                -name "*.dtb" \
                | head -1
            )

            if [ -n "$DTB" ]; then
              cp "$DTB" ./dtb
            fi

          fi

          mkdir -p tools

          if [ -d "${{ github.workspace }}/tools" ]; then

            cp -r \
              "${{ github.workspace }}/tools/"* \
              tools/ \
              2>/dev/null \
              || true

            chmod -R 755 tools/

          fi

          echo "=== Tools ==="

          ls -la tools/ \
            2>/dev/null \
            | head -20

          zip -r9 \
            "$HOME/Tepuy-Kernel-Compat-peridot.zip" \
            * \
            -x "*.zip" "*.git*" "README*"

          echo ""
          echo "COMPAT zip created"

          ls -lh \
            "$HOME/Tepuy-Kernel-Compat-peridot.zip"


      # ==========================================================
      # FULL ZIP
      # ==========================================================

      - name: Build FULL zip
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'

        run: |

          set -e

          cd "$HOME"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3-full

          cd AnyKernel3-full

          cp \
            "${{ github.workspace }}/anykernel-full.sh" \
            ./anykernel.sh

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            ./Image.gz

          if [ -f \
            "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb" ]; then

            cp \
              "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb" \
              ./dtb

          else

            DTB=$(
              find \
                "$HOME/kernel-peridot/out/arch/arm64/boot/dts" \
                -name "*.dtb" \
                | head -1
            )

            if [ -n "$DTB" ]; then
              cp "$DTB" ./dtb
            fi

          fi

          if [ -f \
            "${{ github.workspace }}/dtbo.img" ]; then

            cp \
              "${{ github.workspace }}/dtbo.img" \
              ./dtbo.img

          fi

          mkdir -p \
            _modules \
            _system_dlkm

          python3 \
            "${{ github.workspace }}/prepare-modules.py" \
            --input "$HOME/modules_staging" \
            --vendor-out "_modules" \
            --system-out "_system_dlkm"

          mkdir -p tools

          if [ -d "${{ github.workspace }}/tools" ]; then

            cp -r \
              "${{ github.workspace }}/tools/"* \
              tools/ \
              2>/dev/null \
              || true

            chmod -R 755 tools/

          else

            echo "ERROR: tools directory missing!"

            exit 1

          fi

          if [ -f \
            "${{ github.workspace }}/tools/ak3-core.sh" ]; then

            cp \
              "${{ github.workspace }}/tools/ak3-core.sh" \
              tools/ak3-core.sh

          fi

          zip -r9 \
            "$HOME/Tepuy-Kernel-Full-peridot.zip" \
            * \
            -x "*.zip" "*.git*" "README*"

          echo ""
          echo "FULL zip created"

          ls -lh \
            "$HOME/Tepuy-Kernel-Full-peridot.zip"


      # ==========================================================
      # GAMEMODE MODULE
      # ==========================================================

      - name: Build GameMode Auto-Activator module
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'

        run: |

          set -e

          mkdir -p "$HOME/gamemode-module"

          cd "$HOME/gamemode-module"

          cat > module.prop <<'EOF'
id=tepuy-gamemode-auto
name=Tepuy GameMode Auto-Activator
version=1.0
versionCode=1
author=CodigoCodm
description=Activa automaticamente Tepuy GameMode al arrancar. Requiere kernel Tepuy.
EOF

          cat > service.sh <<'EOF'
#!/system/bin/sh

LOG_FILE="/data/local/tmp/tepuy-gamemode.log"
SYSFS_NODE="/sys/kernel/tepuy_boost/game_mode"
MAX_WAIT=30

log_msg() {
    echo "[$(date "+%Y-%m-%d %H:%M:%S")] $1" >> "$LOG_FILE"
}

rm -f "$LOG_FILE"

log_msg "=== Tepuy GameMode Auto-Activator iniciado ==="

waited=0

while [ ! -f "$SYSFS_NODE" ]; do

    sleep 1

    waited=$((waited + 1))

    if [ "$waited" -ge "$MAX_WAIT" ]; then

        log_msg "ERROR: sysfs node no aparecio despues de ${MAX_WAIT}s"

        exit 1

    fi

done

log_msg "sysfs node encontrado despues de ${waited}s"

current=$(cat "$SYSFS_NODE" 2>/dev/null)

log_msg "Estado actual: $current"

if echo 1 > "$SYSFS_NODE" 2>/dev/null; then

    new_state=$(cat "$SYSFS_NODE" 2>/dev/null)

    log_msg "SUCCESS: GameMode activado. Estado: $new_state"

else

    log_msg "ERROR: No se pudo escribir en sysfs."

    exit 1

fi

log_msg "=== Activacion completada ==="
EOF

          chmod 755 service.sh

          zip -r9 \
            "$HOME/Tepuy-GameMode-AutoActivator.zip" \
            module.prop \
            service.sh

          ls -lh \
            "$HOME/Tepuy-GameMode-AutoActivator.zip"


      # ==========================================================
      # ARTIFACT BOOT
      # ==========================================================

      - name: Upload boot.img
        uses: actions/upload-artifact@v4

        with:
          name: boot_tepuy
          path: ~/boot_tepuy.img
          retention-days: 30


      # ==========================================================
      # ARTIFACT COMPAT
      # ==========================================================

      - name: Upload COMPAT zip
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'

        uses: actions/upload-artifact@v4

        with:
          name: Tepuy-Kernel-Compat-peridot
          path: ~/Tepuy-Kernel-Compat-peridot.zip
          retention-days: 30


      # ==========================================================
      # ARTIFACT FULL
      # ==========================================================

      - name: Upload FULL zip
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'

        uses: actions/upload-artifact@v4

        with:
          name: Tepuy-Kernel-Full-peridot
          path: ~/Tepuy-Kernel-Full-peridot.zip
          retention-days: 30


      # ==========================================================
      # ARTIFACT GAMEMODE
      # ==========================================================

      - name: Upload GameMode Auto-Activator
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'

        uses: actions/upload-artifact@v4

        with:
          name: Tepuy-GameMode-AutoActivator
          path: ~/Tepuy-GameMode-AutoActivator.zip
          retention-days: 30


      # ==========================================================
      # ARTIFACT IMAGE
      # ==========================================================

      - name: Upload kernel image
        uses: actions/upload-artifact@v4

        with:
          name: kernel-image

          path: |
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz-dtb
            ~/kernel-peridot/out/arch/arm64/boot/Image

          retention-days: 30

          if-no-files-found: ignore


      # ==========================================================
      # BUILD LOG
      # ==========================================================

      - name: Upload build log if failed
        if: failure()

        uses: actions/upload-artifact@v4

        with:
          name: build-log
          path: ~/kernel-peridot/out/build.log
          retention-days: 7

name: Build Tepuy Kernel for Poco F6 (Peridot HyperOS)

on:
workflow_dispatch:
inputs:
defconfig:
description: "Defconfig to use"
required: true
default: "peridot_defconfig"
type: string

```
  build_mode:
    description: "Build mode"
    required: true
    default: compat
    type: choice
    options:
      - compat
      - full
      - both
```

env:
ARCH: arm64
SUBARCH: arm64
CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
CCACHE_NOHASHDIR: "true"
CCACHE_MAXSIZE: "2G"
CCACHE_HARDLINK: "true"

jobs:
build:
runs-on: ubuntu-22.04
timeout-minutes: 180

```
steps:

  ###############################################################
  # Checkout Tepuy Repository
  ###############################################################

  - name: Checkout Tepuy Repository
    uses: actions/checkout@v4

  ###############################################################
  # Build Environment
  ###############################################################

  - name: Install Build Dependencies
    env:
      DEBIAN_FRONTEND: noninteractive
    run: |
      sudo apt update

      sudo apt install -y \
        bc bison flex build-essential \
        libssl-dev libelf-dev libncurses-dev \
        python3 python-is-python3 python3-pip \
        clang llvm lld \
        gcc-aarch64-linux-gnu \
        gcc-arm-linux-gnueabi \
        device-tree-compiler \
        ccache curl wget jq zip unzip dwarves

  ###############################################################
  # ccache
  ###############################################################

  - name: Setup ccache
    uses: hendrikmuhs/ccache-action@v1.2
    with:
      key: tepuy-peridot-hyperos
      max-size: 2G

  ###############################################################
  # Clone Xiaomi HyperOS Kernel Source
  ###############################################################

  - name: Clone Xiaomi Kernel Source
    run: |

      git clone --depth=1 \
        https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
        $HOME/kernel-peridot

      cd $HOME/kernel-peridot

      git checkout peridot-s-oss

      echo "=================================="
      echo "Kernel commit:"
      git log --oneline -1
      echo "=================================="

  ###############################################################
  # Apply Tepuy patches
  ###############################################################

  - name: Apply Tepuy HyperOS Patch (Compat)
    if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
    run: |
      cd $HOME/kernel-peridot
      python3 ${{ github.workspace }}/tepuy-patcher-hyperos.py \
        $HOME/kernel-peridot

  - name: Apply Tepuy HyperOS Patch (Full)
    if: github.event.inputs.build_mode == 'full'
    run: |
      cd $HOME/kernel-peridot
      python3 ${{ github.workspace }}/tepuy-patcher-hyperos.py \
        $HOME/kernel-peridot

  ###############################################################
  # Build Kernel
  ###############################################################

  - name: Build Kernel
    run: |

      cd $HOME/kernel-peridot

      mkdir -p out

      export ARCH=arm64
      export SUBARCH=arm64

      export LLVM=1
      export LLVM_IAS=1

      export CC=clang

      export CLANG_TRIPLE=aarch64-linux-gnu-
      export CROSS_COMPILE=aarch64-linux-gnu-
      export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      export USE_CCACHE=1
      export CCACHE_EXEC=/usr/bin/ccache

      make O=out ${{ github.event.inputs.defconfig }}

      make O=out -j$(nproc)

      make O=out modules -j$(nproc)

      make O=out \
        INSTALL_MOD_PATH=$HOME/modules_staging \
        INSTALL_MOD_STRIP=1 \
        modules_install

      echo ""
      echo "=========== OUTPUTS ==========="
      find out/arch/arm64/boot -maxdepth 1 -type f
      echo "==============================="

  ###############################################################
  # Prepare RAW Image
  ###############################################################

  - name: Prepare Kernel Images
    run: |

      cd $HOME/kernel-peridot

      cp out/arch/arm64/boot/Image $HOME/Image

      gzip -c out/arch/arm64/boot/Image > $HOME/Image.gz

      ls -lh $HOME/Image
      ls -lh $HOME/Image.gz

  ###############################################################
  # Download MagiskBoot
  ###############################################################

  - name: Download MagiskBoot
    run: |

      mkdir -p $HOME/magisk

      cd $HOME/magisk

      curl -L \
        https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk-v29.0.apk \
        -o magisk.apk

      unzip -j magisk.apk lib/x86_64/libmagiskboot.so

      mv libmagiskboot.so magiskboot

      chmod +x magiskboot

      ./magiskboot

  ###############################################################
  # Build boot_tepuy.img (RAW Kernel)
  ###############################################################

  - name: Build boot_tepuy.img
    run: |

      cd $HOME

      if [ ! -f "${{ github.workspace }}/boot_stock.img" ]; then
        echo "ERROR: boot_stock.img missing."
        exit 1
      fi

      cp ${{ github.workspace }}/boot_stock.img .

      echo "========== UNPACK =========="

      $HOME/magisk/magiskboot unpack -h boot_stock.img

      echo "========== REPLACE RAW KERNEL =========="

      mv kernel kernel_stock

      cp $HOME/Image kernel

      echo "========== REPACK =========="

      $HOME/magisk/magiskboot repack boot_stock.img

      mv new-boot.img boot_tepuy.img

      ls -lh boot_tepuy.img

      echo "Boot image generated successfully."

  ###############################################################
  # AnyKernel3 (Optional)
  ###############################################################

  - name: Build Tepuy Compat Zip
    if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
    run: |

      cd $HOME

      git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3

      cd AK3

      cp ${{ github.workspace }}/anykernel-compat.sh anykernel.sh

      cp $HOME/Image.gz Image.gz

      DTB=$(find $HOME/kernel-peridot/out/arch/arm64/boot/dts -name "*.dtb" | head -1)

      if [ -n "$DTB" ]; then
        cp "$DTB" dtb
      fi

      zip -r9 $HOME/Tepuy-Kernel-Compat-peridot.zip . \
        -x "*.git*" "*.zip"

  ###############################################################
  # Upload boot_tepuy.img
  ###############################################################

  - name: Upload boot_tepuy.img
    uses: actions/upload-artifact@v4
    with:
      name: boot_tepuy
      path: ~/boot_tepuy.img
      retention-days: 30

  ###############################################################
  # Upload RAW Image
  ###############################################################

  - name: Upload RAW Kernel
    uses: actions/upload-artifact@v4
    with:
      name: kernel-image-raw
      path: ~/Image
      retention-days: 30

  ###############################################################
  # Upload GZIP Image
  ###############################################################

  - name: Upload GZIP Kernel
    uses: actions/upload-artifact@v4
    with:
      name: kernel-image-gzip
      path: ~/Image.gz
      retention-days: 30

  ###############################################################
  # Upload AnyKernel Zip
  ###############################################################

  - name: Upload Tepuy Zip
    if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
    uses: actions/upload-artifact@v4
    with:
      name: Tepuy-Kernel-Compat-peridot
      path: ~/Tepuy-Kernel-Compat-peridot.zip
      retention-days: 30

  ###############################################################
  # Upload Modules
  ###############################################################

  - name: Upload Kernel Modules
    uses: actions/upload-artifact@v4
    with:
      name: kernel-modules
      path: ~/modules_staging
      retention-days: 30

  ###############################################################
  # Upload Build Log
  ###############################################################

  - name: Upload Build Log
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: build-log
      path: ~/kernel-peridot/out/build.log
      retention-days: 30
```

name: Build Tepuy Kernel for Poco F6 (peridot)

'on':
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to use (default: gki_defconfig)'
        required: true
        default: 'gki_defconfig'
        type: string

env:
  ARCH: arm64
  SUBARCH: arm64
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_NOHASHDIR: 'true'
  CCACHE_MAXSIZE: '2G'
  CCACHE_HARDLINK: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        env:
          DEBIAN_FRONTEND: noninteractive
          DEBIAN_PRIORITY: critical
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git bc bison flex libssl-dev make \
            gcc-aarch64-linux-gnu clang llvm lld \
            device-tree-compiler python3 zip unzip \
            wget ccache libelf-dev libncurses-dev \
            libxml2-utils gcc-arm-linux-gnueabi \
            dwarves jq

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-peridot
          max-size: 2G

      - name: Verify system Clang
        run: |
          echo "System Clang version:"
          clang --version

      - name: Clone LineageOS kernel for peridot
        run: |
          git clone --depth=1 -b lineage-23.2 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8635 \
            $HOME/kernel-peridot

      - name: List available defconfigs
        run: |
          echo "=== Defconfigs disponibles ==="
          ls $HOME/kernel-peridot/arch/arm64/configs/ 2>/dev/null || echo "No hay archivos en arch/arm64/configs/"
          echo ""
          echo "=== Archivos de config en raiz ==="
          ls $HOME/kernel-peridot/*.config 2>/dev/null || true
          ls $HOME/kernel-peridot/build.config* 2>/dev/null || true

      - name: Apply Tepuy GameMode patches (Python)
        run: |
          cd $HOME/kernel-peridot
          python3 ${{ github.workspace }}/tepuy-patcher.py $HOME/kernel-peridot
          echo ""
          echo "=== Verifying modifications ==="
          grep -n "tepuy_game_mode" drivers/cpufreq/qcom-cpufreq-hw.c | head -5
          grep -n "tepuy_game_mode" drivers/gpu/drm/msm/adreno/adreno_gpu.c | head -3
          grep -n "tepuy_game_mode" drivers/gpu/drm/msm/adreno/a6xx_gmu.c | head -3

      - name: Build kernel
        run: |
          cd $HOME/kernel-peridot
          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          export LLVM=1
          export LLVM_IAS=1
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          # Compilar defconfig
          make O=out ${{ github.event.inputs.defconfig }} 2>&1 | tee -a out/build.log

          # Compilar kernel
          make O=out -j$(nproc --all) 2>&1 | tee -a out/build.log

          echo ""
          echo "=== Build output files ==="
          find out -name "Image*" -type f 2>/dev/null | while read f; do
            echo "Found: $f ($(stat -c%s "$f" 2>/dev/null || echo 'unknown') bytes)"
          done

          echo ""
          echo "=== arch/arm64/boot contents ==="
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "Directory does not exist"

      - name: Prepare kernel image for AnyKernel3
        run: |
          cd $HOME/kernel-peridot

          # Buscar la imagen del kernel generada
          KERNEL_IMAGE=""
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image.gz-dtb"
            echo "Found Image.gz-dtb"
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image.gz"
            echo "Found Image.gz"
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image"
            echo "Found Image"
          fi

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "ERROR: No kernel image found!"
            echo "Contents of out/arch/arm64/boot/:"
            ls -la out/arch/arm64/boot/ 2>/dev/null || echo "Directory not found"
            exit 1
          fi

          # Solo copiar si no es ya Image.gz
          if [ "$KERNEL_IMAGE" != "out/arch/arm64/boot/Image.gz" ]; then
            cp "$KERNEL_IMAGE" out/arch/arm64/boot/Image.gz
            echo "Copied kernel image to Image.gz"
          else
            echo "Image.gz already exists, no copy needed"
          fi

      - name: Prepare AnyKernel3
        run: |
          cd $HOME
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          cp ${{ github.workspace }}/anykernel.sh ./anykernel.sh
          cp $HOME/kernel-peridot/out/arch/arm64/boot/Image.gz ./Image.gz

          # --- FIX: reemplazar binarios armeabi (32-bit) por arm64 (aarch64) ---
          # El template osm0sis/AnyKernel3 trae por defecto busybox, magiskboot
          # y magiskpolicy compilados en ARM de 32 bits en tools/. OrangeFox
          # 12.0.5 para peridot es una recovery de 64 bits pura y no puede
          # ejecutar esos binarios de 32 bits, lo que produce el error
          # "Busybox setup failed. Aborting..." al flashear.
          # Aqui los reemplazamos por las versiones arm64-v8a incluidas
          # dentro del APK oficial de Magisk, resolviendo el nombre del
          # asset dinamicamente via la API de GitHub (el nombre del archivo
          # cambia con cada version, ej. Magisk-v30.7.apk).
          echo "=== Resolviendo URL del APK de Magisk (release mas reciente) ==="
          APK_URL=$(curl -sf https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | jq -r '.assets[] | select(.name | test("^Magisk-v.*\\.apk$")) | .browser_download_url' \
            | head -n1)

          if [ -z "$APK_URL" ] || [ "$APK_URL" == "null" ]; then
            echo "ERROR: No se pudo resolver la URL del APK de Magisk desde la API de GitHub."
            echo "Respuesta de la API:"
            curl -sf https://api.github.com/repos/topjohnwu/Magisk/releases/latest || true
            exit 1
          fi

          echo "APK resuelto: $APK_URL"
          curl -Lfo /tmp/magisk.apk "$APK_URL"

          echo "=== Verificando que el archivo descargado sea un zip valido ==="
          if ! unzip -tq /tmp/magisk.apk > /dev/null; then
            echo "ERROR: /tmp/magisk.apk no es un zip valido. Descarga fallida o URL incorrecta."
            file /tmp/magisk.apk
            exit 1
          fi

          unzip -o /tmp/magisk.apk -d /tmp/magisk_extract > /dev/null

          echo "=== Contenido disponible en lib/arm64-v8a ==="
          ls -la /tmp/magisk_extract/lib/arm64-v8a/

          cp /tmp/magisk_extract/lib/arm64-v8a/libbusybox.so      tools/busybox
          cp /tmp/magisk_extract/lib/arm64-v8a/libmagiskboot.so   tools/magiskboot
          cp /tmp/magisk_extract/lib/arm64-v8a/libmagiskpolicy.so tools/magiskpolicy
          chmod 755 tools/busybox tools/magiskboot tools/magiskpolicy

          echo "=== Verificando arquitectura de binarios reemplazados ==="
          file tools/busybox tools/magiskboot tools/magiskpolicy

          # Verificacion dura: si alguno no quedo en aarch64, aborta el build
          for bin in tools/busybox tools/magiskboot tools/magiskpolicy; do
            if ! file "$bin" | grep -qi "aarch64"; then
              echo "ERROR: $bin no quedo en arquitectura aarch64. Abortando build."
              exit 1
            fi
          done
          # --- fin del fix ---

          zip -r9 $HOME/Tepuy-GameMode-peridot.zip * -x "*.zip" "*.git*" "README*"
          echo "AnyKernel3 zip created"
          ls -lh $HOME/Tepuy-GameMode-peridot.zip

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz-dtb
            ~/kernel-peridot/out/arch/arm64/boot/Image
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-GameMode-peridot
          path: ~/Tepuy-GameMode-peridot.zip
          retention-days: 30

      - name: Upload build log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/kernel-peridot/out/build.log
          retention-days: 7

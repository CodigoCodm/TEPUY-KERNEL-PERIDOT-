name: TEPUY Peridot - Xiaomi Build Environment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Prepare Xiaomi Peridot Build
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Codigocodm
      KBUILD_BUILD_HOST: TEPUY

    steps:

      # ============================================================
      # 1. CHECKOUT TEPUY
      # ============================================================

      - name: Checkout TEPUY
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # 2. DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            pahole \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip

      # ============================================================
      # 3. XIAOMI KERNEL
      # ============================================================

      - name: Clone Xiaomi Peridot kernel
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch peridot-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            kernel

          cd kernel

          echo "=========================================="
          echo "PERIDOT KERNEL"
          echo "=========================================="

          git branch --show-current
          git rev-parse HEAD

            # ============================================================
      # 4. LOCATE MSM-KERNEL BUILD TREE
      # ============================================================

      - name: Locate Xiaomi MSM build environment
        run: |
          set -eux

          echo "=========================================="
          echo "SEARCHING MSM BUILD ENVIRONMENT"
          echo "=========================================="

          rm -rf msm-kernel

          # --------------------------------------------------------
          # Primero intentamos el repositorio ACK/MSM utilizado
          # por los árboles Qualcomm.
          # --------------------------------------------------------

          git clone \
            --depth=1 \
            https://android.googlesource.com/kernel/msm \
            msm-kernel \
            || true

          if [ -f msm-kernel/build.config.msm.pineapple ]; then
            echo "[OK] Found build.config.msm.pineapple"
          else
            echo "[INFO] Standard MSM repository does not contain it."

            rm -rf msm-kernel

            # ------------------------------------------------------
            # Intento Qualcomm kernel-build
            # ------------------------------------------------------

            git clone \
              --depth=1 \
              https://github.com/Qualcomm/kernel.git \
              msm-kernel \
              || true
          fi

          echo ""
          echo "=========================================="
          echo "SEARCH RESULTS"
          echo "=========================================="

          if [ -f msm-kernel/build.config.msm.pineapple ]; then
            echo "[SUCCESS]"
            echo "Found:"
            echo "msm-kernel/build.config.msm.pineapple"
          else
            echo "[NOT FOUND]"
            echo ""
            echo "Repositories tested:"
            echo "1. android.googlesource.com/kernel/msm"
            echo "2. github.com/Qualcomm/kernel.git"
            echo ""
            echo "Searching recursively:"
            find msm-kernel \
              -type f \
              -name 'build.config.msm.pineapple' \
              -print \
              2>/dev/null \
              || true

            exit 1
          fi

      # ============================================================
      # 5. COMPROBAR BUILD CONFIG
      # ============================================================

      - name: Inspect Peridot build config
        run: |
          set -eux

          echo "ROOT:"
          pwd

          echo ""
          echo "Directory tree:"
          find . \
            -maxdepth 2 \
            -type d \
            | sort

          echo ""
          echo "Peridot config:"
          cat kernel/build.config.msm.peridot

      # ============================================================
      # 6. COMPROBAR DEPENDENCIA MSM-KERNEL
      # ============================================================

      - name: Verify MSM kernel dependency
        run: |
          set -eux

          test -f kernel/build.config.msm.peridot

          echo "Checking required inherited config..."

          if [ -f msm-kernel/build.config.msm.pineapple ]; then
            echo "[OK] msm-kernel/build.config.msm.pineapple"
          else
            echo "[ERROR] msm-kernel/build.config.msm.pineapple NOT FOUND"

            echo ""
            echo "Available msm-kernel configs:"
            find msm-kernel \
              -type f \
              -name 'build.config*' \
              | sort

            exit 1
          fi

      # ============================================================
      # 7. CREAR ROOT_DIR
      # ============================================================

      - name: Export Xiaomi build environment
        run: |
          set -eux

          echo "ROOT_DIR=$PWD" >> "$GITHUB_ENV"

          echo "KERNEL_DIR=kernel" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "BUILD ENVIRONMENT"
          echo "=========================================="

          echo "ROOT_DIR=$PWD"
          echo "KERNEL_DIR=kernel"

      # ============================================================
      # 8. SOURCE BUILD CONFIG
      # ============================================================

      - name: Load Peridot build configuration
        run: |
          set -eux

          export ROOT_DIR="$PWD"
          export KERNEL_DIR=kernel

          cd kernel

          echo "=========================================="
          echo "LOADING PERIDOT CONFIG"
          echo "=========================================="

          source ./build.config.msm.peridot

          echo ""
          echo "=========================================="
          echo "EXPORTED VARIABLES"
          echo "=========================================="

          env | grep -E \
            '^(ROOT_DIR|KERNEL_DIR|MSM_|BUILD_|DEFCONFIG|ARCH|SUBARCH|OUT_DIR|BRANCH|VARIANT|LLVM|CLANG)' \
            | sort \
            || true

      # ============================================================
      # 9. INSPECCIONAR MSM-KERNEL
      # ============================================================

      - name: Inspect inherited build system
        run: |
          set -eux

          echo "=========================================="
          echo "MSM-KERNEL BUILD SYSTEM"
          echo "=========================================="

          echo ""
          echo "Build configs:"
          find msm-kernel \
            -type f \
            -name 'build.config*' \
            | sort

          echo ""
          echo "Shell scripts:"
          find msm-kernel \
            -type f \
            -name '*.sh' \
            | sort

          echo ""
          echo "Bazel files:"
          find msm-kernel \
            -type f \
            \( \
              -name 'BUILD.bazel' \
              -o -name '.bazelrc*' \
              -o -name '*.bzl' \
            \) \
            | sort

      # ============================================================
      # 10. BUSCAR BUILD.SH GLOBAL
      # ============================================================

      - name: Locate build entry point
        run: |
          set -eux

          echo "=========================================="
          echo "BUILD ENTRY POINTS"
          echo "=========================================="

          find . \
            -type f \
            \( \
              -name 'build.sh' \
              -o -name 'build/build.sh' \
              -o -name 'build.sh.inc' \
            \) \
            | sort

          echo ""
          echo "Files referencing build.config.msm.pineapple:"

          grep -Ril \
            "build.config.msm.pineapple" \
            . \
            --include='*.sh' \
            --include='*.py' \
            --include='*.mk' \
            --include='BUILD*' \
            2>/dev/null \
            | sort \
            | head -100 \
            || true

      # ============================================================
      # 11. BAZEL INFORMATION
      # ============================================================

      - name: Inspect Bazel
        run: |
          set -eux

          echo "=========================================="
          echo "BAZEL"
          echo "=========================================="

          bazel --version || true
          bazelisk --version || true

          cd kernel

          echo ""
          echo "Kernel BUILD.bazel:"
          test -f BUILD.bazel

          sed -n '1,260p' BUILD.bazel

      # ============================================================
      # 12. SEARCH KERNEL TARGETS
      # ============================================================

      - name: Search kernel Bazel targets
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "BAZEL TARGET SEARCH"
          echo "=========================================="

          bazel query \
            'kind(".*rule", //...)' \
            2>/dev/null \
            | grep -Ei \
              'kernel|peridot|msm|image' \
            | head -200 \
            || true

      # ============================================================
      # 13. CREATE OUTPUT
      # ============================================================

      - name: Prepare output
        run: |
          set -eux

          mkdir -p out

          {
            echo "TEPUY PERIDOT"
            echo "XIAOMI BUILD ENVIRONMENT"
            echo "================================"
            echo ""
            echo "Kernel commit:"
            git -C kernel rev-parse HEAD
            echo ""
            echo "kernel_build commit:"
            git -C msm-kernel rev-parse HEAD
          } > out/build-info.txt

      # ============================================================
      # 14. UPLOAD DIAGNOSTIC ARTIFACT
      # ============================================================

      - name: Upload build diagnostics
        uses: actions/upload-artifact@v5
        with:
          name: Tepuy-Peridot-Xiaomi-Build-Diagnostics
          if-no-files-found: error
          path: |
            out/build-info.txt
            kernel/build.config.msm.peridot
            kernel/BUILD.bazel
            msm-kernel/build.config.msm.pineapple

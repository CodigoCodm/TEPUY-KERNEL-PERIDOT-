
name: Tepuy Kernel v3.1 Peridot

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "compat | full | both"
        required: true
        default: compat
        type: choice
        options: [compat, full, both]

env:
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex make clang llvm lld \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            device-tree-compiler ccache jq curl unzip zip gzip file libelf-dev

      - name: Clone Xiaomi kernel
        run: |
          git clone --depth=1 -b peridot-u-oss \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git $HOME/kernel-peridot

      - name: Fix HWID Kconfig
        run: |
          cd $HOME/kernel-peridot
          [ -f drivers/misc/Kconfig ] && \
          sed -i 's|^[[:space:]]*source "drivers/misc/hwid/Kconfig"|# source "drivers/misc/hwid/Kconfig"|' drivers/misc/Kconfig || true

      - name: Apply Tepuy patches
        run: |
          cd $HOME/kernel-peridot
          if [ "${{ github.event.inputs.build_mode }}" = compat ] || [ "${{ github.event.inputs.build_mode }}" = both ]; then
            python3 "${{ github.workspace }}/tepuy-patcher-compat.py" .
          fi
          if [ "${{ github.event.inputs.build_mode }}" = full ] || [ "${{ github.event.inputs.build_mode }}" = both ]; then
            python3 "${{ github.workspace }}/tepuy-patcher.py" .
          fi

      - name: Build kernel
        run: |
          set -eo pipefail
          cd $HOME/kernel-peridot
          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out gki_defconfig

          make O=out \
            KCONFIG_ALLCONFIG=arch/arm64/configs/vendor/peridot_GKI.config \
            alldefconfig

          make O=out -j$(nproc)

      - name: Diagnose kernel output
        run: |
          cd $HOME/kernel-peridot
          echo "===== BUILD OUTPUT ====="
          find out/arch/arm64/boot -maxdepth 2 -type f -exec ls -lh {} \;
          for f in out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb; do
            [ -f "$f" ] && file "$f"
          done

      - name: Prepare Image.gz (FIX 4MB kernel)
        run: |
          set -e
          cd $HOME/kernel-peridot

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image.gz
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Using Image.gz"
          elif [ -f out/arch/arm64/boot/Image ]; then
            gzip -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.gz
          else
            echo "Kernel image missing"
            exit 1
          fi

          ls -lh out/arch/arm64/boot/Image*

      - name: Handle CONFIG_MODULES
        run: |
          cd $HOME/kernel-peridot
          MODULES=$(grep '^CONFIG_MODULES=' out/.config || true)
          echo "$MODULES"

          mkdir -p $HOME/modules_staging

          if [ "$MODULES" = "CONFIG_MODULES=y" ]; then
            make O=out -j$(nproc) modules
            make O=out INSTALL_MOD_PATH=$HOME/modules_staging INSTALL_MOD_STRIP=1 modules_install
          else
            echo "Skipping modules."
          fi

      - name: Download MagiskBoot
        run: |
          mkdir -p $HOME/magisk
          cd $HOME/magisk
          APK=$(curl -sf https://api.github.com/repos/topjohnwu/Magisk/releases/latest | jq -r '.assets[]|select(.name|test("^Magisk-v.*\\.apk$"))|.browser_download_url' | head -n1)
          curl -Lfo magisk.apk "$APK"
          unzip -j magisk.apk "lib/x86_64/libmagiskboot.so" -d . 2>/dev/null || unzip -j magisk.apk "lib/arm64-v8a/libmagiskboot.so" -d .
          mv libmagiskboot.so magiskboot
          chmod +x magiskboot

      - name: Download stock boot
        run: |
          mkdir -p $HOME/bootwork
          curl -L \
            -o $HOME/bootwork/boot.img \
            https://github.com/CodigoCodm/TEPUY-KERNEL-PERIDOT-/releases/download/%23Kernel/boot.img

      - name: Build boot_tepuy.img
        run: |
          set -e
          cd $HOME/bootwork

          $HOME/magisk/magiskboot unpack boot.img

          cp $HOME/kernel-peridot/out/arch/arm64/boot/Image.gz kernel

          $HOME/magisk/magiskboot repack boot.img boot_tepuy.img

          cp boot_tepuy.img $HOME/boot_tepuy.img
          ls -lh $HOME/boot_tepuy.img

      - name: Build COMPAT ZIP
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          cd $HOME
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cp kernel-peridot/out/arch/arm64/boot/Image.gz AK3/Image.gz
          cp ${{ github.workspace }}/anykernel-compat.sh AK3/anykernel.sh
          cd AK3
          zip -r9 $HOME/Tepuy-Kernel-Compat-peridot.zip * -x "*.git*" "README*"

      - name: Build FULL ZIP
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        run: |
          cd $HOME
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3FULL
          cp kernel-peridot/out/arch/arm64/boot/Image.gz AK3FULL/Image.gz
          cp ${{ github.workspace }}/anykernel-full.sh AK3FULL/anykernel.sh
          cd AK3FULL
          zip -r9 $HOME/Tepuy-Kernel-Full-peridot.zip * -x "*.git*" "README*"

      - name: Build GameMode module
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          mkdir -p $HOME/gamemode
          cd $HOME/gamemode
          cat > module.prop <<EOF
          id=tepuy-gamemode-auto
          name=Tepuy GameMode AutoActivator
          version=3.1
          versionCode=31
          author=CodigoCodm
          EOF
          cat > service.sh <<EOF
          #!/system/bin/sh
          until [ -f /sys/kernel/tepuy_boost/game_mode ]; do sleep 1; done
          echo 1 > /sys/kernel/tepuy_boost/game_mode
          EOF
          chmod +x service.sh
          zip -r9 $HOME/Tepuy-GameMode-AutoActivator.zip *

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: boot_tepuy
          path: ~/boot_tepuy.img

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            ~/kernel-peridot/out/arch/arm64/boot/Image
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ~/kernel-peridot/out/build.log
            ~/kernel-peridot/out/.config
          if-no-files-found: ignore

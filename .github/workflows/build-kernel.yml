name: Build Tepuy Kernel for Poco F6 (peridot) with Full Modules

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to use (default: gki_defconfig)'
        required: true
        default: 'gki_defconfig'
        type: string

env:
  ARCH: arm64
  SUBARCH: arm64
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_NOHASHDIR: 'true'
  CCACHE_MAXSIZE: '2G'
  CCACHE_HARDLINK: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            git bc bison flex libssl-dev make \
            gcc-aarch64-linux-gnu clang llvm lld \
            device-tree-compiler python3 zip unzip \
            wget ccache libelf-dev libncurses-dev \
            libxml2-utils gcc-arm-linux-gnueabi \
            dwarves jq autoconf automake libtool pkg-config \
            cmake ninja-build

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-peridot
          max-size: 2G

      - name: Clone LineageOS kernel for peridot
        run: |
          git clone --depth=1 -b lineage-23.2 \
            https://github.com/LineageOS/android_kernel_xiaomi_sm8635 \
            $HOME/kernel-peridot

      - name: Apply Tepuy GameMode patches
        run: |
          cd $HOME/kernel-peridot
          python3 ${{ github.workspace }}/tepuy-patcher.py $HOME/kernel-peridot
          echo ""
          echo "=== Verifying modifications ==="
          grep -n "tepuy_game_mode" drivers/cpufreq/qcom-cpufreq-hw.c | head -5
          grep -n "tepuy_game_mode" drivers/gpu/drm/msm/adreno/adreno_gpu.c | head -3
          grep -n "tepuy_game_mode" drivers/gpu/drm/msm/adreno/a6xx_gmu.c | head -3

      - name: Build kernel and modules
        run: |
          cd $HOME/kernel-peridot
          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          export LLVM=1
          export LLVM_IAS=1
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          # Build defconfig
          make O=out ${{ github.event.inputs.defconfig }} 2>&1 | tee -a out/build.log

          # Build kernel
          make O=out -j$(nproc --all) 2>&1 | tee -a out/build.log

          # Build modules
          make O=out -j$(nproc --all) modules 2>&1 | tee -a out/build.log

          # Install modules to staging
          make O=out INSTALL_MOD_PATH=$HOME/modules_staging INSTALL_MOD_STRIP=1 modules_install 2>&1 | tee -a out/build.log

          echo ""
          echo "=== Build output files ==="
          find out -name "Image*" -type f 2>/dev/null | while read f; do
            echo "Found: $f ($(stat -c%s "$f" 2>/dev/null || echo 'unknown') bytes)"
          done

          echo ""
          echo "=== Modules installed ==="
          find $HOME/modules_staging -name "*.ko" | wc -l
          find $HOME/modules_staging -name "*.ko" | head -30

      - name: Prepare kernel image
        run: |
          cd $HOME/kernel-peridot
          KERNEL_IMAGE=""
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image.gz-dtb"
            echo "Found Image.gz-dtb"
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image.gz"
            echo "Found Image.gz"
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image"
            echo "Found Image"
          fi

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "ERROR: No kernel image found!"
            ls -la out/arch/arm64/boot/ 2>/dev/null || echo "Directory not found"
            exit 1
          fi

          if [ "$KERNEL_IMAGE" != "out/arch/arm64/boot/Image.gz" ]; then
            cp "$KERNEL_IMAGE" out/arch/arm64/boot/Image.gz
            echo "Copied kernel image to Image.gz"
          fi

      - name: Build tools for recovery (aarch64 static)
        run: |
          mkdir -p $HOME/tools

          # --- 1. erofs-utils (mkfs.erofs, extract.erofs) ---
          echo "=== Building erofs-utils ==="
          git clone --depth=1 https://github.com/erofs/erofs-utils $HOME/erofs-utils
          cd $HOME/erofs-utils
          ./autogen.sh
          ./configure --host=aarch64-linux-gnu --prefix=$HOME/tools \
              CC=aarch64-linux-gnu-gcc \
              CFLAGS="-static -O2" LDFLAGS="-static"
          make -j$(nproc)
          make install
          ls -la $HOME/tools/bin/

          # --- 2. e2fsprogs (resize2fs, e2fsck) ---
          echo "=== Building e2fsprogs ==="
          wget -q https://downloads.sourceforge.net/project/e2fsprogs/e2fsprogs/v1.47.0/e2fsprogs-1.47.0.tar.gz -O /tmp/e2fsprogs.tar.gz
          tar xzf /tmp/e2fsprogs.tar.gz -C $HOME
          cd $HOME/e2fsprogs-1.47.0
          ./configure --host=aarch64-linux-gnu --prefix=$HOME/tools \
              CFLAGS="-static -O2" LDFLAGS="-static" \
              --disable-defrag --disable-debugfs --disable-imager \
              --disable-resizer --disable-tune2fs --disable-e2initrd \
              --disable-uuidd --disable-nls --disable-elf-shlibs \
              --disable-profile --disable-jbd-debug --disable-blkid-debug
          make -j$(nproc)
          make install
          ls -la $HOME/tools/sbin/

          # --- 3. p7zip (7za) ---
          echo "=== Building p7zip ==="
          git clone --depth=1 https://github.com/p7zip-project/p7zip $HOME/p7zip
          cd $HOME/p7zip
          make -j$(nproc) CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ \
              LDFLAGS="-static" 7za
          cp bin/7za $HOME/tools/bin/7za
          chmod 755 $HOME/tools/bin/7za
          file $HOME/tools/bin/7za

          # --- 4. Verify all tools are aarch64 static ---
          echo "=== Verifying tools ==="
          for f in $HOME/tools/bin/* $HOME/tools/sbin/*; do
            if [ -f "$f" ] && [ -x "$f" ]; then
              echo -n "$f: "
              file "$f"
            fi
          done

      - name: Download Magisk tools (busybox, magiskboot, magiskpolicy)
        run: |
          mkdir -p $HOME/tools/bin
          echo "=== Downloading Magisk APK ==="
          APK_URL=$(curl -sf https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | jq -r '.assets[] | select(.name | test("^Magisk-v.*\\.apk$")) | .browser_download_url' \
            | head -n1)

          if [ -z "$APK_URL" ] || [ "$APK_URL" == "null" ]; then
            echo "ERROR: Could not resolve Magisk APK URL"
            exit 1
          fi

          echo "APK: $APK_URL"
          curl -Lfo /tmp/magisk.apk "$APK_URL"
          unzip -o /tmp/magisk.apk -d /tmp/magisk_extract > /dev/null

          echo "=== Extracting arm64 tools ==="
          cp /tmp/magisk_extract/lib/arm64-v8a/libbusybox.so $HOME/tools/bin/busybox
          cp /tmp/magisk_extract/lib/arm64-v8a/libmagiskboot.so $HOME/tools/bin/magiskboot
          cp /tmp/magisk_extract/lib/arm64-v8a/libmagiskpolicy.so $HOME/tools/bin/magiskpolicy
          chmod 755 $HOME/tools/bin/busybox $HOME/tools/bin/magiskboot $HOME/tools/bin/magiskpolicy

          file $HOME/tools/bin/busybox
          file $HOME/tools/bin/magiskboot
          file $HOME/tools/bin/magiskpolicy

      - name: Prepare AnyKernel3 with modules
        run: |
          cd $HOME
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3

          # Copy our anykernel.sh
          cp ${{ github.workspace }}/anykernel.sh ./anykernel.sh

          # Copy kernel image
          cp $HOME/kernel-peridot/out/arch/arm64/boot/Image.gz ./Image.gz

          # Copy DTB if exists
          if [ -f "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb" ]; then
            cp $HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb ./dtb
          elif [ -d "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom" ]; then
            DTB=$(find $HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom -name "*.dtb" | head -1)
            if [ -n "$DTB" ]; then
              cp "$DTB" ./dtb
            fi
          fi

          # Prepare modules directories
          mkdir -p _modules
          mkdir -p _system_dlkm

          # Organize modules using our Python script
          python3 ${{ github.workspace }}/prepare-modules.py \
            --input "$HOME/modules_staging" \
            --vendor-out "_modules" \
            --system-out "_system_dlkm"

          echo ""
          echo "=== Vendor modules ($(ls _modules/ 2>/dev/null | wc -l)) ==="
          ls -la _modules/ 2>/dev/null | head -25

          echo ""
          echo "=== System modules ($(ls _system_dlkm/ 2>/dev/null | wc -l)) ==="
          ls -la _system_dlkm/ 2>/dev/null | head -15

          # Copy tools
          mkdir -p tools
          cp -r $HOME/tools/bin/* tools/ 2>/dev/null || true
          cp -r $HOME/tools/sbin/* tools/ 2>/dev/null || true

          # Make all tools executable
          chmod -R 755 tools/

          echo ""
          echo "=== Tools included ==="
          ls -la tools/ | head -30

          # Create zip
          zip -r9 $HOME/Tepuy-GameMode-peridot.zip * -x "*.zip" "*.git*" "README*"
          echo "AnyKernel3 zip created"
          ls -lh $HOME/Tepuy-GameMode-peridot.zip

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz-dtb
            ~/kernel-peridot/out/arch/arm64/boot/Image
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-GameMode-peridot
          path: ~/Tepuy-GameMode-peridot.zip
          retention-days: 30

      - name: Upload build log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/kernel-peridot/out/build.log
          retention-days: 7

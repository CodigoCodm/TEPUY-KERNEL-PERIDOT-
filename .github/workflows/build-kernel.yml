name: TEPUY Peridot - Xiaomi Official Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Xiaomi Peridot Official Build
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Codigocodm
      KBUILD_BUILD_HOST: TEPUY

    steps:

      # ============================================================
      # 1. CHECKOUT TEPUY
      # ============================================================

      - name: Checkout TEPUY repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # 2. DEPENDENCIAS
      # ============================================================

      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            pahole \
            python3 \
            python3-pip \
            rsync \
            unzip \
            wget \
            zip

      # ============================================================
      # 3. CACHE
      # ============================================================

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: peridot-xiaomi-official
          max-size: 5G

      # ============================================================
      # 4. XIAOMI KERNEL SOURCE
      # ============================================================

      - name: Clone Xiaomi peridot-u-oss
        run: |
          set -eux

          git clone \
            --depth=1 \
            --branch peridot-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            kernel

          cd kernel

          echo "=========================================="
          echo "XIAOMI PERIDOT SOURCE"
          echo "=========================================="

          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git rev-parse HEAD

          echo "Top-level:"
          find . -maxdepth 1 -type f -printf '%f\n' | sort

      # ============================================================
      # 5. XIAOMI KERNEL BUILD REPOSITORY
      # ============================================================

      - name: Clone Xiaomi kernel_build
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/MiCode/kernel_build.git \
            kernel_build

          echo "=========================================="
          echo "XIAOMI KERNEL BUILD"
          echo "=========================================="

          find kernel_build -maxdepth 3 -type f | sort | head -300

      # ============================================================
      # 6. BUSCAR CONFIGURACION PERIDOT
      # ============================================================

      - name: Locate Peridot build configuration
        run: |
          set -eux

          echo "=========================================="
          echo "SEARCHING PERIDOT BUILD CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "Files containing peridot:"
          grep -Ril \
            "peridot-u-oss\|peridot" \
            kernel_build \
            --include='*.sh' \
            --include='*.config' \
            --include='*.mk' \
            --include='*.json' \
            --include='*.yaml' \
            --include='*.yml' \
            --include='README*' \
            2>/dev/null \
            | sort \
            | head -100 || true

          echo ""
          echo "Build scripts:"
          find kernel_build \
            -type f \
            \( -name 'build.sh' \
            -o -name '*.sh' \
            -o -name 'build.config*' \) \
            | sort \
            | head -200

      # ============================================================
      # 7. INSPECCIONAR BUILD DEL ARBOL KERNEL
      # ============================================================

      - name: Inspect kernel build files
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "KERNEL BUILD FILES"
          echo "=========================================="

          echo ""
          echo "BUILD files:"
          find . \
            -maxdepth 4 \
            -type f \
            \( -name 'BUILD.bazel' \
            -o -name 'build.config*' \
            -o -name 'build.sh' \
            -o -name 'BUILD' \) \
            | sort \
            | head -300

          echo ""
          echo "Defconfigs containing peridot:"
          find arch -type f \
            \( -name '*defconfig*' -o -name '*.config' \) \
            2>/dev/null \
            | grep -i peridot \
            | sort \
            | head -100 || true

      # ============================================================
      # 8. PREPARAR OUT
      # ============================================================

      - name: Prepare output
        run: |
          set -eux

          cd kernel

          rm -rf out
          mkdir -p out

      # ============================================================
      # 9. DETERMINAR BUILD SYSTEM
      # ============================================================

      - name: Detect Xiaomi build system
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "BUILD SYSTEM DETECTION"
          echo "=========================================="

          if [ -f build/build.sh ]; then
            echo "BUILD_SYSTEM=KERNEL_BUILD_SH" >> "$GITHUB_ENV"
            echo "Detected: build/build.sh"

          elif [ -f build.sh ]; then
            echo "BUILD_SYSTEM=ROOT_BUILD_SH" >> "$GITHUB_ENV"
            echo "Detected: build.sh"

          elif find . -maxdepth 3 -name 'build.config*' -type f | grep -q .; then
            echo "BUILD_SYSTEM=BUILD_CONFIG" >> "$GITHUB_ENV"
            echo "Detected: build.config"

          elif [ -f BUILD.bazel ]; then
            echo "BUILD_SYSTEM=BAZEL" >> "$GITHUB_ENV"
            echo "Detected: Bazel"

          else
            echo "BUILD_SYSTEM=UNKNOWN" >> "$GITHUB_ENV"
            echo "No recognized build system found."
          fi

      # ============================================================
      # 10. MOSTRAR BUILD SYSTEM
      # ============================================================

      - name: Show detected build system
        run: |
          set -eux

          echo "BUILD_SYSTEM=$BUILD_SYSTEM"

            # ============================================================
      # 11. BUILD XIAOMI - build.config.msm.peridot
      # ============================================================

      - name: Run Xiaomi Peridot build
        run: |
          set -eo pipefail

          cd kernel

          echo "=========================================="
          echo "XIAOMI PERIDOT BUILD"
          echo "=========================================="

          CONFIG="$PWD/build.config.msm.peridot"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::build.config.msm.peridot not found"
            exit 1
          fi

          echo "Build config:"
          echo "$CONFIG"

          echo ""
          echo "=========================================="
          echo "CONFIG CONTENT"
          echo "=========================================="

          sed -n '1,240p' "$CONFIG"

          echo ""
          echo "=========================================="
          echo "BUILD CONFIG VARIABLES"
          echo "=========================================="

          grep -E \
            '^(BRANCH|DEFCONFIG|BUILD_CONFIG|FILES|MAKE_GOALS|OUT_DIR|BUILD_CONFIG_FRAGMENTS|KERNEL_DIR|CLANG|LLVM)' \
            "$CONFIG" \
            || true

          echo ""
          echo "=========================================="
          echo "AVAILABLE BUILD TOOLS"
          echo "=========================================="

          command -v bash || true
          command -v make || true
          command -v python3 || true
          command -v clang || true
          command -v bazel || true
          command -v bazelisk || true

          echo ""
          echo "=========================================="
          echo "BUILD FILES"
          echo "=========================================="

          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -name 'build.sh' \
              -o -name 'build.config*' \
              -o -name 'BUILD.bazel' \
              -o -name '.bazelrc*' \
              -o -name 'kleaf' \
            \) \
            | sort

          echo ""
          echo "=========================================="
          echo "SEARCHING BUILD.SH"
          echo "=========================================="

          BUILD_SH="$(find .. \
            -type f \
            -name 'build.sh' \
            -print \
            | head -1 || true)"

          if [ -n "$BUILD_SH" ]; then
            echo "Found build.sh:"
            echo "$BUILD_SH"

            chmod +x "$BUILD_SH"

            "$BUILD_SH" "$CONFIG" \
              2>&1 | tee out/xiaomi-build.log

          else
            echo "No build.sh found."

            echo ""
            echo "Searching for build config consumers..."

            grep -Ril \
              "build.config.msm.peridot" \
              .. \
              --include='*.sh' \
              --include='*.py' \
              --include='*.mk' \
              --include='BUILD*' \
              2>/dev/null \
              | sort \
              | head -100 \
              || true

            echo ""
            echo "Searching for build.sh references..."

            grep -Ril \
              "build.sh" \
              .. \
              --include='*.sh' \
              --include='*.py' \
              --include='README*' \
              2>/dev/null \
              | sort \
              | head -100 \
              || true

            echo ""
            echo "::error::Xiaomi build config found but its build entry point was not found."
            exit 1
          fi

      # ============================================================
      # 12. FALLBACK: NO BUILD SYSTEM
      # ============================================================

      - name: Stop if Xiaomi build system was not detected
        if: env.BUILD_SYSTEM == 'UNKNOWN'
        run: |
          echo "::error::No Xiaomi build system detected."
          echo ""
          echo "This is intentional."
          echo "We will NOT guess gki_defconfig."
          echo "We will NOT create HWID stubs."
          echo "We will NOT modify Kconfig."
          echo ""
          echo "Build files found:"
          find kernel \
            -maxdepth 4 \
            -type f \
            \( -name 'build.config*' \
            -o -name 'build.sh' \
            -o -name 'BUILD.bazel' \
            \) \
            | sort \
            | head -300

          exit 1

      # ============================================================
      # 13. BUSCAR IMAGE
      # ============================================================

      - name: Locate generated Image
        run: |
          set -eux

          echo "=========================================="
          echo "SEARCHING GENERATED KERNEL"
          echo "=========================================="

          find kernel \
            -type f \
            \( -name 'Image' \
            -o -name 'Image.gz' \
            -o -name 'Image.lz4' \
            -o -name 'Image.lz4-dtb' \
            \) \
            -size +2M \
            -print \
            | sort

      # ============================================================
      # 14. SELECCIONAR IMAGE
      # ============================================================

      - name: Select kernel Image
        run: |
          set -eux

          IMAGE="$(find kernel \
            -type f \
            -name 'Image' \
            -size +2M \
            | head -1)"

          if [ -z "$IMAGE" ]; then
            echo "::error::No valid Image was generated."
            exit 1
          fi

          echo "IMAGE_PATH=$IMAGE" >> "$GITHUB_ENV"

          echo "Selected:"
          echo "$IMAGE"

          ls -lh "$IMAGE"
          file "$IMAGE"

      # ============================================================
      # 15. PREPARAR ANYKERNEL3
      # ============================================================

      - name: Clone AnyKernel3
        run: |
          set -eux

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          rm -rf AnyKernel3/.git

      # ============================================================
      # 16. COPIAR IMAGE
      # ============================================================

      - name: Copy Xiaomi Image
        run: |
          set -eux

          cp \
            "$IMAGE_PATH" \
            AnyKernel3/Image

          ls -lh AnyKernel3/Image

      # ============================================================
      # 17. ANYKERNEL BASE
      # ============================================================

      - name: Configure AnyKernel
        run: |
          set -eux

          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() {
          kernel.string=TEPUY Peridot - Xiaomi Base
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=peridot
          device.name2=
          supported.versions=
          supported.patchlevels=
          }

          . tools/ak3-core.sh;

          dump_boot;

          write_boot;
          EOF

          chmod 755 AnyKernel3/anykernel.sh

      # ============================================================
      # 18. CREAR ZIP
      # ============================================================

      - name: Create Xiaomi Base ZIP
        run: |
          set -eux

          cd AnyKernel3

          rm -f \
            Image.gz \
            Image.lz4 \
            Image.lz4-dtb \
            zImage \
            zImage-dtb

          zip \
            -r9 \
            ../Tepuy-Peridot-Xiaomi-BASE.zip \
            . \
            -x "*.git*" \
            -x "*.zip"

          cd ..

          ls -lh Tepuy-Peridot-Xiaomi-BASE.zip

      # ============================================================
      # 19. BUILD INFORMATION
      # ============================================================

      - name: Generate build information
        run: |
          set -eux

          mkdir -p build-info

          {
            echo "TEPUY PERIDOT - XIAOMI BASE"
            echo "================================"
            echo ""
            echo "Kernel source:"
            cd kernel
            git remote -v
            echo ""
            echo "Commit:"
            git rev-parse HEAD
            echo ""
            echo "Branch:"
            git branch --show-current
            echo ""
            echo "Build system:"
            echo "$BUILD_SYSTEM"
            echo ""
            echo "Image:"
            echo "$IMAGE_PATH"
          } > build-info/build.txt

      # ============================================================
      # 20. UPLOAD ARTIFACTS
      # ============================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: Tepuy-Peridot-Xiaomi-BASE
          if-no-files-found: error
          path: |
            Tepuy-Peridot-Xiaomi-BASE.zip
            kernel/**/Image
            kernel/**/Image.gz
            kernel/**/Image.lz4
            kernel/**/xiaomi-build.log
            kernel/out/**
            build-info/build.txt

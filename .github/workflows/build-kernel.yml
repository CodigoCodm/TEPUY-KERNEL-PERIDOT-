name: TEPUY Peridot - Xiaomi Kleaf Base

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Xiaomi Peridot Kleaf Base
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Codigocodm
      KBUILD_BUILD_HOST: TEPUY

    steps:

      # ============================================================
      # 1. CHECKOUT TEPUY
      # ============================================================

      - name: Checkout TEPUY
        uses: actions/checkout@v4

      # ============================================================
      # 2. DESCARGAR KERNEL XIAOMI
      # ============================================================

      - name: Clone Xiaomi Peridot kernel
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "CLONING XIAOMI PERIDOT"
          echo "=========================================="

          git clone \
            --depth=1 \
            --branch peridot-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            kernel

          echo ""
          echo "Kernel successfully cloned."

          cd kernel

          echo ""
          echo "Branch:"
          git branch --show-current

          echo ""
          echo "Commit:"
          git rev-parse HEAD

      # ============================================================
      # 3. VERIFICAR ESTRUCTURA
      # ============================================================

      - name: Verify Xiaomi kernel tree
        shell: bash
        run: |
          set -eux

          test -d kernel
          test -f kernel/BUILD.bazel

          echo "=========================================="
          echo "KERNEL TREE"
          echo "=========================================="

          cd kernel

          echo ""
          echo "Top-level:"
          find . -maxdepth 2 -type d \
            | sort \
            | head -250

          echo ""
          echo "BUILD.bazel:"
          test -f BUILD.bazel

          echo "[OK] BUILD.bazel"

      # ============================================================
      # 4. BUSCAR KLEAF
      # ============================================================

      - name: Verify Kleaf
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "KLEAF"
          echo "=========================================="

          if [ ! -d build/kernel/kleaf ]; then
            echo "::error::Kleaf directory not found"
            exit 1
          fi

          echo "[OK] build/kernel/kleaf"

          find build/kernel/kleaf \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200

      # ============================================================
      # 5. DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      # ============================================================
      # 6. COMPROBAR BAZEL
      # ============================================================

      - name: Check Bazel
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "BAZEL"
          echo "=========================================="

          command -v bazel || true
          command -v bazelisk || true

          bazel --version || true
          bazelisk --version || true

      # ============================================================
      # 7. CCACHE
      # ============================================================

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tepuy-peridot-kleaf
          max-size: 5G

      # ============================================================
      # 8. BUSCAR PERIDOT
      # ============================================================

      - name: Analyze Peridot tree
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "PERIDOT FILES"
          echo "=========================================="

          find . \
            -type f \
            \( \
              -iname '*peridot*' \
              -o -iname '*pineapple*' \
            \) \
            | sort \
            | head -500

          echo ""
          echo "=========================================="
          echo "PERIDOT REFERENCES"
          echo "=========================================="

          grep -RIn \
            "peridot" \
            . \
            --include='BUILD' \
            --include='BUILD.bazel' \
            --include='*.bzl' \
            2>/dev/null \
            | head -300 \
            || true

      # ============================================================
      # 9. BAZEL QUERY
      # ============================================================

      - name: Query kernel targets
        shell: bash
        run: |
          set -eo pipefail

          cd kernel

          echo "=========================================="
          echo "KERNEL TARGETS"
          echo "=========================================="

          bazel query \
            'kind("kernel_.*", //...)' \
            2>&1 \
            | tee ../kernel-targets.log \
            || true

          echo ""
          echo "=========================================="
          echo "PERIDOT TARGETS"
          echo "=========================================="

          bazel query \
            'attr("name", ".*peridot.*", //...)' \
            2>&1 \
            | tee ../peridot-targets.log \
            || true

      # ============================================================
      # 10. MOSTRAR CONFIGURACIONES
      # ============================================================

      - name: Inspect Peridot build configs
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "PERIDOT BUILD CONFIG"
          echo "=========================================="

          if [ -f build.config.msm.peridot ]; then
            cat build.config.msm.peridot
          fi

          echo ""
          echo "=========================================="
          echo "PINEAPPLE BUILD CONFIG"
          echo "=========================================="

          if [ -f build.config.msm.pineapple ]; then
            cat build.config.msm.pineapple
          fi

          echo ""
          echo "=========================================="
          echo "PERIDOT DEFCONFIGS"
          echo "=========================================="

          find arch/arm64/configs \
            -type f \
            \( \
              -iname '*peridot*' \
              -o -iname '*gki*' \
            \) \
            | sort

      # ============================================================
      # 11. DETERMINAR TARGET
      # ============================================================

      - name: Determine Peridot target
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "TARGET DETECTION"
          echo "=========================================="

          if [ -s peridot-targets.log ]; then
            grep -E \
              'peridot|kernel' \
              peridot-targets.log \
              | head -50 \
              > detected-target.txt \
              || true
          fi

          echo ""
          echo "Detected:"
          cat detected-target.txt 2>/dev/null || true

      # ============================================================
      # 12. BUILD
      # ============================================================

      - name: Build Peridot
        shell: bash
        run: |
          set -eo pipefail

          cd kernel

          echo "=========================================="
          echo "KLEAF BUILD"
          echo "=========================================="

          TARGETS="$(cat ../detected-target.txt 2>/dev/null || true)"

          if [ -z "$TARGETS" ]; then
            echo "::error::No Peridot Kleaf target detected."
            echo ""
            echo "Available kernel targets:"
            cat ../kernel-targets.log || true
            exit 1
          fi

          TARGET="$(echo "$TARGETS" | head -1)"

          echo "Selected target:"
          echo "$TARGET"

          bazel build \
            --config=fast \
            "$TARGET" \
            2>&1 \
            | tee ../kleaf-build.log

      # ============================================================
      # 13. BUSCAR IMAGE
      # ============================================================

      - name: Find generated Image
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "GENERATED IMAGES"
          echo "=========================================="

          find bazel-bin \
            -type f \
            \( \
              -name Image \
              -o -name Image.lz4 \
              -o -name Image.gz \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | tee ../images.txt

          if ! grep -q . ../images.txt; then
            echo "::error::No Image generated"
            exit 1
          fi

      # ============================================================
      # 14. VALIDAR IMAGE
      # ============================================================

      - name: Validate Image
        shell: bash
        run: |
          set -eux

          IMAGE="$(grep '/Image$' images.txt | head -1)"

          if [ -z "$IMAGE" ]; then
            IMAGE="$(grep -E '/Image\.(lz4|gz)$' images.txt | head -1)"
          fi

          test -n "$IMAGE"

          echo "Image:"
          echo "$IMAGE"

          ls -lh "kernel/$IMAGE"

          SIZE="$(stat -c%s "kernel/$IMAGE")"

          echo ""
          echo "Size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 2000000 ]; then
            echo "::error::Image suspiciously small"
            exit 1
          fi

      # ============================================================
      # 15. ARTIFACTS
      # ============================================================

      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p artifacts

          cp kernel-targets.log artifacts/ 2>/dev/null
          cp peridot-targets.log artifacts/ 2>/dev/null
          cp detected-target.txt artifacts/ 2>/dev/null
          cp images.txt artifacts/ 2>/dev/null
          cp kleaf-build.log artifacts/ 2>/dev/null

          find kernel/bazel-bin \
            -type f \
            \( \
              -name Image \
              -o -name Image.lz4 \
              -o -name Image.gz \
            \) \
            -exec cp --parents {} artifacts/ \; \
            2>/dev/null

          echo "=========================================="
          echo "ARTIFACTS"
          echo "=========================================="

          find artifacts \
            -type f \
            -ls

      # ============================================================
      # 16. UPLOAD
      # ============================================================

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Peridot-Kleaf
          if-no-files-found: warn
          path: artifacts/

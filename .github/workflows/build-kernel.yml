name: Tepuy Exclusive 4.1 (Peridot HyperOS)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "compat | full | both"
        required: true
        default: compat
        type: choice
        options: [compat, full, both]

env:
  ARCH: arm64
  SUBARCH: arm64
  LLVM: "1"
  LLVM_IAS: "1"
  BOOT_URL: "https://github.com/CodigoCodm/TEPUY-KERNEL-PERIDOT-/releases/download/%23Kernel/boot.img"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             git bc bison flex make clang llvm lld jq curl zip unzip gzip             gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi             libssl-dev libelf-dev device-tree-compiler ccache file rsync

      - name: Clone Xiaomi kernel source
        run: |
          git clone --depth=1 -b peridot-u-oss             https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git             $HOME/kernel-peridot

      - name: Apply Tepuy patches
        run: |
          cd $HOME/kernel-peridot
          if [ "${{ github.event.inputs.build_mode }}" != "full" ]; then
            python3 "${{ github.workspace }}/tepuy-patcher-compat.py" .
          fi
          if [ "${{ github.event.inputs.build_mode }}" != "compat" ]; then
            python3 "${{ github.workspace }}/tepuy-patcher.py" .
          fi

      - name: Configure Mixed GKI
        run: |
          set -e
          cd $HOME/kernel-peridot

          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out mrproper
          make O=out gki_defconfig

          ./scripts/kconfig/merge_config.sh             -m             -O out             out/.config             arch/arm64/configs/vendor/peridot_GKI.config

          make O=out olddefconfig

      - name: Build kernel + dtbs
        run: |
          set -eo pipefail
          cd $HOME/kernel-peridot

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out -j$(nproc) Image dtbs

      - name: Prepare Image.gz
        run: |
          cd $HOME/kernel-peridot

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image.gz
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz exists."
          else
            gzip -n -9 -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.gz
          fi

          ls -lh out/arch/arm64/boot/Image*

      - name: Verify kernel size
        run: |
          FILE="$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz"
          SIZE=$(stat -c%s "$FILE")
          SIZE_MB=$((SIZE/1024/1024))
          echo "Kernel size: ${SIZE_MB} MB"
          if [ "$SIZE_MB" -lt 12 ]; then
            echo "::error::Kernel image too small."
            exit 1
          fi

      - name: Build modules if enabled
        run: |
          cd $HOME/kernel-peridot
          mkdir -p $HOME/modules_staging

          if grep -q '^CONFIG_MODULES=y' out/.config; then
            make O=out -j$(nproc) modules
            make O=out INSTALL_MOD_PATH=$HOME/modules_staging INSTALL_MOD_STRIP=1 modules_install
          else
            echo "CONFIG_MODULES disabled (expected on many GKI builds)."
          fi

      - name: Download MagiskBoot
        run: |
          mkdir -p $HOME/magisk
          cd $HOME/magisk

          APK=$(curl -sf https://api.github.com/repos/topjohnwu/Magisk/releases/latest             | jq -r '.assets[] | select(.name|test("^Magisk-v.*\\.apk$")) | .browser_download_url'             | head -n1)

          curl -Lfo magisk.apk "$APK"

          unzip -j magisk.apk "lib/x86_64/libmagiskboot.so" -d . 2>/dev/null || true
          unzip -j magisk.apk "lib/arm64-v8a/libmagiskboot.so" -d . 2>/dev/null || true

          mv libmagiskboot.so magiskboot
          chmod +x magiskboot

      - name: Download stock boot
        run: |
          mkdir -p $HOME/bootwork
          curl -L -o $HOME/bootwork/boot.img "$BOOT_URL"
          ls -lh $HOME/bootwork/boot.img

      - name: Build boot_tepuy.img
        run: |
          set -e
          cd $HOME/bootwork

          $HOME/magisk/magiskboot unpack boot.img

          cp $HOME/kernel-peridot/out/arch/arm64/boot/Image.gz kernel

          $HOME/magisk/magiskboot repack boot.img boot_tepuy.img

          cp boot_tepuy.img $HOME/boot_tepuy.img

          ls -lh $HOME/boot_tepuy.img

      - name: Tepuy build report
        if: always()
        run: |
          cd $HOME/kernel-peridot

          echo "===== OUTPUT ====="
          find out/arch/arm64/boot -maxdepth 2 -type f -exec ls -lh {} \;

          echo "===== CONFIG_MODULES ====="
          grep CONFIG_MODULES out/.config || true

          echo "===== WILDBOOST CHECK ====="
          grep -R "3014400" drivers kernel arch || true
          grep -R "1114000000" drivers kernel arch || true
          grep -R "500000000" drivers kernel arch || true

      - name: Upload boot
        uses: actions/upload-artifact@v4
        with:
          name: boot_tepuy
          path: ~/boot_tepuy.img

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            ~/kernel-peridot/out/arch/arm64/boot/Image
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: ignore

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ~/kernel-peridot/out/.config
            ~/kernel-peridot/out/build.log
          if-no-files-found: ignore

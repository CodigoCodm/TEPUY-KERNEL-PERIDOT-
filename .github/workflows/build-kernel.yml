name: TEPUY - Peridot Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Codigocodm
      KBUILD_BUILD_HOST: TEPUY

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Detect kernel directory
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "DETECTING KERNEL TREE"
          echo "=========================================="

          if [ -d kernel ] && [ -f kernel/Makefile ]; then
            echo "kernel" > .kernel_dir
          elif [ -d xiaomi ] && [ -f xiaomi/Makefile ]; then
            echo "xiaomi" > .kernel_dir
          elif [ -f Makefile ]; then
            echo "." > .kernel_dir
          else
            echo "::error::Kernel Makefile not found"
            exit 1
          fi

          KERNEL_DIR="$(cat .kernel_dir)"

          echo "KERNEL_DIR=$KERNEL_DIR"
          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libssl-dev \
            libelf-dev \
            pahole \
            cpio \
            rsync \
            python3 \
            perl \
            curl \
            wget \
            unzip \
            zip \
            p7zip-full \
            tar \
            xz-utils \
            zstd

      - name: Prepare RealKing Clang
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "REALKING CLANG"
          echo "=========================================="

          MAIN="$GITHUB_WORKSPACE"

          if [ -d "$MAIN/clang/bin" ]; then
            echo "Existing clang directory found."
          else
            echo "Downloading ZyC Stable Clang..."

            CLANG_URL="$(curl -fsSL \
              https://raw.githubusercontent.com/v3kt0r-87/Clang-Stable/main/clang-zyc.txt)"

            test -n "$CLANG_URL"

            echo "Clang URL:"
            echo "$CLANG_URL"

            wget \
              --fail \
              --show-progress \
              "$CLANG_URL" \
              -O "$MAIN/zyc-clang.tar.gz"

            mkdir -p "$MAIN/clang"

            tar \
              -xvf "$MAIN/zyc-clang.tar.gz" \
              -C "$MAIN/clang"

            rm -f "$MAIN/zyc-clang.tar.gz"
          fi

          test -x "$MAIN/clang/bin/clang"

          echo ""
          echo "Clang:"
          "$MAIN/clang/bin/clang" --version

          echo ""
          echo "LLD:"
          "$MAIN/clang/bin/ld.lld" --version

          echo ""
          echo "LLVM NM:"
          "$MAIN/clang/bin/llvm-nm" --version | head -1

          echo ""
          echo "LLVM OBJDUMP:"
          "$MAIN/clang/bin/llvm-objdump" --version | head -1

          echo ""
          echo "LLVM STRIP:"
          "$MAIN/clang/bin/llvm-strip" --version | head -1

          echo ""
          echo "PATH:"
          echo "$MAIN/clang/bin" >> "$GITHUB_PATH"

          echo "CLANG_DIR=$MAIN/clang" >> "$GITHUB_ENV"

      - name: Verify Peridot source
        shell: bash
        run: |
          set -eux

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "PERIDOT SOURCE"
          echo "=========================================="

          pwd

          echo ""
          echo "Git:"
          git rev-parse --short HEAD || true
          git describe --tags --always || true

          echo ""
          echo "Checking Makefile..."
          test -f Makefile

          echo ""
          echo "Checking peridot_defconfig..."
          test -f arch/arm64/configs/peridot_defconfig

          echo ""
          echo "peridot_defconfig FOUND"

      - name: Verify compiler environment
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "COMPILER ENVIRONMENT"
          echo "=========================================="

          command -v clang
          command -v clang++
          command -v ld.lld
          command -v llvm-nm
          command -v llvm-objdump
          command -v llvm-strip
          command -v aarch64-linux-gnu-gcc

          echo ""
          clang --version
          echo ""
          aarch64-linux-gnu-gcc --version | head -1

      - name: Generate Peridot defconfig
        shell: bash
        run: |
          set -eux

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "PERIDOT DEFCONFIG"
          echo "=========================================="

          rm -rf out
          mkdir -p out

          make \
            peridot_defconfig \
            O=out \
            CC=clang

          test -f out/.config

          echo ""
          echo "Defconfig generated successfully."

      - name: Build Peridot kernel
        shell: bash
        run: |
          set -eux

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "BUILDING PERIDOT"
          echo "=========================================="

          echo "CPU threads:"
          nproc --all

          echo ""
          echo "Compiler:"
          clang --version

          echo ""
          echo "Starting build..."

          make \
            -j"$(nproc --all)" \
            O=out \
            CC=clang \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            NM=llvm-nm \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Verify Image.gz
        shell: bash
        run: |
          set -eux

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "VERIFYING KERNEL"
          echo "=========================================="

          ZIMAGE="out/arch/arm64/boot/Image.gz"

          if [ ! -f "$ZIMAGE" ]; then
            echo "::error::Image.gz was not generated"
            echo ""
            echo "Available boot outputs:"
            find out/arch/arm64/boot \
              -maxdepth 2 \
              -type f \
              2>/dev/null \
              | sort || true
            exit 1
          fi

          echo "Image.gz:"
          ls -lh "$ZIMAGE"

          echo ""
          echo "Image:"
          if [ -f out/arch/arm64/boot/Image ]; then
            ls -lh out/arch/arm64/boot/Image
          fi

      - name: Collect build information
        shell: bash
        run: |
          set -eux

          cd "$KERNEL_DIR"

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp \
            out/arch/arm64/boot/Image.gz \
            "$GITHUB_WORKSPACE/dist/Image.gz"

          if [ -f out/arch/arm64/boot/Image ]; then
            cp \
              out/arch/arm64/boot/Image \
              "$GITHUB_WORKSPACE/dist/Image"
          fi

          {
            echo "=========================================="
            echo "TEPUY PERIDOT BUILD"
            echo "=========================================="
            echo ""
            echo "Commit:"
            git rev-parse HEAD || true
            echo ""
            echo "Compiler:"
            clang --version
            echo ""
            echo "Defconfig:"
            echo "peridot_defconfig"
            echo ""
            echo "Build user:"
            echo "$KBUILD_BUILD_USER"
            echo ""
            echo "Build host:"
            echo "$KBUILD_BUILD_HOST"
          } > "$GITHUB_WORKSPACE/dist/build-info.txt"

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: tepuy-peridot-kernel
          path: dist/
          if-no-files-found: error

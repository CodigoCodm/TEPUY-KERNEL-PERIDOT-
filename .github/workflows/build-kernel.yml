name: TEPUY Peridot - Kleaf Base Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Xiaomi Peridot Base Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Codigocodm
      KBUILD_BUILD_HOST: TEPUY
      USE_BAZEL_VERSION: 6.5.0

    steps:

      # ============================================================
      # 1. CHECKOUT TEPUY
      # ============================================================

      - name: Checkout TEPUY
        uses: actions/checkout@v4

      # ============================================================
      # 2. INFORMACION DEL REPOSITORIO
      # ============================================================

      - name: Inspect repository
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "TEPUY REPOSITORY"
          echo "=========================================="

          pwd

          echo ""
          echo "Top level:"
          find . -maxdepth 2 -type f | sort | head -300

          echo ""
          echo "Kernel:"
          ls -lah kernel

          echo ""
          echo "Git:"
          cd kernel
          git branch --show-current || true
          git rev-parse HEAD || true

      # ============================================================
      # 3. VERIFICAR KLEAF
      # ============================================================

      - name: Verify Kleaf tree
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "KLEAF CHECK"
          echo "=========================================="

          test -f BUILD.bazel

          echo "[OK] BUILD.bazel"

          if [ -d build/kernel/kleaf ]; then
            echo "[OK] build/kernel/kleaf"
          else
            echo "[ERROR] build/kernel/kleaf not found"
            exit 1
          fi

          echo ""
          echo "Kleaf files:"
          find build/kernel/kleaf \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -200

      # ============================================================
      # 4. DEPENDENCIAS
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      # ============================================================
      # 5. BAZEL / BAZELISK
      # ============================================================

      - name: Check Bazel
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "BAZEL"
          echo "=========================================="

          command -v bazel || true
          command -v bazelisk || true

          bazel --version || true
          bazelisk --version || true

      # ============================================================
      # 6. CCACHE
      # ============================================================

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: peridot-kleaf
          max-size: 5G

      # ============================================================
      # 7. ANALIZAR TARGETS PERIDOT
      # ============================================================

      - name: Analyze Peridot targets
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "PERIDOT TARGET ANALYSIS"
          echo "=========================================="

          echo ""
          echo "Peridot files:"
          find . \
            -type f \
            \( \
              -iname '*peridot*' \
              -o -iname '*pineapple*' \
            \) \
            | sort \
            | head -500

          echo ""
          echo "Peridot references in BUILD files:"

          grep -RIn \
            "peridot" \
            . \
            --include='BUILD' \
            --include='BUILD.bazel' \
            --include='*.bzl' \
            2>/dev/null \
            | head -300 \
            || true

      # ============================================================
      # 8. BAZEL QUERY
      # ============================================================

      - name: Query Bazel targets
        shell: bash
        run: |
          set -eo pipefail

          cd kernel

          echo "=========================================="
          echo "BAZEL TARGETS"
          echo "=========================================="

          bazel query \
            'kind("kernel_.*", //...)' \
            2>&1 \
            | tee ../bazel-targets.log \
            || true

          echo ""
          echo "Searching peridot targets:"

          bazel query \
            'attr("name", ".*peridot.*", //...)' \
            2>&1 \
            | tee ../bazel-peridot-targets.log \
            || true

      # ============================================================
      # 9. IDENTIFICAR TARGET PERIDOT
      # ============================================================

      - name: Detect Peridot Bazel target
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "DETECTING PERIDOT TARGET"
          echo "=========================================="

          TARGETS="$(bazel query \
            'attr("name", ".*peridot.*", //...)' \
            2>/dev/null \
            | grep -E 'kernel|peridot' \
            | head -50 || true)"

          echo "$TARGETS"

          if [ -z "$TARGETS" ]; then
            echo ""
            echo "[INFO] No direct peridot Bazel target found."
            echo "[INFO] Searching device configuration files."

            grep -RIl \
              "peridot" \
              . \
              --include='BUILD' \
              --include='BUILD.bazel' \
              --include='*.bzl' \
              2>/dev/null \
              | sort \
              | head -100 \
              || true
          fi

          echo "$TARGETS" > ../detected-peridot-targets.txt

      # ============================================================
      # 10. MOSTRAR CONFIGURACION XIAOMI
      # ============================================================

      - name: Inspect Xiaomi configuration
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "XIAOMI CONFIGURATION"
          echo "=========================================="

          echo ""
          echo "build.config.msm.peridot:"
          cat build.config.msm.peridot

          echo ""
          echo "build.config.msm.pineapple:"
          cat build.config.msm.pineapple

          echo ""
          echo "Peridot defconfigs:"

          find arch/arm64/configs \
            -type f \
            \( \
              -iname '*peridot*' \
              -o -iname '*gki*' \
            \) \
            | sort \
            | head -200

      # ============================================================
      # 11. BUILD KLEAF
      # ============================================================

      - name: Build kernel with Kleaf
        shell: bash
        run: |
          set -eo pipefail

          cd kernel

          echo "=========================================="
          echo "RUNNING KLEAF"
          echo "=========================================="

          if [ -s ../detected-peridot-targets.txt ]; then

            TARGET="$(head -1 ../detected-peridot-targets.txt)"

            echo "Detected target:"
            echo "$TARGET"

            echo ""
            echo "Building:"
            echo "$TARGET"

            bazel build \
              --config=fast \
              "$TARGET" \
              2>&1 | tee ../kleaf-build.log

          else

            echo "[ERROR] No Peridot Bazel target detected."
            echo ""
            echo "Available kernel targets:"
            cat ../bazel-targets.log || true
            echo ""
            echo "Available Peridot targets:"
            cat ../bazel-peridot-targets.log || true

            exit 1

          fi

      # ============================================================
      # 12. BUSCAR IMAGE
      # ============================================================

      - name: Locate kernel Image
        shell: bash
        run: |
          set -eux

          cd kernel

          echo "=========================================="
          echo "SEARCHING KERNEL IMAGE"
          echo "=========================================="

          find bazel-bin \
            -type f \
            \( \
              -name 'Image' \
              -o -name 'Image.lz4' \
              -o -name 'Image.gz' \
            \) \
            -print \
            2>/dev/null \
            | sort \
            | tee ../kernel-images.txt

          if ! grep -q . ../kernel-images.txt; then
            echo "::error::No kernel Image generated"
            exit 1
          fi

      # ============================================================
      # 13. VALIDAR IMAGE
      # ============================================================

      - name: Validate kernel Image
        shell: bash
        run: |
          set -eux

          IMAGE="$(grep '/Image$' kernel-images.txt | head -1)"

          if [ -z "$IMAGE" ]; then
            IMAGE="$(grep -E '/Image\.(lz4|gz)$' kernel-images.txt | head -1)"
          fi

          test -n "$IMAGE"
          test -f "kernel/$IMAGE"

          echo "Image:"
          echo "$IMAGE"

          ls -lh "kernel/$IMAGE"

          SIZE="$(stat -c%s "kernel/$IMAGE")"

          echo "Image size: $SIZE bytes"

          if [ "$SIZE" -lt 2000000 ]; then
            echo "::error::Kernel Image suspiciously small"
            exit 1
          fi

      # ============================================================
      # 14. GUARDAR ARTIFACTS
      # ============================================================

      - name: Collect build artifacts
        if: always()
        shell: bash
        run: |
          set +e

          mkdir -p artifacts

          cp \
            bazel-targets.log \
            artifacts/ \
            2>/dev/null

          cp \
            bazel-peridot-targets.log \
            artifacts/ \
            2>/dev/null

          cp \
            detected-peridot-targets.txt \
            artifacts/ \
            2>/dev/null

          cp \
            kernel-images.txt \
            artifacts/ \
            2>/dev/null

          cp \
            kleaf-build.log \
            artifacts/ \
            2>/dev/null

          cp \
            kernel/out/.config \
            artifacts/defconfig-final \
            2>/dev/null

          echo "Artifacts:"
          find artifacts -type f -maxdepth 2 -ls

      # ============================================================
      # 15. SUBIR ARTIFACTS
      # ============================================================

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Peridot-Kleaf-Build
          if-no-files-found: warn
          path: |
            artifacts/
            kernel/bazel-bin/**/Image
            kernel/bazel-bin/**/Image.lz4
            kernel/bazel-bin/**/Image.gz

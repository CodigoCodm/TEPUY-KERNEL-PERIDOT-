name: Build Tepuy Kernel - POCO F6 / Peridot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      KERNEL_DIR: ${{ github.workspace }}/kernel-peridot
      OUT_DIR: ${{ github.workspace }}/kernel-peridot/out
      DEFCONFIG: peridot_defconfig

      # Xiaomi original
      KERNEL_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
      KERNEL_BRANCH: peridot-u-oss

    steps:

      # ==========================================================
      # 1. CHECKOUT TEPUY REPOSITORY
      # ==========================================================

      - name: Checkout Tepuy
        uses: actions/checkout@v4
        with:
          path: tepuy

      # ==========================================================
      # 2. DEPENDENCIAS
      # ==========================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            flex \
            build-essential \
            clang \
            lld \
            llvm \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            dwarves \
            cpio \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip \
            curl \
            wget

      # ==========================================================
      # 3. CLONE ORIGINAL XIAOMI PERIDOT SOURCE
      # ==========================================================

      - name: Clone original Xiaomi Peridot source
        run: |
          set -e

          echo "=============================================="
          echo " CLONE ORIGINAL XIAOMI PERIDOT SOURCE"
          echo "=============================================="

          rm -rf "$KERNEL_DIR"

          git clone \
            --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          cd "$KERNEL_DIR"

          echo
          echo "Remote:"
          git remote -v

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

      # ==========================================================
      # 4. VALIDATE SOURCE
      # ==========================================================

      - name: Validate Xiaomi source
        run: |
          set -e

          cd "$KERNEL_DIR"

          echo "=============================================="
          echo " VALIDATE KERNEL SOURCE"
          echo "=============================================="

          test -f Makefile
          test -d arch
          test -d drivers
          test -d kernel

          echo "[OK] Kernel source valid"

          echo
          echo "Searching Peridot defconfig..."

          find arch -type f \
            \( -name "*peridot*defconfig" -o -name "peridot_defconfig" \) \
            -print

      # ==========================================================
      # 5. APPLY TEPUY PATCH
      # ==========================================================

      - name: Apply Tepuy patch
        run: |
          set -e

          echo "=============================================="
          echo " APPLY TEPUY PATCH"
          echo "=============================================="

          PATCHER="$GITHUB_WORKSPACE/tepuy/tepuy-patcher-compat.py"

          if [ ! -f "$PATCHER" ]; then
            echo "[ERROR] Patcher not found:"
            echo "$PATCHER"
            exit 1
          fi

          python3 "$PATCHER" "$KERNEL_DIR"

      # ==========================================================
      # 6. PREPARE TOOLCHAIN
      # ==========================================================

      - name: Prepare Clang
        run: |
          set -e

          echo "=============================================="
          echo " PREPARE CLANG TOOLCHAIN"
          echo "=============================================="

          clang --version
          ld.lld --version

      # ==========================================================
      # 7. DEFCONFIG
      # ==========================================================

      - name: Kernel defconfig
        run: |
          set -e

          echo "=============================================="
          echo " DEFCONFIG"
          echo "=============================================="

          cd "$KERNEL_DIR"

          mkdir -p "$OUT_DIR"

          make O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            "$DEFCONFIG"

      # ==========================================================
      # 8. BUILD KERNEL
      # ==========================================================

      - name: Build kernel
        run: |
          set -o pipefail

          echo "=============================================="
          echo " START KERNEL BUILD"
          echo "=============================================="

          echo "Kernel:"
          echo "$KERNEL_DIR"

          echo "Output:"
          echo "$OUT_DIR"

          echo "Defconfig:"
          echo "$DEFCONFIG"

          cd "$KERNEL_DIR"

          make -j"$(nproc)" \
            O="$OUT_DIR" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # ==========================================================
      # 9. VERIFY IMAGE
      # ==========================================================

      - name: Verify Image
        run: |
          set -e

          echo "=============================================="
          echo " VERIFY KERNEL IMAGE"
          echo "=============================================="

          IMAGE="$OUT_DIR/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "[ERROR] Image not generated"
            exit 1
          fi

          echo "[OK] Image generated"

          ls -lh "$IMAGE"

          file "$IMAGE"

      # ==========================================================
      # 10. PACKAGE
      # ==========================================================

      - name: Package kernel
        run: |
          set -e

          echo "=============================================="
          echo " PACKAGE"
          echo "=============================================="

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp \
            "$OUT_DIR/arch/arm64/boot/Image" \
            "$GITHUB_WORKSPACE/artifacts/Image"

          cp \
            "$GITHUB_WORKSPACE/build.log" \
            "$GITHUB_WORKSPACE/artifacts/build.log"

          cd "$GITHUB_WORKSPACE/artifacts"

          zip -9 \
            tepuy-peridot-kernel.zip \
            Image \
            build.log

          ls -lh

      # ==========================================================
      # 11. UPLOAD ARTIFACTS
      # ==========================================================

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: tepuy-peridot-kernel
          path: |
            artifacts/Image
            artifacts/tepuy-peridot-kernel.zip
            artifacts/build.log

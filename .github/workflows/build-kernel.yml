name: Build Tepuy Kernel for Poco F6 (peridot)

'on':
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to use (default: gki_defconfig)'
        required: true
        default: 'gki_defconfig'
        type: string

env:
  ARCH: arm64
  SUBARCH: arm64
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_NOHASHDIR: 'true'
  CCACHE_MAXSIZE: '2G'
  CCACHE_HARDLINK: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        env:
          DEBIAN_FRONTEND: noninteractive
          DEBIAN_PRIORITY: critical
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends             git bc bison flex libssl-dev make             gcc-aarch64-linux-gnu clang llvm lld             device-tree-compiler python3 zip unzip             wget ccache libelf-dev libncurses-dev             libxml2-utils gcc-arm-linux-gnueabi

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-peridot
          max-size: 2G

      - name: Verify system Clang
        run: |
          echo "System Clang version:"
          clang --version

      - name: Clone LineageOS kernel for peridot
        run: |
          git clone --depth=1 -b lineage-23.2             https://github.com/LineageOS/android_kernel_xiaomi_sm8635             $HOME/kernel-peridot

      - name: List available defconfigs
        run: |
          echo "=== Defconfigs disponibles ==="
          ls $HOME/kernel-peridot/arch/arm64/configs/ 2>/dev/null || echo "No hay archivos en arch/arm64/configs/"

      - name: Apply Tepuy GameMode patches (Python)
        run: |
          cd $HOME/kernel-peridot
          python3 ${{ github.workspace }}/tepuy-patcher.py $HOME/kernel-peridot
          echo ""
          echo "=== Verifying modifications ==="
          grep -n "tepuy_game_mode" drivers/cpufreq/qcom-cpufreq-hw.c | head -5
          grep -n "tepuy_game_mode" drivers/gpu/drm/msm/adreno/adreno_gpu.c | head -3
          grep -n "tepuy_game_mode" drivers/gpu/drm/msm/adreno/a6xx_gmu.c | head -3

      - name: Build kernel
        run: |
          cd $HOME/kernel-peridot
          mkdir -p out

          export CC="clang"
          export CXX="clang++"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export STRIP="llvm-strip"
          export LLVM=1
          export LLVM_IAS=1
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          make O=out ${{ github.event.inputs.defconfig }} 2>&1 | tee -a out/build.log
          make -j$(nproc --all) O=out 2>&1 | tee -a out/build.log

          echo ""
          echo "=== Build output files ==="
          find out -name "Image*" -type f 2>/dev/null | while read f; do
            echo "Found: $f ($(stat -c%s "$f") bytes)"
          done

          echo ""
          echo "=== arch/arm64/boot contents ==="
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "Directory does not exist"

      - name: Compress kernel image if needed
        run: |
          cd $HOME/kernel-peridot

          # Si no hay Image.gz pero hay Image, comprimirlo
          if [ ! -f "out/arch/arm64/boot/Image.gz" ] && [ -f "out/arch/arm64/boot/Image" ]; then
            echo "Compressing Image -> Image.gz"
            gzip -c out/arch/arm64/boot/Image > out/arch/arm64/boot/Image.gz
          fi

          # Si hay Image.gz-dtb, renombrarlo
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ] && [ ! -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Found Image.gz-dtb, copying to Image.gz"
            cp out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image.gz
          fi

          echo "=== Final boot files ==="
          ls -la out/arch/arm64/boot/ 2>/dev/null || echo "No boot directory"

      - name: Prepare AnyKernel3
        run: |
          cd $HOME
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          cp ${{ github.workspace }}/anykernel.sh ./anykernel.sh

          # Copiar la imagen del kernel
          if [ -f "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" ]; then
            cp $HOME/kernel-peridot/out/arch/arm64/boot/Image.gz ./Image.gz
            echo "Copied Image.gz"
          elif [ -f "$HOME/kernel-peridot/out/arch/arm64/boot/Image" ]; then
            cp $HOME/kernel-peridot/out/arch/arm64/boot/Image ./Image
            echo "Copied Image"
          else
            echo "ERROR: No kernel image found!"
            exit 1
          fi

          zip -r9 $HOME/Tepuy-GameMode-peridot.zip * -x "*.zip" "*.git*" "README*"
          echo "AnyKernel3 zip created"
          ls -lh $HOME/Tepuy-GameMode-peridot.zip

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz
            ~/kernel-peridot/out/arch/arm64/boot/Image
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-GameMode-peridot
          path: ~/Tepuy-GameMode-peridot.zip
          retention-days: 30

      - name: Upload build log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/kernel-peridot/out/build.log
          retention-days: 7

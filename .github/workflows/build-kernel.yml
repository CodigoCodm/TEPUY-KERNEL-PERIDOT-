name: Build Tepuy Kernel for POCO F6 Peridot

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: "compat"
        type: choice
        options:
          - compat
          - full
          - both

env:
  ARCH: arm64
  SUBARCH: arm64
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "2G"
  CCACHE_HARDLINK: "true"

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Tepuy repository
        uses: actions/checkout@v4

      # ============================================================
      # BUILD ENVIRONMENT
      # ============================================================

      - name: Setup build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo apt-get update -qq

          sudo apt-get install -y -qq --no-install-recommends \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            make \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            clang \
            llvm \
            lld \
            device-tree-compiler \
            python3 \
            zip \
            unzip \
            wget \
            curl \
            ccache \
            libelf-dev \
            libncurses-dev \
            libxml2-utils \
            dwarves \
            jq \
            file

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tepuy-peridot
          max-size: 2G

      # ============================================================
      # CLONE ORIGINAL PERIDOT OSS
      # ============================================================

      - name: Clone original Xiaomi Peridot kernel
        run: |
          set -e

          echo "=============================================="
          echo " CLONE ORIGINAL XIAOMI PERIDOT SOURCE"
          echo "=============================================="

          rm -rf "$HOME/kernel-peridot"

          git clone --depth=1 \
            -b peridot-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            "$HOME/kernel-peridot"

          cd "$HOME/kernel-peridot"

          echo ""
          echo "=== Git information ==="

          git remote -v
          git branch --show-current
          git rev-parse --short HEAD

          echo ""
          echo "=== Peridot source verification ==="

          test -f Makefile
          test -d arch/arm64
          test -d drivers
          test -d vendor

          echo "[OK] Xiaomi Peridot OSS source detected"

      # ============================================================
      # FIX OSS HWID KCONFIG REFERENCE
      #
      # peridot-u-oss contains:
      #
      # source "drivers/misc/hwid/Kconfig"
      #
      # but the OSS tree does not contain:
      #
      # drivers/misc/hwid/Kconfig
      #
      # We DO NOT create a fake driver.
      # We only disable the dangling Kconfig reference.
      # ============================================================

      - name: Fix missing optional HWID Kconfig
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " FIX OPTIONAL HWID KCONFIG"
          echo "=============================================="

          HWID_DIR="drivers/misc/hwid"
          HWID_KCONFIG="$HWID_DIR/Kconfig"
          MISC_KCONFIG="drivers/misc/Kconfig"

          if [ -f "$HWID_KCONFIG" ]; then

            echo "[OK] HWID source exists"
            echo "[INFO] No HWID modification required"

          else

            echo "[WARNING] $HWID_KCONFIG is missing"

            if grep -q 'source "drivers/misc/hwid/Kconfig"' "$MISC_KCONFIG"; then

              cp "$MISC_KCONFIG" "$MISC_KCONFIG.tepuy-hwid.bak"

              python3 - "$MISC_KCONFIG" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          old = 'source "drivers/misc/hwid/Kconfig"'
          new = '# source "drivers/misc/hwid/Kconfig"  # HWID unavailable in OSS tree'

          if old not in data:
              raise SystemExit(
                  "HWID Kconfig reference was not found"
              )

          data = data.replace(old, new, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)
          PY

              echo "[OK] Missing HWID Kconfig reference disabled"
              echo "[INFO] No fake HWID driver was created"

            else

              echo "[INFO] No HWID Kconfig reference found"

            fi
          fi

          echo ""
          echo "=== HWID verification ==="

          if grep -n 'hwid/Kconfig' drivers/misc/Kconfig; then
            echo "[INFO] HWID reference remains commented/handled"
          else
            echo "[OK] No active missing HWID reference"
          fi

      # ============================================================
      # VERIFY PERIDOT CONFIGURATION
      # ============================================================

      - name: Verify Peridot configuration
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " VERIFY PERIDOT CONFIGURATION"
          echo "=============================================="

          test -f arch/arm64/configs/gki_defconfig
          test -f arch/arm64/configs/vendor/peridot_GKI.config
          test -f arch/arm64/configs/vendor/peridot_consolidate.config

          echo "[OK] gki_defconfig found"
          echo "[OK] vendor/peridot_GKI.config found"
          echo "[OK] vendor/peridot_consolidate.config found"

          echo ""
          echo "Peridot configs:"
          find arch/arm64/configs -type f \
            \( -iname "*peridot*" -o -iname "*gki*" \) \
            | sort

      # ============================================================
      # PREPARE PERIDOT CONFIG
      # ============================================================

      - name: Prepare Peridot GKI configuration
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " PREPARE PERIDOT CONFIG"
          echo "=============================================="

          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64

          echo "[INFO] Base config: gki_defconfig"
          echo "[INFO] Peridot fragment: vendor/peridot_GKI.config"

          make O=out gki_defconfig

          echo ""
          echo "[OK] Base GKI configuration generated"

          if [ -f out/.config ]; then
            echo "[OK] out/.config exists"
          else
            echo "[ERROR] out/.config was not generated"
            exit 1
          fi

          echo ""
          echo "=== Applying Peridot configuration ==="

          make O=out \
            KCONFIG_ALLCONFIG=arch/arm64/configs/vendor/peridot_GKI.config \
            alldefconfig

          echo ""
          echo "[OK] Peridot GKI configuration applied"

          echo ""
          echo "=== Configuration verification ==="

          grep -E \
            'CONFIG_ARM64=|CONFIG_SMP=|CONFIG_MODULES=' \
            out/.config \
            | head -20 || true

      # ============================================================
      # APPLY TEPUY COMPAT PATCH
      #
      # IMPORTANT:
      # This uses the SAME patcher structure that previously compiled.
      # ============================================================

      - name: Apply Tepuy GameMode COMPAT patch
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          echo "=============================================="
          echo " APPLY TEPUY COMPAT PATCH"
          echo "=============================================="

          cd "$HOME/kernel-peridot"

          python3 \
            "${{ github.workspace }}/tepuy-patcher-compat.py" \
            "$HOME/kernel-peridot"

          echo ""
          echo "=============================================="
          echo " VERIFY TEPUY PATCH"
          echo "=============================================="

          test -f kernel/tepuy_sysfs.c

          grep -n "tepuy_game_mode" \
            kernel/tepuy_sysfs.c \
            | head -10 || true

          grep -n "tepuy_game_mode" \
            drivers/cpufreq/cpufreq.c \
            | head -10 || true

          grep -n "tepuy_game_mode" \
            drivers/thermal/thermal_core.c \
            | head -10 || true

          echo ""
          echo "[OK] Tepuy COMPAT patch applied"

      # ============================================================
      # APPLY TEPUY FULL PATCH
      # ============================================================

      - name: Apply Tepuy GameMode FULL patch
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          echo "=============================================="
          echo " APPLY TEPUY FULL PATCH"
          echo "=============================================="

          cd "$HOME/kernel-peridot"

          if [ ! -f "${{ github.workspace }}/tepuy-patcher.py" ]; then
            echo "[ERROR] tepuy-patcher.py not found"
            exit 1
          fi

          python3 \
            "${{ github.workspace }}/tepuy-patcher.py" \
            "$HOME/kernel-peridot"

          echo ""
          echo "[OK] Tepuy FULL patch applied"

      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build kernel
        run: |
          set -o pipefail

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " START KERNEL BUILD"
          echo "=============================================="

          export ARCH=arm64
          export SUBARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          export LLVM=1
          export LLVM_IAS=1

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          mkdir -p out

          echo ""
          echo "=============================================="
          echo " FINAL DEFCONFIG"
          echo "=============================================="

          make O=out gki_defconfig \
            2>&1 | tee out/build.log

          echo ""
          echo "=============================================="
          echo " APPLY PERIDOT CONFIG"
          echo "=============================================="

          make O=out \
            KCONFIG_ALLCONFIG=arch/arm64/configs/vendor/peridot_GKI.config \
            alldefconfig \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " COMPILE KERNEL"
          echo "=============================================="

          make O=out \
            -j"$(nproc --all)" \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " COMPILE MODULES"
          echo "=============================================="

          make O=out \
            -j"$(nproc --all)" \
            modules \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " INSTALL MODULES"
          echo "=============================================="

          rm -rf "$HOME/modules_staging"

          make O=out \
            INSTALL_MOD_PATH="$HOME/modules_staging" \
            INSTALL_MOD_STRIP=1 \
            modules_install \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " BUILD RESULTS"
          echo "=============================================="

          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -print \
            2>/dev/null || true

          echo ""
          echo "Modules:"
          find "$HOME/modules_staging" \
            -name "*.ko" \
            -type f \
            | wc -l

      # ============================================================
      # PREPARE IMAGE.GZ
      # ============================================================

      - name: Prepare kernel image
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " PREPARE KERNEL IMAGE"
          echo "=============================================="

          KERNEL_IMAGE=""

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image.gz-dtb"

          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image.gz"

          elif [ -f out/arch/arm64/boot/Image ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image"

          fi

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "[ERROR] No kernel image found"
            exit 1
          fi

          echo "[OK] Kernel image:"
          echo "$KERNEL_IMAGE"

          if [ "$KERNEL_IMAGE" != "out/arch/arm64/boot/Image.gz" ]; then
            cp "$KERNEL_IMAGE" \
              out/arch/arm64/boot/Image.gz
          fi

          ls -lh out/arch/arm64/boot/Image.gz

      # ============================================================
      # MAGISKBOOT
      # ============================================================

      - name: Download magiskboot
        run: |
          set -e

          echo "=============================================="
          echo " DOWNLOAD MAGISKBOOT"
          echo "=============================================="

          mkdir -p "$HOME/magisk"

          cd "$HOME/magisk"

          APK_URL=$(curl -sf \
            https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | jq -r \
              '.assets[] |
               select(.name | test("^Magisk-v.*\\.apk$")) |
               .browser_download_url' \
            | head -n1)

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "[ERROR] Could not find Magisk APK"
            exit 1
          fi

          curl -Lfo magisk.apk "$APK_URL"

          unzip -j magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d . \
            2>/dev/null || true

          if [ ! -f libmagiskboot.so ]; then
            unzip -j magisk.apk \
              "lib/arm64-v8a/libmagiskboot.so" \
              -d . \
              2>/dev/null || true
          fi

          if [ ! -f libmagiskboot.so ]; then
            echo "[ERROR] Could not extract magiskboot"
            exit 1
          fi

          mv libmagiskboot.so magiskboot
          chmod +x magiskboot

          echo "[OK] magiskboot ready"

      # ============================================================
      # BOOT IMAGE
      # ============================================================

      - name: Build boot.img
        run: |
          set -e

          echo "=============================================="
          echo " BUILD BOOT.IMG"
          echo "=============================================="

          if [ ! -f "${{ github.workspace }}/boot_stock.img" ]; then
            echo "[ERROR] boot_stock.img not found"
            exit 1
          fi

          if [ ! -x "$HOME/magisk/magiskboot" ]; then
            echo "[ERROR] magiskboot unavailable"
            exit 1
          fi

          cp \
            "${{ github.workspace }}/boot_stock.img" \
            "$HOME/boot_stock.img"

          cd "$HOME"

          echo "=== Unpacking stock boot ==="

          "$HOME/magisk/magiskboot" \
            unpack boot_stock.img

          echo "=== Replacing kernel ==="

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            "$HOME/kernel"

          echo "=== Repacking boot ==="

          "$HOME/magisk/magiskboot" \
            repack boot_stock.img boot_tepuy.img

          test -f "$HOME/boot_tepuy.img"

          echo ""
          echo "[OK] boot_tepuy.img created"

          ls -lh "$HOME/boot_tepuy.img"

      # ============================================================
      # COMPAT ANYKERNEL
      # ============================================================

      - name: Build COMPAT zip
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          cd "$HOME"

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3-compat

          cd AnyKernel3-compat

          cp \
            "${{ github.workspace }}/anykernel-compat.sh" \
            ./anykernel.sh

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            ./Image.gz

          if [ -f "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb" ]; then
            cp \
              "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb" \
              ./dtb
          else
            DTB=$(find \
              "$HOME/kernel-peridot/out/arch/arm64/boot/dts" \
              -name "*.dtb" \
              | head -1)

            if [ -n "$DTB" ]; then
              cp "$DTB" ./dtb
            fi
          fi

          mkdir -p tools

          if [ -d "${{ github.workspace }}/tools" ]; then
            cp -r \
              "${{ github.workspace }}/tools/"* \
              tools/ \
              2>/dev/null || true

            chmod -R 755 tools/ || true
          fi

          if [ -f "${{ github.workspace }}/tools/ak3-core.sh" ]; then
            cp \
              "${{ github.workspace }}/tools/ak3-core.sh" \
              tools/ak3-core.sh
          fi

          zip -r9 \
            "$HOME/Tepuy-Kernel-Compat-peridot.zip" \
            * \
            -x "*.zip" "*.git*" "README*"

          echo "[OK] COMPAT ZIP created"

          ls -lh \
            "$HOME/Tepuy-Kernel-Compat-peridot.zip"

      # ============================================================
      # FULL ANYKERNEL
      # ============================================================

      - name: Build FULL zip
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          cd "$HOME"

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3-full

          cd AnyKernel3-full

          cp \
            "${{ github.workspace }}/anykernel-full.sh" \
            ./anykernel.sh

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            ./Image.gz

          if [ -f "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb" ]; then
            cp \
              "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb" \
              ./dtb
          else
            DTB=$(find \
              "$HOME/kernel-peridot/out/arch/arm64/boot/dts" \
              -name "*.dtb" \
              | head -1)

            if [ -n "$DTB" ]; then
              cp "$DTB" ./dtb
            fi
          fi

          if [ -f "${{ github.workspace }}/dtbo.img" ]; then
            cp \
              "${{ github.workspace }}/dtbo.img" \
              ./dtbo.img
          fi

          mkdir -p _modules _system_dlkm

          if [ -f "${{ github.workspace }}/prepare-modules.py" ]; then
            python3 \
              "${{ github.workspace }}/prepare-modules.py" \
              --input "$HOME/modules_staging" \
              --vendor-out "_modules" \
              --system-out "_system_dlkm"
          fi

          mkdir -p tools

          if [ -d "${{ github.workspace }}/tools" ]; then
            cp -r \
              "${{ github.workspace }}/tools/"* \
              tools/ \
              2>/dev/null || true

            chmod -R 755 tools/ || true
          fi

          if [ -f "${{ github.workspace }}/tools/ak3-core.sh" ]; then
            cp \
              "${{ github.workspace }}/tools/ak3-core.sh" \
              tools/ak3-core.sh
          fi

          zip -r9 \
            "$HOME/Tepuy-Kernel-Full-peridot.zip" \
            * \
            -x "*.zip" "*.git*" "README*"

          echo "[OK] FULL ZIP created"

          ls -lh \
            "$HOME/Tepuy-Kernel-Full-peridot.zip"

      # ============================================================
      # GAMEMODE MODULE
      # ============================================================

      - name: Build GameMode Auto-Activator module
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          mkdir -p "$HOME/gamemode-module"

          cd "$HOME/gamemode-module"

          cat > module.prop <<'EOF'
          id=tepuy-gamemode-auto
          name=Tepuy GameMode Auto-Activator
          version=1.0
          versionCode=1
          author=CodigoCodm
          description=Activa automaticamente Tepuy GameMode al arrancar. Requiere kernel Tepuy.
          EOF

          cat > service.sh <<'EOF'
          #!/system/bin/sh

          LOG_FILE="/data/local/tmp/tepuy-gamemode.log"
          SYSFS_NODE="/sys/kernel/tepuy_boost/game_mode"
          MAX_WAIT=30

          log_msg() {
              echo "[$(date "+%Y-%m-%d %H:%M:%S")] $1" >> "$LOG_FILE"
          }

          rm -f "$LOG_FILE"

          log_msg "=== Tepuy GameMode Auto-Activator iniciado ==="
          log_msg "Esperando sysfs node..."

          waited=0

          while [ ! -f "$SYSFS_NODE" ]; do
              sleep 1
              waited=$((waited + 1))

              if [ "$waited" -ge "$MAX_WAIT" ]; then
                  log_msg "ERROR: sysfs node no aparecio despues de ${MAX_WAIT}s"
                  exit 1
              fi
          done

          log_msg "sysfs node encontrado despues de ${waited}s"

          current=$(cat "$SYSFS_NODE" 2>/dev/null)

          log_msg "Estado actual: $current"

          if echo 1 > "$SYSFS_NODE" 2>/dev/null; then
              new_state=$(cat "$SYSFS_NODE" 2>/dev/null)
              log_msg "SUCCESS: GameMode activado. Estado: $new_state"
          else
              log_msg "ERROR: No se pudo escribir en sysfs"
              exit 1
          fi

          log_msg "=== Activacion completada ==="
          EOF

          chmod 755 service.sh

          zip -r9 \
            "$HOME/Tepuy-GameMode-AutoActivator.zip" \
            module.prop \
            service.sh

          echo "[OK] GameMode module created"

          ls -lh \
            "$HOME/Tepuy-GameMode-AutoActivator.zip"

      # ============================================================
      # UPLOAD BOOT
      # ============================================================

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot_tepuy
          path: ~/boot_tepuy.img
          retention-days: 30

      # ============================================================
      # UPLOAD COMPAT
      # ============================================================

      - name: Upload COMPAT zip
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Kernel-Compat-peridot
          path: ~/Tepuy-Kernel-Compat-peridot.zip
          retention-days: 30

      # ============================================================
      # UPLOAD FULL
      # ============================================================

      - name: Upload FULL zip
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Kernel-Full-peridot
          path: ~/Tepuy-Kernel-Full-peridot.zip
          retention-days: 30

      # ============================================================
      # UPLOAD GAMEMODE
      # ============================================================

      - name: Upload GameMode Auto-Activator
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-GameMode-AutoActivator
          path: ~/Tepuy-GameMode-AutoActivator.zip
          retention-days: 30

      # ============================================================
      # UPLOAD IMAGE
      # ============================================================

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz-dtb
            ~/kernel-peridot/out/arch/arm64/boot/Image
          retention-days: 30
          if-no-files-found: ignore

      # ============================================================
      # UPLOAD BUILD LOG ON FAILURE
      # ============================================================

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/kernel-peridot/out/build.log
          retention-days: 7

name: TEPUY Peridot - Base Kernel Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Peridot Base Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    env:
      ARCH: arm64
      SUBARCH: arm64
      LLVM: "1"
      LLVM_IAS: "1"
      KBUILD_BUILD_USER: Codigocodm
      KBUILD_BUILD_HOST: TEPUY

    steps:

      # ============================================================
      # 1. CHECKOUT TEPUY REPOSITORY
      # ============================================================

      - name: Checkout TEPUY
        uses: actions/checkout@v4

      # ============================================================
      # 2. DEPENDENCIAS
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            pahole \
            python3 \
            rsync \
            unzip \
            wget \
            zip

      # ============================================================
      # 3. CCACHE
      # ============================================================

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: peridot-base
          max-size: 5G

      # ============================================================
      # 4. CLONAR XIAOMI
      # ============================================================

      - name: Clone Xiaomi kernel
        run: |
          set -e

          git clone \
            --depth=1 \
            --branch peridot-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            kernel

          cd kernel

          echo "=========================================="
          echo "XIAOMI PERIDOT"
          echo "=========================================="

          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git rev-parse HEAD

      # ============================================================
      # 5. COMPROBAR CONFIG
      # ============================================================

      - name: Check Peridot configuration
        run: |
          set -e

          cd kernel

          test -f arch/arm64/configs/gki_defconfig
          test -f arch/arm64/configs/vendor/peridot_GKI.config

          echo "[OK] gki_defconfig"
          echo "[OK] peridot_GKI.config"

      # ============================================================
      # 6. PREPARAR OUTPUT
      # ============================================================

      - name: Prepare output
        run: |
          set -e

          cd kernel

          rm -rf out
          mkdir -p out

      # ============================================================
      # 7. CONFIGURAR GKI
      # ============================================================

      - name: Configure GKI
        run: |
          set -e

          cd kernel

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            gki_defconfig

      # ============================================================
      # 8. APLICAR CONFIG PERIDOT
      # ============================================================

      - name: Apply Peridot GKI configuration
        run: |
          set -e

          cd kernel

          cat \
            arch/arm64/configs/vendor/peridot_GKI.config \
            >> out/.config

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            olddefconfig

      # ============================================================
      # 9. GUARDAR CONFIG
      # ============================================================

      - name: Save final config
        run: |
          set -e

          cd kernel

          cp \
            out/.config \
            out/defconfig-final

          echo "=========================================="
          echo "CONFIG FINAL"
          echo "=========================================="

          grep "^CONFIG_MODULES=" out/.config || true
          grep "^CONFIG_KALLSYMS=" out/.config || true
          grep "^CONFIG_KALLSYMS_ALL=" out/.config || true

      # ============================================================
      # 10. COMPILAR KERNEL
      # ============================================================

      - name: Build kernel
        run: |
          set -eo pipefail

          cd kernel

          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          echo "=========================================="
          echo "BUILDING IMAGE"
          echo "=========================================="

          make \
            O=out \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            -j"$(nproc)" \
            Image \
            2>&1 | tee out/build.log

      # ============================================================
      # 11. VERIFICAR IMAGE
      # ============================================================

      - name: Verify Image
        run: |
          set -e

          cd kernel

          IMAGE="out/arch/arm64/boot/Image"

          if [ ! -f "$IMAGE" ]; then
            echo "::error::Image no fue generado"
            exit 1
          fi

          echo "=========================================="
          echo "IMAGE"
          echo "=========================================="

          ls -lh "$IMAGE"
          file "$IMAGE"

          SIZE=$(stat -c%s "$IMAGE")

          echo "Image size: $SIZE bytes"

          if [ "$SIZE" -lt 2000000 ]; then
            echo "::error::Image sospechosamente pequeño"
            exit 1
          fi

      # ============================================================
      # 12. PREPARAR ANYKERNEL3
      # ============================================================

      - name: Clone AnyKernel3
        run: |
          set -e

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3

          rm -rf AnyKernel3/.git

      # ============================================================
      # 13. COPIAR IMAGE SIN COMPRIMIR
      # ============================================================

      - name: Copy Image
        run: |
          set -e

          cp \
            kernel/out/arch/arm64/boot/Image \
            AnyKernel3/Image

          ls -lh AnyKernel3/Image

      # ============================================================
      # 14. CREAR ANYKERNEL.SH ESPECIFICO
      # ============================================================

      - name: Configure AnyKernel
        run: |
          set -e

          cat > AnyKernel3/anykernel.sh <<'EOF'
          # AnyKernel3 Ramdisk Mod Script
          # TEPUY Peridot BASE TEST

          properties() {
          kernel.string=TEPUY Peridot BASE
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=peridot
          device.name2=
          supported.versions=
          supported.patchlevels=
          }

          ## AnyKernel setup
          . tools/ak3-core.sh;

          ## Boot install
          dump_boot;

          ## Replace ONLY kernel Image
          write_boot;

          ## End
          EOF

          chmod 755 AnyKernel3/anykernel.sh

      # ============================================================
      # 15. LIMPIAR ARCHIVOS INNECESARIOS
      # ============================================================

      - name: Clean AnyKernel package
        run: |
          set -e

          cd AnyKernel3

          rm -f \
            Image.gz \
            zImage \
            zImage-dtb \
            Image-dtb \
            Image.lz4 \
            Image.lz4-dtb \
            Image.bz2 \
            Image.xz \
            Image.lzma

      # ============================================================
      # 16. CREAR ZIP
      # ============================================================

      - name: Create kernel ZIP
        run: |
          set -e

          cd AnyKernel3

          zip \
            -r9 \
            ../Tepuy-Peridot-BASE-Image.zip \
            . \
            -x "*.git*" \
            -x "*.zip"

          cd ..

          ls -lh Tepuy-Peridot-BASE-Image.zip

      # ============================================================
      # 17. BUILD INFO
      # ============================================================

      - name: Generate build information
        run: |
          set -e

          mkdir -p build-info

          echo "TEPUY PERIDOT BASE TEST" \
            > build-info/build.txt

          echo "" \
            >> build-info/build.txt

          echo "Kernel source:" \
            >> build-info/build.txt

          cd kernel

          git rev-parse HEAD \
            >> ../build-info/build.txt

          echo "" \
            >> ../build-info/build.txt

          echo "Config:" \
            >> ../build-info/build.txt

          grep "^CONFIG_MODULES=" \
            out/.config \
            >> ../build-info/build.txt || true

      # ============================================================
      # 18. SUBIR ARTIFACTS
      # ============================================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Peridot-BASE
          if-no-files-found: error
          path: |
            Tepuy-Peridot-BASE-Image.zip
            kernel/out/arch/arm64/boot/Image
            kernel/out/defconfig-final
            kernel/out/build.log
            build-info/build.txt

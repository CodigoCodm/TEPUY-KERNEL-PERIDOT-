name: Build Tepuy Kernel for Poco F6 (Peridot HyperOS)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig to use"
        required: true
        default: "peridot_defconfig"
        type: string

      build_mode:
        description: "Build mode"
        required: true
        default: compat
        type: choice
        options:
          - compat
          - full
          - both

env:
  ARCH: arm64
  SUBARCH: arm64
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "2G"
  CCACHE_HARDLINK: "true"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:

      - name: Checkout Tepuy Repository
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update

          sudo apt install -y \
            bc bison build-essential flex git \
            libelf-dev libssl-dev libncurses-dev \
            python3 python3-pip python-is-python3 \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            zip unzip jq curl ccache \
            device-tree-compiler dwarves

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tepuy-peridot-hyperos
          max-size: 2G

      ######################################################################
      # CLONE OFFICIAL XIAOMI SOURCE
      ######################################################################

      - name: Clone Xiaomi Kernel OpenSource (Peridot HyperOS)
        run: |

          git clone --depth=1 \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            $HOME/kernel-peridot

          cd $HOME/kernel-peridot

          git checkout peridot-s-oss

          echo "Kernel source:"
          git log --oneline -1

      ######################################################################
      # APPLY TEPUY PATCHES
      ######################################################################

      - name: Apply Tepuy GameMode patches (COMPAT)
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          cd $HOME/kernel-peridot

          python3 ${{ github.workspace }}/tepuy-patcher-compat.py $HOME/kernel-peridot

          echo "=== Verify Tepuy patches ==="
          grep -R "tepuy_game_mode" -n kernel drivers || true

      - name: Apply Tepuy GameMode patches (FULL)
        if: github.event.inputs.build_mode == 'full'
        run: |
          cd $HOME/kernel-peridot

          python3 ${{ github.workspace }}/tepuy-patcher.py $HOME/kernel-peridot

          echo "=== Verify FULL patches ==="
          grep -R "tepuy_game_mode" -n kernel drivers || true

      ######################################################################
      # BUILD
      ######################################################################

      - name: Build Kernel
        run: |

          cd $HOME/kernel-peridot

          mkdir out

          export ARCH=arm64
          export SUBARCH=arm64

          export CC=clang
          export LLVM=1
          export LLVM_IAS=1

          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          make O=out ${{ github.event.inputs.defconfig }}

          make O=out -j$(nproc)

          make O=out modules -j$(nproc)

          make O=out \
            INSTALL_MOD_PATH=$HOME/modules_staging \
            INSTALL_MOD_STRIP=1 \
            modules_install

          echo "=== Generated Images ==="
          find out/arch/arm64/boot -maxdepth 1 -type f

      ######################################################################
      # PREPARE RAW KERNEL IMAGE
      ######################################################################

      - name: Prepare Kernel Image
        run: |

          cd $HOME/kernel-peridot

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "Kernel RAW Image not found!"
            exit 1
          fi

          cp out/arch/arm64/boot/Image $HOME/Image

          gzip -c out/arch/arm64/boot/Image > $HOME/Image.gz

          ls -lh $HOME/Image
          ls -lh $HOME/Image.gz

      ######################################################################
      # DOWNLOAD MAGISKBOOT
      ######################################################################

      - name: Download MagiskBoot
        run: |

          mkdir -p $HOME/magisk

          cd $HOME/magisk

          curl -L \
            https://github.com/topjohnwu/Magisk/releases/latest/download/Magisk-v29.0.apk \
            -o magisk.apk

          unzip -j magisk.apk lib/x86_64/libmagiskboot.so

          mv libmagiskboot.so magiskboot

          chmod +x magiskboot

          ./magiskboot

      ######################################################################
      # CREATE boot_tepuy.img
      ######################################################################

      - name: Build boot_tepuy.img
        run: |

          cd $HOME

          if [ ! -f "${{ github.workspace }}/boot_stock.img" ]; then
            echo "boot_stock.img missing!"
            exit 1
          fi

          cp ${{ github.workspace }}/boot_stock.img .

          $HOME/magisk/magiskboot unpack -h boot_stock.img

          mv kernel kernel_stock

          cp $HOME/Image kernel

          $HOME/magisk/magiskboot repack boot_stock.img

          mv new-boot.img boot_tepuy.img

          ls -lh boot_tepuy.img

      ######################################################################
      # BUILD ANYKERNEL ZIP (OPTIONAL)
      ######################################################################

      - name: Build Tepuy Compat Zip
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |

          cd $HOME

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3

          cd AK3

          cp ${{ github.workspace }}/anykernel-compat.sh anykernel.sh

          cp $HOME/Image.gz Image.gz

          DTB=$(find $HOME/kernel-peridot/out/arch/arm64/boot/dts -name "*.dtb" | head -1)

          [ -n "$DTB" ] && cp "$DTB" dtb

          zip -r9 $HOME/Tepuy-Kernel-Compat-peridot.zip .

      ######################################################################
      # ARTIFACTS
      ######################################################################

      - name: Upload boot_tepuy.img
        uses: actions/upload-artifact@v4
        with:
          name: boot_tepuy
          path: ~/boot_tepuy.img
          retention-days: 30

      - name: Upload RAW Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-raw-image
          path: ~/Image
          retention-days: 30

      - name: Upload GZIP Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gzip-image
          path: ~/Image.gz
          retention-days: 30

      - name: Upload Tepuy Compat Zip
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Kernel-Compat-peridot
          path: ~/Tepuy-Kernel-Compat-peridot.zip
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/kernel-peridot/out/build.log
          retention-days: 30

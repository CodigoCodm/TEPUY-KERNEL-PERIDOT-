name: TEPUY Peridot - Build Environment Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit Xiaomi Peridot Build System
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Codigocodm
      KBUILD_BUILD_HOST: TEPUY

    steps:

      # ============================================================
      # 1. CHECKOUT TEPUY
      # ============================================================

      - name: Checkout TEPUY
        uses: actions/checkout@v4

      # ============================================================
      # 2. DEPENDENCIAS BASICAS
      # ============================================================

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            git \
            bc \
            bison \
            build-essential \
            flex \
            libelf-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            zip \
            cpio \
            pahole \
            file

      # ============================================================
      # 3. CLONAR XIAOMI
      # ============================================================

      - name: Clone Xiaomi Peridot
        run: |
          set -eux

          rm -rf xiaomi

          git clone \
            --depth=1 \
            --branch peridot-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            xiaomi

          cd xiaomi

          echo "=========================================="
          echo "XIAOMI PERIDOT"
          echo "=========================================="

          git branch --show-current
          git rev-parse HEAD

          echo ""
          echo "TOP LEVEL"
          echo "=========================================="

          find . -maxdepth 2 -type f \
            -not -path './.git/*' \
            | sort \
            | head -300

      # ============================================================
      # 4. AUDIT BUILD CONFIG
      # ============================================================

      - name: Audit build configs
        run: |
          set -eux

          cd xiaomi

          echo "=========================================="
          echo "PERIDOT BUILD CONFIG"
          echo "=========================================="

          if [ -f build.config.msm.peridot ]; then
            cat build.config.msm.peridot
          else
            echo "::error::build.config.msm.peridot missing"
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "ALL BUILD CONFIGS"
          echo "=========================================="

          find . \
            -type f \
            -name 'build.config*' \
            -not -path './.git/*' \
            | sort

      # ============================================================
      # 5. AUDIT MSM-KERNEL
      # ============================================================

      - name: Audit msm-kernel dependency
        run: |
          set -eux

          cd xiaomi

          echo "=========================================="
          echo "MSM-KERNEL DEPENDENCY"
          echo "=========================================="

          grep -RIn \
            'msm-kernel' \
            . \
            --exclude-dir=.git \
            2>/dev/null \
            | head -300 \
            || true

          echo ""
          echo "Expected files:"
          echo ""

          for f in \
            msm-kernel/build.config.common \
            msm-kernel/build.config.aarch64 \
            msm-kernel/build.config.msm.common \
            msm-kernel/build.config.msm.pineapple
          do
            if [ -f "$f" ]; then
              echo "[FOUND] $f"
            else
              echo "[MISSING] $f"
            fi
          done

      # ============================================================
      # 6. AUDIT KLEAF
      # ============================================================

      - name: Audit Kleaf
        run: |
          set -eux

          cd xiaomi

          echo "=========================================="
          echo "KLEAF AUDIT"
          echo "=========================================="

          echo "Searching Kleaf directories..."

          find . \
            -type d \
            \( \
              -name kleaf \
              -o -name 'build' \
            \) \
            -not -path './.git/*' \
            | sort \
            | head -200

          echo ""
          echo "Searching Kleaf files..."

          find . \
            -type f \
            \( \
              -name 'workspace.bzl' \
              -o -name 'kernel.bzl' \
              -o -name 'kleaf.bzl' \
              -o -name 'common_kernels.bzl' \
              -o -name 'constants.bzl' \
            \) \
            -not -path './.git/*' \
            | sort

      # ============================================================
      # 7. AUDIT BAZEL
      # ============================================================

      - name: Audit Bazel
        run: |
          set -eux

          cd xiaomi

          echo "=========================================="
          echo "BAZEL AUDIT"
          echo "=========================================="

          command -v bazel || true
          command -v bazelisk || true

          echo ""
          echo "Bazel files:"

          find . \
            -type f \
            \( \
              -name 'BUILD' \
              -o -name 'BUILD.bazel' \
              -o -name 'WORKSPACE' \
              -o -name 'WORKSPACE.bazel' \
              -o -name 'MODULE.bazel' \
              -o -name '.bazelrc*' \
            \) \
            -not -path './.git/*' \
            | sort

      # ============================================================
      # 8. AUDIT SUBMODULES
      # ============================================================

      - name: Audit git submodules
        run: |
          set -eux

          cd xiaomi

          echo "=========================================="
          echo "GIT SUBMODULES"
          echo "=========================================="

          git submodule status || true

          echo ""
          echo "=========================================="
          echo ".gitmodules"
          echo "=========================================="

          if [ -f .gitmodules ]; then
            cat .gitmodules
          else
            echo "No .gitmodules"
          fi

      # ============================================================
      # 9. AUDIT PERIDOT TARGETS
      # ============================================================

      - name: Search Peridot build targets
        run: |
          set -eux

          cd xiaomi

          echo "=========================================="
          echo "PERIDOT TARGETS"
          echo "=========================================="

          grep -RIn \
            -E \
            'peridot|kernel_build|kernel_aarch64|define_common_kernels' \
            . \
            --exclude-dir=.git \
            --include='BUILD' \
            --include='BUILD.bazel' \
            --include='*.bzl' \
            --include='build.config*' \
            2>/dev/null \
            | head -500 \
            || true

      # ============================================================
      # 10. SEARCH BUILD ENTRY POINTS
      # ============================================================

      - name: Search build entry points
        run: |
          set -eux

          cd xiaomi

          echo "=========================================="
          echo "BUILD ENTRY POINTS"
          echo "=========================================="

          find . \
            -type f \
            \( \
              -name 'build.sh' \
              -o -name 'build_kernel.sh' \
              -o -name 'build.py' \
              -o -name 'build_kernel.py' \
              -o -name 'kleaf.py' \
            \) \
            -not -path './.git/*' \
            | sort

      # ============================================================
      # 11. SEARCH REFERENCES TO PERIDOT CONFIG
      # ============================================================

      - name: Search config consumers
        run: |
          set -eux

          cd xiaomi

          echo "=========================================="
          echo "CONFIG CONSUMERS"
          echo "=========================================="

          grep -Ril \
            'build.config.msm.peridot' \
            . \
            --exclude-dir=.git \
            2>/dev/null \
            | sort \
            | head -200 \
            || true

      # ============================================================
      # 12. CHECK KERNEL CONFIGS
      # ============================================================

      - name: Audit kernel configs
        run: |
          set -eux

          cd xiaomi

          echo "=========================================="
          echo "PERIDOT CONFIGS"
          echo "=========================================="

          find arch/arm64/configs \
            -type f \
            | grep -Ei \
              'peridot|gki|pineapple' \
            | sort \
            | head -300 \
            || true

      # ============================================================
      # 13. CREATE AUDIT REPORT
      # ============================================================

      - name: Create audit report
        run: |
          set -eux

          cd xiaomi

          mkdir -p ../audit

          {
            echo "TEPUY PERIDOT BUILD AUDIT"
            echo "========================="
            echo ""
            echo "Branch:"
            git branch --show-current
            echo ""
            echo "Commit:"
            git rev-parse HEAD
            echo ""
            echo "Build configs:"
            find . \
              -type f \
              -name 'build.config*' \
              -not -path './.git/*' \
              | sort
            echo ""
            echo "Kleaf:"
            find . \
              -type f \
              \( \
                -name 'workspace.bzl' \
                -o -name 'kernel.bzl' \
                -o -name 'kleaf.bzl' \
              \) \
              -not -path './.git/*' \
              | sort
            echo ""
            echo "Bazel:"
            find . \
              -type f \
              \( \
                -name 'BUILD.bazel' \
                -o -name 'WORKSPACE' \
                -o -name 'MODULE.bazel' \
              \) \
              -not -path './.git/*' \
              | sort
            echo ""
            echo "Build scripts:"
            find . \
              -type f \
              -name 'build*.sh' \
              -not -path './.git/*' \
              | sort
          } > ../audit/peridot-build-audit.txt

          cat ../audit/peridot-build-audit.txt

      # ============================================================
      # 14. UPLOAD EVERYTHING
      # ============================================================

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Peridot-Build-Audit
          if-no-files-found: error
          path: |
            audit/peridot-build-audit.txt

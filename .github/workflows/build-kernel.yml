name: Build Peridot Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KBUILD_BUILD_USER: Codigocodm
      KBUILD_BUILD_HOST: TEPUY

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            pahole \
            python3 \
            python3-pip \
            rsync \
            unzip \
            zip

      - name: Detect kernel tree
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "DETECTING KERNEL TREE"
          echo "=========================================="

          KERNEL_DIR=""

          while IFS= read -r makefile; do
            dir="$(dirname "$makefile")"

            if [ -d "$dir/arch/arm64" ]; then
              KERNEL_DIR="$dir"
              break
            fi
          done < <(
            find . \
              -type f \
              -name Makefile \
              -not -path '*/.git/*' \
              | sort
          )

          if [ -z "$KERNEL_DIR" ]; then
            echo "::error::No ARM64 kernel tree found"
            find . -maxdepth 4 -type f -name Makefile -print
            exit 1
          fi

          KERNEL_DIR="$(cd "$KERNEL_DIR" && pwd)"

          echo "Kernel tree:"
          echo "$KERNEL_DIR"

          echo "KERNEL_DIR=$KERNEL_DIR" >> "$GITHUB_ENV"

      - name: Inspect kernel tree
        run: |
          set -eux

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "KERNEL TREE"
          echo "=========================================="

          pwd

          echo ""
          echo "Git:"
          git rev-parse --short HEAD || true
          git branch --show-current || true

          echo ""
          echo "Kernel Makefile:"
          head -40 Makefile

          echo ""
          echo "Peridot configs:"
          find . \
            -maxdepth 2 \
            -type f \
            \( \
              -name '*peridot*' \
              -o -name 'build.config.msm.peridot' \
            \) \
            -print \
            | sort

      - name: Detect project Clang
        shell: bash
        run: |
          set -eux

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "DETECTING CLANG"
          echo "=========================================="

          CLANG_BIN=""

          for candidate in \
            "$KERNEL_DIR/prebuilts/clang/host/linux-x86/clang/bin" \
            "$KERNEL_DIR/prebuilts/clang/host/linux-x86/clang-*/bin" \
            "$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86/clang/bin" \
            "$GITHUB_WORKSPACE/prebuilts/clang/host/linux-x86/clang-*/bin"
          do
            for d in $candidate; do
              if [ -x "$d/clang" ]; then
                CLANG_BIN="$d"
                break 2
              fi
            done
          done

          if [ -n "$CLANG_BIN" ]; then
            echo "Using project Clang:"
            echo "$CLANG_BIN"

            echo "$CLANG_BIN" >> "$GITHUB_PATH"

            echo "LLVM=1" >> "$GITHUB_ENV"
            echo "LLVM_IAS=1" >> "$GITHUB_ENV"
          else
            echo "Project Clang not found."
            echo "Using Ubuntu LLVM/Clang."

            echo "LLVM=1" >> "$GITHUB_ENV"
            echo "LLVM_IAS=1" >> "$GITHUB_ENV"
          fi

      - name: Show compiler
        run: |
          set -eux

          echo "=========================================="
          echo "COMPILER"
          echo "=========================================="

          command -v clang
          clang --version

          command -v ld.lld
          ld.lld --version

          command -v aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version | head -1

      - name: Detect Peridot defconfig
        shell: bash
        run: |
          set -eux

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "DETECTING PERIDOT DEFCONFIG"
          echo "=========================================="

          DEFCONFIG=""

          for f in \
            arch/arm64/configs/peridot_defconfig \
            arch/arm64/configs/vendor/peridot_defconfig \
            arch/arm64/configs/*/peridot_defconfig
          do
            if [ -f "$f" ]; then
              DEFCONFIG="$(basename "$f")"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::peridot_defconfig not found"

            find arch/arm64/configs \
              -type f \
              -iname '*peridot*' \
              -print \
              | sort

            exit 1
          fi

          echo "DEFCONFIG=$DEFCONFIG"

          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_ENV"

      - name: Build kernel
        shell: bash
        run: |
          set -eux

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "BUILDING PERIDOT"
          echo "=========================================="

          rm -rf out

          mkdir -p out

          make \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            "$DEFCONFIG"

          make \
            -j"$(nproc)" \
            O="$PWD/out" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image \
            dtbs \
            modules

      - name: Verify build
        shell: bash
        run: |
          set -eux

          cd "$KERNEL_DIR"

          echo "=========================================="
          echo "VERIFYING OUTPUT"
          echo "=========================================="

          echo "Images:"
          find out/arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            | sort

          if [ ! -f out/arch/arm64/boot/Image ]; then
            echo "::error::Kernel Image was not generated"
            exit 1
          fi

          echo ""
          echo "Kernel Image:"
          ls -lh out/arch/arm64/boot/Image

          file out/arch/arm64/boot/Image

      - name: Package kernel
        shell: bash
        run: |
          set -eux

          cd "$KERNEL_DIR"

          mkdir -p "$GITHUB_WORKSPACE/dist"

          cp out/arch/arm64/boot/Image \
            "$GITHUB_WORKSPACE/dist/Image"

          find out/arch/arm64/boot \
            -type f \
            \( \
              -name '*.dtb' \
              -o -name '*.dtbo' \
            \) \
            -exec cp {} "$GITHUB_WORKSPACE/dist/" \; \
            || true

          cd "$GITHUB_WORKSPACE"

          zip -r \
            "TEPUY-PERIDOT-${GITHUB_SHA::7}.zip" \
            dist

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: tepuy-peridot-kernel
          path: |
            TEPUY-PERIDOT-*.zip
            dist/

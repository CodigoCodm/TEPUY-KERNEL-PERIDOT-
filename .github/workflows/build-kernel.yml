
name: Build Tepuy Kernel for POCO F6 Peridot

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: "compat"
        type: choice
        options:
          - compat
          - full
          - both

env:
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git bc bison flex libssl-dev make \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang llvm lld device-tree-compiler python3 \
            zip unzip wget curl ccache jq file libelf-dev

      - name: Clone Xiaomi kernel
        run: |
          git clone --depth=1 -b peridot-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            $HOME/kernel-peridot

      - name: Fix optional HWID reference
        run: |
          set -e
          cd "$HOME/kernel-peridot"

          if [ -f drivers/misc/Kconfig ]; then
            sed -i \
              's|^[[:space:]]*source "drivers/misc/hwid/Kconfig"|# source "drivers/misc/hwid/Kconfig"  # Tepuy disabled|' \
              drivers/misc/Kconfig || true
          fi

      - name: Apply Tepuy COMPAT patch
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          python3 "${{ github.workspace }}/tepuy-patcher-compat.py" "$HOME/kernel-peridot"

      - name: Apply Tepuy FULL patch
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        run: |
          python3 "${{ github.workspace }}/tepuy-patcher.py" "$HOME/kernel-peridot"

      - name: Build kernel
        run: |
          set -eo pipefail
          cd "$HOME/kernel-peridot"

          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export LLVM=1
          export LLVM_IAS=1

          make O=out gki_defconfig

          make O=out \
            KCONFIG_ALLCONFIG=arch/arm64/configs/vendor/peridot_GKI.config \
            alldefconfig

          make O=out -j$(nproc)

          MODULES=$(grep '^CONFIG_MODULES=' out/.config || true)
          echo "$MODULES"

          if [ "$MODULES" = "CONFIG_MODULES=y" ]; then
            make O=out -j$(nproc) modules
            mkdir -p "$HOME/modules_staging"
            make O=out \
              INSTALL_MOD_PATH="$HOME/modules_staging" \
              INSTALL_MOD_STRIP=1 \
              modules_install
          else
            echo "CONFIG_MODULES disabled. Skipping modules."
            mkdir -p "$HOME/modules_staging"
          fi

      - name: Prepare Image.gz
        run: |
          cd "$HOME/kernel-peridot"

          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb out/arch/arm64/boot/Image.gz
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            echo "Image.gz ready."
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image out/arch/arm64/boot/Image.gz
          else
            echo "Kernel image not found."
            exit 1
          fi

      - name: Download MagiskBoot
        run: |
          mkdir -p "$HOME/magisk"
          cd "$HOME/magisk"

          APK=$(curl -sf https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | jq -r '.assets[] | select(.name|test("^Magisk-v.*\\.apk$")) | .browser_download_url' | head -n1)

          curl -Lfo magisk.apk "$APK"

          unzip -j magisk.apk "lib/x86_64/libmagiskboot.so" -d . 2>/dev/null || true
          if [ ! -f libmagiskboot.so ]; then
            unzip -j magisk.apk "lib/arm64-v8a/libmagiskboot.so" -d . 2>/dev/null || true
          fi

          mv libmagiskboot.so magiskboot
          chmod +x magiskboot

      - name: Build boot.img
        run: |
          set -e

          mkdir -p "$HOME/bootwork"
          cd "$HOME/bootwork"

          curl -L \
            -o boot.img \
            "https://github.com/CodigoCodm/TEPUY-KERNEL-PERIDOT-/releases/download/%23Kernel/boot.img"

          test -f boot.img

          "$HOME/magisk/magiskboot" unpack boot.img

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            kernel

          "$HOME/magisk/magiskboot" repack boot.img boot_tepuy.img

          cp boot_tepuy.img "$HOME/boot_tepuy.img"

      - name: Build AnyKernel COMPAT ZIP
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          cd "$HOME"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            AK3/Image.gz

          cp \
            "${{ github.workspace }}/anykernel-compat.sh" \
            AK3/anykernel.sh

          cd AK3

          zip -r9 "$HOME/Tepuy-Kernel-Compat-peridot.zip" * -x "*.git*" "README*"

      - name: Build AnyKernel FULL ZIP
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        run: |
          cd "$HOME"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3FULL

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            AK3FULL/Image.gz

          cp \
            "${{ github.workspace }}/anykernel-full.sh" \
            AK3FULL/anykernel.sh

          cd AK3FULL

          zip -r9 "$HOME/Tepuy-Kernel-Full-peridot.zip" * -x "*.git*" "README*"

      - name: Build Tepuy GameMode AutoActivator
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          mkdir -p "$HOME/gamemode"
          cd "$HOME/gamemode"

          cat > module.prop <<'EOF'
          id=tepuy-gamemode-auto
          name=Tepuy GameMode Auto-Activator
          version=2.5
          versionCode=25
          author=CodigoCodm
          description=Automatic WildBoost/GameMode for Tepuy Kernel.
          EOF

          cat > service.sh <<'EOF'
          #!/system/bin/sh
          NODE=/sys/kernel/tepuy_boost/game_mode
          until [ -f "$NODE" ]; do sleep 1; done
          echo 1 > "$NODE"
          EOF

          chmod +x service.sh

          zip -r9 "$HOME/Tepuy-GameMode-AutoActivator.zip" *

      - name: Upload boot_tepuy
        uses: actions/upload-artifact@v4
        with:
          name: boot_tepuy
          path: ~/boot_tepuy.img

      - name: Upload COMPAT ZIP
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Kernel-Compat-peridot
          path: ~/Tepuy-Kernel-Compat-peridot.zip

      - name: Upload FULL ZIP
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Kernel-Full-peridot
          path: ~/Tepuy-Kernel-Full-peridot.zip

      - name: Upload GameMode ZIP
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-GameMode-AutoActivator
          path: ~/Tepuy-GameMode-AutoActivator.zip

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            ~/kernel-peridot/out/arch/arm64/boot/Image
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: ignore

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            ~/kernel-peridot/out/build.log
            ~/kernel-peridot/out/.config

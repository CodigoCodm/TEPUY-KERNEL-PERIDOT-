      # ==========================================================
      # PREPARE PERIDOT CONFIG
      # ==========================================================

      - name: Prepare Peridot configuration
        run: |
          set -e
          set -o pipefail

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " PREPARE PERIDOT CONFIG"
          echo "=============================================="

          echo ""
          echo "=== Checking base configuration ==="

          test -f arch/arm64/configs/gki_defconfig
          test -f arch/arm64/configs/vendor/peridot_GKI.config

          echo "[OK] gki_defconfig"
          echo "[OK] vendor/peridot_GKI.config"

          echo ""
          echo "=== Checking HWID reference ==="

          if grep -q 'source "drivers/misc/hwid/Kconfig"' \
              drivers/misc/Kconfig; then

              if [ ! -f drivers/misc/hwid/Kconfig ]; then

                  echo "[WARNING] Missing HWID Kconfig"
                  echo "[INFO] Removing only dangling Kconfig reference"

                  cp drivers/misc/Kconfig \
                     drivers/misc/Kconfig.tepuy-backup

                  sed -i \
                    's|^[[:space:]]*source "drivers/misc/hwid/Kconfig"|# source "drivers/misc/hwid/Kconfig" # unavailable in published peridot-u-oss source|' \
                    drivers/misc/Kconfig

                  echo "[OK] HWID reference disabled"

              else

                  echo "[OK] HWID Kconfig exists"

              fi
          else
              echo "[OK] No dangling HWID reference"
          fi

          echo ""
          echo "=== Generating base GKI configuration ==="

          rm -rf out
          mkdir -p out

          make O=out gki_defconfig \
            2>&1 | tee out/build-config.log

          test -f out/.config

          echo "[OK] Base .config generated"

          echo ""
          echo "=== Applying Peridot GKI configuration ==="

          make O=out \
            KCONFIG_ALLCONFIG="$PWD/arch/arm64/configs/vendor/peridot_GKI.config" \
            alldefconfig \
            2>&1 | tee -a out/build-config.log

          test -f out/.config

          echo "[OK] Peridot configuration applied"

          echo ""
          echo "=== Verifying important configuration ==="

          grep -E \
            'CONFIG_ARM64|CONFIG_CPU_FREQ|CONFIG_MSM|CONFIG_QCOM' \
            out/.config \
            | head -40 || true

          echo ""
          echo "=============================================="
          echo " PERIDOT CONFIG READY"
          echo "=============================================="

name: Build Tepuy Exclusive 8.0 (Peridot HyperOS 3)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "compat | full | both"
        required: true
        default: "compat"
        type: choice
        options:
          - compat
          - full
          - both

env:
  ARCH: arm64
  SUBARCH: arm64
  LLVM: "1"
  LLVM_IAS: "1"
  BOOT_URL: "https://github.com/CodigoCodm/TEPUY-KERNEL-PERIDOT-/releases/download/%23Kernel/boot.img"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:

    # ==========================================================
    # CHECKOUT
    # ==========================================================

    - name: Checkout Tepuy repository
      uses: actions/checkout@v4

    # ==========================================================
    # DEPENDENCIES
    # ==========================================================

    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e

        sudo apt-get update -qq

        sudo apt-get install -y --no-install-recommends \
          git bc bison flex make \
          clang llvm lld \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          libssl-dev libelf-dev libncurses-dev \
          python3 jq curl wget zip unzip gzip rsync file \
          device-tree-compiler ccache dwarves pahole

    # ==========================================================
    # CCACHE
    # ==========================================================

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: tepuy-v8
        max-size: 3G

    # ==========================================================
    # CLONE XIAOMI SOURCE
    # ==========================================================

    - name: Clone Xiaomi Peridot source
      run: |
        set -e

        rm -rf "$HOME/kernel-peridot"

        git clone \
          --depth=1 \
          -b peridot-u-oss \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
          "$HOME/kernel-peridot"

        cd "$HOME/kernel-peridot"

        git branch --show-current
        git rev-parse --short HEAD

    # ==========================================================
    # FIX HWID (PUBLIC OSS BUG)
    # ==========================================================

    - name: Fix missing HWID references
      run: |
        set -e

        cd "$HOME/kernel-peridot"

        sed -i '/drivers\/misc\/hwid/d' drivers/misc/Kconfig || true
        sed -i '/drivers\/misc\/hwid/d' drivers/misc/Makefile || true

        mkdir -p drivers/misc/hwid

        cat > drivers/misc/hwid/Makefile <<'EOF'
        obj-y :=
        EOF

        cat > drivers/misc/hwid/Kconfig <<'EOF'
        menu "Dummy HWID"
        endmenu
        EOF

        echo "[OK] HWID fixed"

    # ==========================================================
    # VERIFY CONFIGS
    # ==========================================================

    - name: Verify Peridot configs
      run: |
        set -e

        cd "$HOME/kernel-peridot"

        test -f arch/arm64/configs/gki_defconfig
        test -f arch/arm64/configs/vendor/peridot_GKI.config

        echo "[OK] Required configs exist"

    # ==========================================================
    # APPLY TEPUY PATCHES
    # ==========================================================

    - name: Apply Tepuy COMPAT patch
      if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
      run: |
        cd "$HOME/kernel-peridot"

        python3 \
          "${{ github.workspace }}/tepuy-patcher-compat.py" \
          "$HOME/kernel-peridot"

    - name: Apply Tepuy FULL patch
      if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
      run: |
        cd "$HOME/kernel-peridot"

        python3 \
          "${{ github.workspace }}/tepuy-patcher.py" \
          "$HOME/kernel-peridot"
              # ==========================================================
    # BUILD KERNEL (TEPUY EXCLUSIVE 8.0)
    # ==========================================================

       - name: Configure Peridot Kernel
      run: |
        set -eo pipefail

        cd "$HOME/kernel-peridot"

        echo "=============================================="
        echo " CONFIGURE PERIDOT KERNEL"
        echo "=============================================="

        rm -rf out
        mkdir -p out

        export ARCH=arm64
        export SUBARCH=arm64

        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        export LLVM=1
        export LLVM_IAS=1

        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip

        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache

        echo "===== gki_defconfig ====="
        make O=out gki_defconfig

        echo "===== Apply vendor/peridot_GKI.config ====="

        cat \
          arch/arm64/configs/vendor/peridot_GKI.config \
          >> out/.config

        echo "===== Resolve configuration ====="

        make O=out olddefconfig

        echo "===== Important configs ====="

        grep "^CONFIG_MODULES=" out/.config || true
        grep "^CONFIG_CPU_FREQ=" out/.config || true
        grep "^CONFIG_THERMAL=" out/.config || true
        grep "^CONFIG_SYSFS=" out/.config || true

        echo ""
        echo "===== CONFIG COMPLETE ====="

        test -s out/.config

        echo "[OK] .config generado correctamente."

    # ==========================================================
    # COMPILE KERNEL
    # ==========================================================

    - name: Compile Image + DTBs
      run: |
        set -eo pipefail

        cd "$HOME/kernel-peridot"

        export ARCH=arm64
        export SUBARCH=arm64
        export CC=clang
        export LLVM=1
        export LLVM_IAS=1
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        make O=out \
          -j"$(nproc --all)" \
          Image dtbs \
          2>&1 | tee out/build.log

    # ==========================================================
    # DEBUG BUILD TREE
    # ==========================================================

    - name: Debug boot directory
      if: always()
      run: |
        cd "$HOME/kernel-peridot"

        echo "===== BOOT DIRECTORY ====="
        ls -lah out/arch/arm64/boot || true

        echo ""
        echo "===== SEARCHING FOR KERNEL ====="

        find out -type f | grep -E 'Image|Image.gz|Image.gz-dtb|vmlinuz' || true

        echo ""
        echo "===== DTBS ====="

        find out -name "*.dtb" | head -50 || true

    # ==========================================================
    # LOCATE KERNEL IMAGE AUTOMATICALLY
    # ==========================================================

    - name: Locate kernel image
      run: |
        set -e

        cd "$HOME/kernel-peridot"

        IMAGE=$(find out -type f \
          \( -name Image.gz-dtb -o -name Image.gz -o -name Image \) \
          | head -n1)

        if [ -z "$IMAGE" ]; then

          echo "::error::Kernel image was not generated."

          echo ""
          echo "===== LAST BUILD LOG ====="

          tail -100 out/build.log || true

          exit 1
        fi

        echo "Kernel located:"
        echo "$IMAGE"

        mkdir -p out/arch/arm64/boot

        case "$IMAGE" in

          *.gz-dtb|*.gz)
            cp "$IMAGE" out/arch/arm64/boot/Image.gz
            ;;

          *)
            gzip -n -9 -c "$IMAGE" > out/arch/arm64/boot/Image.gz
            ;;

        esac

        ls -lh out/arch/arm64/boot/Image.gz

    # ==========================================================
    # VALIDATE IMAGE SIZE
    # ==========================================================

    - name: Validate kernel image
      run: |
        set -e

        FILE="$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz"

        SIZE=$(stat -c%s "$FILE")
        SIZE_MB=$((SIZE / 1024 / 1024))

        echo "Kernel size: ${SIZE_MB} MB"

        if [ "$SIZE_MB" -lt 8 ]; then
          echo "::warning::Kernel is smaller than expected."
          echo "Printing boot directory..."
          ls -lah out/arch/arm64/boot || true
        fi

    # ==========================================================
    # BUILD MODULES (ONLY IF ENABLED)
    # ==========================================================

    - name: Build kernel modules
      run: |
        set -e

        cd "$HOME/kernel-peridot"

        mkdir -p "$HOME/modules_staging"

        if grep -q '^CONFIG_MODULES=y' out/.config; then

          echo "[OK] Building modules"

          make O=out -j"$(nproc --all)" modules

          make O=out \
            INSTALL_MOD_PATH="$HOME/modules_staging" \
            INSTALL_MOD_STRIP=1 \
            modules_install

        else

          echo "[INFO] CONFIG_MODULES=n"
          echo "[INFO] Skipping module build."

        fi

        find "$HOME/modules_staging" -name "*.ko" | head || true
            # ==========================================================
    # DOWNLOAD MAGISKBOOT
    # ==========================================================

    - name: Download MagiskBoot
      run: |
        set -e

        echo "=============================================="
        echo " DOWNLOAD MAGISKBOOT"
        echo "=============================================="

        mkdir -p "$HOME/magisk"
        cd "$HOME/magisk"

        APK_URL=$(curl -sf \
          https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
          | jq -r '.assets[]
            | select(.name | test("^Magisk-v.*\\.apk$"))
            | .browser_download_url' \
          | head -n1)

        if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
          echo "::error::Magisk APK not found."
          exit 1
        fi

        curl -Lfo magisk.apk "$APK_URL"

        unzip -j magisk.apk "lib/x86_64/libmagiskboot.so" -d . 2>/dev/null || true

        if [ ! -f libmagiskboot.so ]; then
          unzip -j magisk.apk "lib/arm64-v8a/libmagiskboot.so" -d . 2>/dev/null
        fi

        mv libmagiskboot.so magiskboot
        chmod +x magiskboot

        ./magiskboot --help >/dev/null || true

    # ==========================================================
    # DOWNLOAD STOCK BOOT
    # ==========================================================

    - name: Download stock boot.img
      run: |
        set -e

        echo "=============================================="
        echo " DOWNLOAD BOOT.IMG"
        echo "=============================================="

        mkdir -p "$HOME/bootwork"

        curl -L \
          -o "$HOME/bootwork/boot.img" \
          "$BOOT_URL"

        ls -lh "$HOME/bootwork/boot.img"

        file "$HOME/bootwork/boot.img"

    # ==========================================================
    # VERIFY IMAGE.GZ EXISTS
    # ==========================================================

    - name: Verify kernel before repack
      run: |
        set -e

        FILE="$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz"

        if [ ! -f "$FILE" ]; then
          echo "::error::Image.gz not found."
          find "$HOME/kernel-peridot/out" -type f | sort
          exit 1
        fi

        ls -lh "$FILE"

    # ==========================================================
    # BUILD BOOT.IMG
    # ==========================================================

    - name: Build boot_tepuy.img
      run: |
        set -e

        echo "=============================================="
        echo " BUILD BOOT_TEPUY.IMG"
        echo "=============================================="

        cd "$HOME/bootwork"

        "$HOME/magisk/magiskboot" unpack boot.img

        cp \
          "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
          kernel

        "$HOME/magisk/magiskboot" repack boot.img boot_tepuy.img

        cp boot_tepuy.img "$HOME/boot_tepuy.img"

        ls -lh "$HOME/boot_tepuy.img"
        file "$HOME/boot_tepuy.img"

    # ==========================================================
    # BUILD COMPAT ANYKERNEL3
    # ==========================================================

    - name: Build Tepuy COMPAT ZIP
      if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
      run: |
        set -e

        cd "$HOME"

        git clone --depth=1 \
          https://github.com/osm0sis/AnyKernel3.git \
          AnyKernel3-compat

        cd AnyKernel3-compat

        cp \
          "${{ github.workspace }}/anykernel-compat.sh" \
          anykernel.sh

        cp \
          "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
          Image.gz

        DTB=$(find \
          "$HOME/kernel-peridot/out" \
          -name "*.dtb" \
          | head -n1)

        if [ -n "$DTB" ]; then
          cp "$DTB" dtb
          echo "[OK] DTB copied."
        else
          echo "[WARNING] No DTB found."
        fi

        mkdir -p tools

        if [ -d "${{ github.workspace }}/tools" ]; then
          cp -r "${{ github.workspace }}/tools/"* tools/ || true
          chmod -R 755 tools || true
        fi

        zip -r9 \
          "$HOME/Tepuy-Kernel-Compat-peridot.zip" \
          * \
          -x "*.git*" "*.zip" "README*"

        ls -lh "$HOME/Tepuy-Kernel-Compat-peridot.zip"

    # ==========================================================
    # BUILD FULL ANYKERNEL3
    # ==========================================================

    - name: Build Tepuy FULL ZIP
      if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
      run: |
        set -e

        cd "$HOME"

        git clone --depth=1 \
          https://github.com/osm0sis/AnyKernel3.git \
          AnyKernel3-full

        cd AnyKernel3-full

        cp \
          "${{ github.workspace }}/anykernel-full.sh" \
          anykernel.sh

        cp \
          "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
          Image.gz

        DTB=$(find \
          "$HOME/kernel-peridot/out" \
          -name "*.dtb" \
          | head -n1)

        if [ -n "$DTB" ]; then
          cp "$DTB" dtb
        fi

        if [ -f "${{ github.workspace }}/dtbo.img" ]; then
          cp "${{ github.workspace }}/dtbo.img" dtbo.img
        fi

        mkdir -p _modules _system_dlkm tools

        if [ -d "${{ github.workspace }}/tools" ]; then
          cp -r "${{ github.workspace }}/tools/"* tools/ || true
          chmod -R 755 tools || true
        fi

        if [ -f "${{ github.workspace }}/prepare-modules.py" ]; then

          if find "$HOME/modules_staging" \
            -name "*.ko" \
            -print \
            -quit | grep -q .; then

            python3 \
              "${{ github.workspace }}/prepare-modules.py" \
              --input "$HOME/modules_staging" \
              --vendor-out "_modules" \
              --system-out "_system_dlkm"

          fi
        fi

        zip -r9 \
          "$HOME/Tepuy-Kernel-Full-peridot.zip" \
          * \
          -x "*.git*" "*.zip" "README*"

        ls -lh "$HOME/Tepuy-Kernel-Full-peridot.zip"

     # ==========================================================
    # BUILD GAMEMODE MODULE
    # ==========================================================

    - name: Build Tepuy GameMode AutoActivator
      if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
      run: |
        set -e

        mkdir -p "$HOME/gamemode-module"
        cd "$HOME/gamemode-module"

        cat > module.prop <<'EOF'
        id=tepuy-gamemode-auto
        name=Tepuy GameMode AutoActivator
        version=8.0
        versionCode=80
        author=CodigoCodm
        description=Automatic WildBoost activation for Tepuy Exclusive 8.0.
        EOF

        cat > service.sh <<'EOF'
        #!/system/bin/sh

        LOG="/data/local/tmp/tepuy-gamemode.log"
        NODE="/sys/kernel/tepuy_boost/game_mode"

        echo "=== Tepuy GameMode ===" > "$LOG"

        WAIT=0

        until [ -f "$NODE" ]; do
          sleep 1
          WAIT=$((WAIT+1))

          if [ "$WAIT" -ge 30 ]; then
            echo "ERROR: Tepuy sysfs node not found." >> "$LOG"
            exit 1
          fi
        done

        echo 1 > "$NODE"

        STATE=$(cat "$NODE" 2>/dev/null)

        echo "GameMode enabled: $STATE" >> "$LOG"
        EOF

        chmod 755 service.sh

        zip -r9 \
          "$HOME/Tepuy-GameMode-AutoActivator.zip" \
          module.prop service.sh

        ls -lh "$HOME/Tepuy-GameMode-AutoActivator.zip"

    # ==========================================================
    # VERIFY FINAL IMAGE
    # ==========================================================

    - name: Verificar Image compilado
      shell: bash
      run: |
        set -e

        cd "$HOME/kernel-peridot"

        echo "========================================"
        echo " VERIFICANDO KERNEL IMAGE"
        echo "========================================"

        KERNEL_IMAGE="out/arch/arm64/boot/Image"

        if [ ! -f "$KERNEL_IMAGE" ]; then
          echo ""
          echo "::error::No se encontró Image:"
          echo "$KERNEL_IMAGE"
          echo ""

          echo "===== ARCHIVOS DE BOOT ====="
          find out/arch/arm64/boot -maxdepth 1 -type f -ls 2>/dev/null || true

          echo ""
          echo "===== BUSCANDO IMAGES ====="

          find out -type f \
            \( \
              -name "Image" -o \
              -name "Image.gz" -o \
              -name "Image.gz-dtb" -o \
              -name "Image.lz4" \
            \) \
            -print || true

          exit 1
        fi

        SIZE=$(stat -c%s "$KERNEL_IMAGE")
        SIZE_MB=$((SIZE / 1024 / 1024))

        echo ""
        echo "Image encontrado:"
        ls -lh "$KERNEL_IMAGE"
        echo "Tamaño: ${SIZE_MB} MB"
        echo ""

        if [ "$SIZE" -lt 2000000 ]; then
          echo "::error::Kernel Image demasiado pequeño."
          echo "Tamaño en bytes: $SIZE"
          exit 1
        fi

        echo "[OK] Image válido."

    # ==========================================================
    # COMPRESS IMAGE
    # ==========================================================

    - name: Comprimir Image
      shell: bash
      run: |
        set -e

        cd "$HOME/kernel-peridot"

        mkdir -p final

        cp \
          out/arch/arm64/boot/Image \
          final/Image

        echo "Comprimiendo Image..."

        gzip -n -9 \
          -c final/Image \
          > final/Image.gz

        echo ""
        echo "===== ARCHIVOS FINALES ====="

        ls -lh final/

    # ==========================================================
    # CREATE KERNEL PACKAGE
    # ==========================================================

    - name: Crear paquete del kernel
      shell: bash
      run: |
        set -e

        cd "$HOME/kernel-peridot"

        if [ -f final/Image.gz ]; then
          tar -czf \
            "$HOME/peridot-kernel.tar.gz" \
            -C final \
            Image Image.gz
        else
          tar -czf \
            "$HOME/peridot-kernel.tar.gz" \
            -C final \
            Image
        fi

        echo ""
        echo "========================================"
        echo " PAQUETE GENERADO"
        echo "========================================"

        ls -lh "$HOME/peridot-kernel.tar.gz"

    # ==========================================================
    # FINAL ARTIFACTS
    # ==========================================================

    - name: Subir kernel como artifact
      uses: actions/upload-artifact@v4
      with:
        name: Tepuy-Exclusive-8.0-Peridot-${{ github.event.inputs.build_mode }}
        path: |
          ${{ github.workspace }}/../kernel-peridot/out/arch/arm64/boot/Image
          ${{ github.workspace }}/../kernel-peridot/out/arch/arm64/boot/Image.gz
          ${{ github.workspace }}/../kernel-peridot/final/Image
          ${{ github.workspace }}/../kernel-peridot/final/Image.gz
          ${{ github.workspace }}/../kernel-peridot/out/build.log
          ${{ github.workspace }}/../peridot-kernel.tar.gz
          ${{ github.workspace }}/../boot_tepuy.img
          ${{ github.workspace }}/../Tepuy-Kernel-Compat-peridot.zip
          ${{ github.workspace }}/../Tepuy-Kernel-Full-peridot.zip
          ${{ github.workspace }}/../Tepuy-GameMode-AutoActivator.zip
        if-no-files-found: warn

    

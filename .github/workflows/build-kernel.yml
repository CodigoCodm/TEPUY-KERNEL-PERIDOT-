name: Build Tepuy Exclusive 7.1 UltraBuild (POCO F6 / Peridot)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Build mode"
        required: true
        default: "compat"
        type: choice
        options:
          - compat
          - full
          - both

env:
  ARCH: arm64
  SUBARCH: arm64

  LLVM: "1"
  LLVM_IAS: "1"

  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "3G"
  CCACHE_HARDLINK: "true"

  BOOT_URL: "https://github.com/CodigoCodm/TEPUY-KERNEL-PERIDOT-/releases/download/%23Kernel/boot.img"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:

    # ==========================================================
    # CHECKOUT
    # ==========================================================

    - name: Checkout Tepuy repository
      uses: actions/checkout@v4

    # ==========================================================
    # BUILD ENVIRONMENT
    # ==========================================================

    - name: Install build environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e

        sudo apt-get update -qq

        sudo apt-get install -y -qq --no-install-recommends \
          git \
          bc \
          bison \
          flex \
          make \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          clang \
          llvm \
          lld \
          libssl-dev \
          libelf-dev \
          libncurses-dev \
          libxml2-utils \
          device-tree-compiler \
          python3 \
          jq \
          curl \
          wget \
          unzip \
          zip \
          gzip \
          rsync \
          file \
          ccache \
          dwarves \
          pahole

        clang --version
        ld.lld --version

    # ==========================================================
    # CCACHE
    # ==========================================================

    - name: Configure ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: tepuy-exclusive-v71
        max-size: 3G

    # ==========================================================
    # CLONE XIAOMI PERIDOT SOURCE
    # ==========================================================

    - name: Clone Xiaomi Peridot source
      run: |
        set -e

        rm -rf "$HOME/kernel-peridot"

        git clone \
          --depth=1 \
          -b peridot-u-oss \
          https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
          "$HOME/kernel-peridot"

        cd "$HOME/kernel-peridot"

        echo "===== SOURCE ====="

        git branch --show-current
        git rev-parse --short HEAD

        test -f Makefile
        test -d arch
        test -d drivers

        echo "[OK] Xiaomi Peridot source detected."

    # ==========================================================
    # FIX HWID BUG (PUBLIC OSS)
    # ==========================================================

    - name: Fix HWID references
      run: |
        set -e

        cd "$HOME/kernel-peridot"

        echo "===== FIX HWID ====="

        sed -i '/drivers\/misc\/hwid/d' drivers/misc/Kconfig || true
        sed -i '/drivers\/misc\/hwid/d' drivers/misc/Makefile || true
        sed -i '/hwid/d' drivers/misc/Makefile || true

        mkdir -p drivers/misc/hwid

        cat > drivers/misc/hwid/Makefile <<'EOF'
        obj-y :=
        EOF

        cat > drivers/misc/hwid/Kconfig <<'EOF'
        menu "Dummy HWID"
        endmenu
        EOF

        echo "[OK] Dummy HWID created."

    # ==========================================================
    # VERIFY CONFIG FILES
    # ==========================================================

    - name: Verify Peridot configuration
      run: |
        set -e

        cd "$HOME/kernel-peridot"

        test -f arch/arm64/configs/gki_defconfig
        test -f arch/arm64/configs/vendor/peridot_GKI.config

        echo "[OK] gki_defconfig"
        echo "[OK] peridot_GKI.config"

        find arch/arm64/configs \
          -type f \
          -iname "*peridot*" \
          | sort

    # ==========================================================
    # APPLY TEPUY PATCHES
    # ==========================================================

    - name: Apply Tepuy COMPAT patch
      if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
      run: |
        set -e
        cd "$HOME/kernel-peridot"

        python3 \
          "${{ github.workspace }}/tepuy-patcher-compat.py" \
          "$HOME/kernel-peridot"

        echo "[OK] Tepuy COMPAT applied."

    - name: Apply Tepuy FULL patch
      if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
      run: |
        set -e
        cd "$HOME/kernel-peridot"

        python3 \
          "${{ github.workspace }}/tepuy-patcher.py" \
          "$HOME/kernel-peridot"

        echo "[OK] Tepuy FULL applied."
            # ==========================================================
    # BUILD KERNEL (TEPUY EXCLUSIVE 7.1)
    # ==========================================================

    - name: Configure and Build Tepuy Kernel
      run: |
        set -eo pipefail

        cd "$HOME/kernel-peridot"

        echo "=============================================="
        echo " TEPUY EXCLUSIVE 7.1 KERNEL BUILD"
        echo "=============================================="

        # IMPORTANTE:
        # No usar mrproper en peridot-u-oss porque rompe HWID.
        rm -rf out
        mkdir -p out

        export ARCH=arm64
        export SUBARCH=arm64

        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

        export AR=llvm-ar
        export NM=llvm-nm
        export OBJCOPY=llvm-objcopy
        export OBJDUMP=llvm-objdump
        export STRIP=llvm-strip

        export LLVM=1
        export LLVM_IAS=1

        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache

        echo ""
        echo "===== STEP 1 : gki_defconfig ====="

        make O=out gki_defconfig

        echo ""
        echo "===== STEP 2 : Apply Peridot Vendor Config ====="

        make O=out \
          KCONFIG_ALLCONFIG=arch/arm64/configs/vendor/peridot_GKI.config \
          alldefconfig

        test -f out/.config

        echo "[OK] out/.config generated."

        echo ""
        echo "===== STEP 3 : Verify Important Config ====="

        grep '^CONFIG_MODULES=' out/.config || true
        grep '^CONFIG_CPU_FREQ=' out/.config || true
        grep '^CONFIG_SYSFS=' out/.config || true
        grep '^CONFIG_THERMAL=' out/.config || true

        echo ""
        echo "===== STEP 4 : Compile Kernel ====="

        make O=out \
          -j"$(nproc --all)" \
          Image dtbs \
          2>&1 | tee out/build.log

        echo ""
        echo "===== STEP 5 : Compile Modules (Optional) ====="

        if grep -q '^CONFIG_MODULES=y' out/.config; then

          make O=out \
            -j"$(nproc --all)" \
            modules \
            2>&1 | tee -a out/build.log

        else

          echo "[INFO] CONFIG_MODULES disabled."
          echo "[INFO] Skipping module compilation."

        fi

    # ==========================================================
    # VERIFY BUILD OUTPUT
    # ==========================================================

    - name: Verify kernel output
      run: |
        set -e

        cd "$HOME/kernel-peridot"

        echo "=============================================="
        echo " VERIFY BUILD OUTPUT"
        echo "=============================================="

        find out/arch/arm64/boot \
          -maxdepth 2 \
          -type f \
          -exec ls -lh {} \;

        echo ""
        echo "===== FILE TYPES ====="

        for FILE in \
          out/arch/arm64/boot/Image \
          out/arch/arm64/boot/Image.gz \
          out/arch/arm64/boot/Image.gz-dtb
        do
          if [ -f "$FILE" ]; then
            echo "--- $FILE ---"
            file "$FILE"
          fi
        done

    # ==========================================================
    # PREPARE IMAGE.GZ
    # ==========================================================

    - name: Prepare Tepuy Image.gz
      run: |
        set -e

        cd "$HOME/kernel-peridot"

        echo "=============================================="
        echo " PREPARE IMAGE.GZ"
        echo "=============================================="

        if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then

          cp \
            out/arch/arm64/boot/Image.gz-dtb \
            out/arch/arm64/boot/Image.gz

          echo "[OK] Using Image.gz-dtb"

        elif [ -f out/arch/arm64/boot/Image.gz ]; then

          echo "[OK] Image.gz already generated"

        elif [ -f out/arch/arm64/boot/Image ]; then

          echo "[INFO] Compressing Image..."

          gzip -n -9 -c \
            out/arch/arm64/boot/Image \
            > out/arch/arm64/boot/Image.gz

        else

          echo "::error::Kernel image missing."
          exit 1

        fi

        ls -lh out/arch/arm64/boot/Image*

    # ==========================================================
    # VALIDATE IMAGE SIZE
    # ==========================================================

    - name: Validate Tepuy Kernel Size
      run: |
        set -e

        FILE="$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz"

        if [ ! -f "$FILE" ]; then
          echo "::error::Image.gz missing."
          exit 1
        fi

        SIZE=$(stat -c%s "$FILE")
        SIZE_MB=$((SIZE / 1024 / 1024))

        echo "Kernel size = ${SIZE_MB} MB"

        # Evita crear boot.img con un kernel GKI incompleto.
        if [ "$SIZE_MB" -lt 15 ]; then
          echo "::error::Kernel image too small (${SIZE_MB} MB)"
          exit 1
        fi

        echo "[OK] Kernel image accepted."

    # ==========================================================
    # INSTALL MODULES (IF ENABLED)
    # ==========================================================

    - name: Install compiled modules
      run: |
        set -e

        cd "$HOME/kernel-peridot"

        rm -rf "$HOME/modules_staging"
        mkdir -p "$HOME/modules_staging"

        if grep -q '^CONFIG_MODULES=y' out/.config; then

          make O=out \
            INSTALL_MOD_PATH="$HOME/modules_staging" \
            INSTALL_MOD_STRIP=1 \
            modules_install

          echo "[OK] Modules installed."

        else

          echo "[INFO] No modules generated."

        fi

        find "$HOME/modules_staging" \
          -name "*.ko" \
          | head || true
              # ==========================================================
    # DOWNLOAD MAGISKBOOT
    # ==========================================================

    - name: Download MagiskBoot
      run: |
        set -e

        mkdir -p "$HOME/magisk"
        cd "$HOME/magisk"

        echo "===== Downloading latest Magisk ====="

        APK_URL=$(curl -sf \
          https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
          | jq -r '.assets[]
            | select(.name | test("^Magisk-v.*\\.apk$"))
            | .browser_download_url' \
          | head -n1)

        if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
          echo "::error::Unable to find Magisk APK."
          exit 1
        fi

        curl -Lfo magisk.apk "$APK_URL"

        unzip -j magisk.apk \
          "lib/x86_64/libmagiskboot.so" \
          -d . 2>/dev/null || true

        if [ ! -f libmagiskboot.so ]; then
          unzip -j magisk.apk \
            "lib/arm64-v8a/libmagiskboot.so" \
            -d . 2>/dev/null
        fi

        mv libmagiskboot.so magiskboot
        chmod +x magiskboot

        echo "[OK] MagiskBoot ready."

    # ==========================================================
    # DOWNLOAD STOCK BOOT
    # ==========================================================

    - name: Download HyperOS boot.img
      run: |
        set -e

        mkdir -p "$HOME/bootwork"

        echo "===== Downloading stock boot.img ====="

        curl -L \
          -o "$HOME/bootwork/boot.img" \
          "$BOOT_URL"

        ls -lh "$HOME/bootwork/boot.img"

    # ==========================================================
    # BUILD BOOT IMAGE
    # ==========================================================

    - name: Build Tepuy boot_tepuy.img
      run: |
        set -e

        cd "$HOME/bootwork"

        echo "===== Unpacking boot ====="

        "$HOME/magisk/magiskboot" unpack boot.img

        echo "===== Replacing kernel ====="

        cp \
          "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
          kernel

        echo "===== Repacking boot ====="

        "$HOME/magisk/magiskboot" repack boot.img boot_tepuy.img

        cp boot_tepuy.img "$HOME/boot_tepuy.img"

        ls -lh "$HOME/boot_tepuy.img"

        file "$HOME/boot_tepuy.img"

    # ==========================================================
    # BUILD ANYKERNEL3 COMPAT
    # ==========================================================

    - name: Build Tepuy COMPAT ZIP
      if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
      run: |
        set -e

        cd "$HOME"

        git clone --depth=1 \
          https://github.com/osm0sis/AnyKernel3.git \
          AnyKernel3-compat

        cd AnyKernel3-compat

        cp \
          "${{ github.workspace }}/anykernel-compat.sh" \
          anykernel.sh

        cp \
          "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
          Image.gz

        DTB=$(find \
          "$HOME/kernel-peridot/out/arch/arm64/boot/dts" \
          -name "*.dtb" \
          | head -n1)

        if [ -n "$DTB" ]; then
          cp "$DTB" dtb
          echo "[OK] DTB copied."
        else
          echo "[WARNING] DTB not found."
        fi

        mkdir -p tools

        if [ -d "${{ github.workspace }}/tools" ]; then
          cp -r "${{ github.workspace }}/tools/"* tools/ || true
          chmod -R 755 tools || true
        fi

        zip -r9 \
          "$HOME/Tepuy-Kernel-Compat-peridot.zip" \
          * \
          -x "*.git*" "*.zip" "README*"

        ls -lh "$HOME/Tepuy-Kernel-Compat-peridot.zip"

    # ==========================================================
    # BUILD ANYKERNEL3 FULL
    # ==========================================================

    - name: Build Tepuy FULL ZIP
      if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
      run: |
        set -e

        cd "$HOME"

        git clone --depth=1 \
          https://github.com/osm0sis/AnyKernel3.git \
          AnyKernel3-full

        cd AnyKernel3-full

        cp \
          "${{ github.workspace }}/anykernel-full.sh" \
          anykernel.sh

        cp \
          "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
          Image.gz

        DTB=$(find \
          "$HOME/kernel-peridot/out/arch/arm64/boot/dts" \
          -name "*.dtb" \
          | head -n1)

        if [ -n "$DTB" ]; then
          cp "$DTB" dtb
        fi

        if [ -f "${{ github.workspace }}/dtbo.img" ]; then
          cp "${{ github.workspace }}/dtbo.img" dtbo.img
        fi

        mkdir -p tools _modules _system_dlkm

        if [ -d "${{ github.workspace }}/tools" ]; then
          cp -r "${{ github.workspace }}/tools/"* tools/ || true
          chmod -R 755 tools || true
        fi

        if [ -f "${{ github.workspace }}/prepare-modules.py" ]; then

          if find "$HOME/modules_staging" \
            -name "*.ko" \
            -print \
            -quit | grep -q .; then

            python3 \
              "${{ github.workspace }}/prepare-modules.py" \
              --input "$HOME/modules_staging" \
              --vendor-out "_modules" \
              --system-out "_system_dlkm"

          else

            echo "[INFO] No modules to package."

          fi

        fi

        zip -r9 \
          "$HOME/Tepuy-Kernel-Full-peridot.zip" \
          * \
          -x "*.git*" "*.zip" "README*"

        ls -lh "$HOME/Tepuy-Kernel-Full-peridot.zip"

    # ==========================================================
    # BUILD TEPUY GAMEMODE MODULE
    # ==========================================================

    - name: Build Tepuy GameMode AutoActivator
      if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
      run: |
        set -e

        mkdir -p "$HOME/gamemode-module"
        cd "$HOME/gamemode-module"

        cat > module.prop <<'EOF'
        id=tepuy-gamemode-auto
        name=Tepuy GameMode AutoActivator
        version=7.1
        versionCode=71
        author=CodigoCodm
        description=Automatic WildBoost activation for Tepuy Exclusive 7.1.
        EOF

        cat > service.sh <<'EOF'
        #!/system/bin/sh

        LOG="/data/local/tmp/tepuy-gamemode.log"
        NODE="/sys/kernel/tepuy_boost/game_mode"

        echo "===== Tepuy GameMode =====" > "$LOG"

        WAIT=0

        while [ ! -f "$NODE" ]; do
          sleep 1
          WAIT=$((WAIT+1))

          if [ "$WAIT" -ge 30 ]; then
            echo "ERROR: GameMode node not found." >> "$LOG"
            exit 1
          fi
        done

        echo 1 > "$NODE"

        STATE=$(cat "$NODE" 2>/dev/null)

        echo "GameMode enabled: $STATE" >> "$LOG"
        EOF

        chmod 755 service.sh

        zip -r9 \
          "$HOME/Tepuy-GameMode-AutoActivator.zip" \
          module.prop service.sh

        ls -lh "$HOME/Tepuy-GameMode-AutoActivator.zip"
            # ==========================================================
    # TEPUY DIAGNOSTICS
    # ==========================================================

    - name: Tepuy Build Diagnostics
      if: always()
      run: |
        set +e

        cd "$HOME/kernel-peridot"

        echo "=============================================="
        echo " TEPUY EXCLUSIVE 7.1 BUILD REPORT"
        echo "=============================================="

        echo ""
        echo "===== KERNEL VERSION ====="
        strings out/arch/arm64/boot/Image | grep "Linux version" | head -1 || true

        echo ""
        echo "===== IMAGE FILES ====="
        find out/arch/arm64/boot -maxdepth 2 -type f -exec ls -lh {} \;

        echo ""
        echo "===== DTBs GENERATED ====="
        find out/arch/arm64/boot/dts -name "*.dtb" | sort | head -50 || true

        echo ""
        echo "===== CONFIG CHECK ====="
        grep '^CONFIG_MODULES=' out/.config || true
        grep '^CONFIG_CPU_FREQ=' out/.config || true
        grep '^CONFIG_SYSFS=' out/.config || true
        grep '^CONFIG_THERMAL=' out/.config || true

        echo ""
        echo "===== IMAGE SIZE ====="
        stat out/arch/arm64/boot/Image.gz || true

        echo ""
        echo "===== MODULES ====="
        find "$HOME/modules_staging" -name "*.ko" | head -20 || true

    # ==========================================================
    # VERIFY BOOT IMAGE
    # ==========================================================

    - name: Verify boot_tepuy.img
      if: always()
      run: |
        echo "=============================================="
        echo " VERIFY BOOT IMAGE"
        echo "=============================================="

        if [ -f "$HOME/boot_tepuy.img" ]; then
          ls -lh "$HOME/boot_tepuy.img"
          file "$HOME/boot_tepuy.img"
        else
          echo "::warning::boot_tepuy.img not generated."
        fi

    # ==========================================================
    # VERIFY ZIP FILES
    # ==========================================================

    - name: Verify ZIP artifacts
      if: always()
      run: |
        echo "=============================================="
        echo " VERIFY ZIP FILES"
        echo "=============================================="

        ls -lh "$HOME"/*.zip 2>/dev/null || true

    # ==========================================================
    # UPLOAD BOOT IMAGE
    # ==========================================================

    - name: Upload boot_tepuy.img
      uses: actions/upload-artifact@v4
      with:
        name: boot_tepuy
        path: ~/boot_tepuy.img
        retention-days: 30
        if-no-files-found: warn

    # ==========================================================
    # UPLOAD KERNEL IMAGES
    # ==========================================================

    - name: Upload kernel images
      uses: actions/upload-artifact@v4
      with:
        name: kernel-images
        path: |
          ~/kernel-peridot/out/arch/arm64/boot/Image
          ~/kernel-peridot/out/arch/arm64/boot/Image.gz
          ~/kernel-peridot/out/arch/arm64/boot/Image.gz-dtb
        retention-days: 30
        if-no-files-found: ignore

    # ==========================================================
    # UPLOAD COMPAT ZIP
    # ==========================================================

    - name: Upload Tepuy COMPAT ZIP
      if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
      uses: actions/upload-artifact@v4
      with:
        name: Tepuy-Kernel-Compat-peridot
        path: ~/Tepuy-Kernel-Compat-peridot.zip
        retention-days: 30
        if-no-files-found: warn

    # ==========================================================
    # UPLOAD FULL ZIP
    # ==========================================================

    - name: Upload Tepuy FULL ZIP
      if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
      uses: actions/upload-artifact@v4
      with:
        name: Tepuy-Kernel-Full-peridot
        path: ~/Tepuy-Kernel-Full-peridot.zip
        retention-days: 30
        if-no-files-found: warn

    # ==========================================================
    # UPLOAD GAMEMODE MODULE
    # ==========================================================

    - name: Upload Tepuy GameMode Module
      if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
      uses: actions/upload-artifact@v4
      with:
        name: Tepuy-GameMode-AutoActivator
        path: ~/Tepuy-GameMode-AutoActivator.zip
        retention-days: 30
        if-no-files-found: warn

    # ==========================================================
    # UPLOAD MODULES
    # ==========================================================

    - name: Upload compiled modules
      uses: actions/upload-artifact@v4
      with:
        name: kernel-modules
        path: ~/modules_staging
        retention-days: 30
        if-no-files-found: ignore

    # ==========================================================
    # UPLOAD BUILD LOGS
    # ==========================================================

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Tepuy-Build-Logs
        path: |
          ~/kernel-peridot/out/build.log
          ~/kernel-peridot/out/.config
        retention-days: 15
        if-no-files-found: ignore

    # ==========================================================
    # FINAL BUILD SUMMARY
    # ==========================================================

    - name: Build summary
      if: always()
      run: |
        echo "=============================================="
        echo " TEPUY EXCLUSIVE 7.1 BUILD FINISHED"
        echo "=============================================="

        echo ""
        echo "Expected artifacts:"
        echo " • boot_tepuy.img"
        echo " • Image.gz"
        echo " • Tepuy-Kernel-Compat-peridot.zip"
        echo " • Tepuy-Kernel-Full-peridot.zip"
        echo " • Tepuy-GameMode-AutoActivator.zip"
        echo " • Tepuy-Build-Logs"

        echo ""
        echo "Target platform:"
        echo " POCO F6 (Peridot / SM8635)"
        echo " HyperOS 3.0.304 CN"

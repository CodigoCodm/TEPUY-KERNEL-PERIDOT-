name: Build Tepuy Exclusive 8.0 (Peridot HyperOS 3)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "compat | full | both"
        required: true
        default: "compat"
        type: choice
        options:
          - compat
          - full
          - both

env:
  ARCH: arm64
  SUBARCH: arm64
  LLVM: "1"
  LLVM_IAS: "1"
  BOOT_URL: "https://github.com/CodigoCodm/TEPUY-KERNEL-PERIDOT-/releases/download/%23Kernel/boot.img"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout Tepuy repository
        uses: actions/checkout@v4

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            git bc bison flex make \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev libncurses-dev \
            python3 jq curl wget zip unzip gzip rsync file \
            device-tree-compiler ccache dwarves pahole

      # ==========================================================
      # CCACHE
      # ==========================================================

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tepuy-v8
          max-size: 3G

      # ==========================================================
      # CLONE XIAOMI SOURCE
      # ==========================================================

      - name: Clone Xiaomi Peridot source
        run: |
          set -e

          rm -rf "$HOME/kernel-peridot"

          git clone \
            --depth=1 \
            -b peridot-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            "$HOME/kernel-peridot"

          cd "$HOME/kernel-peridot"

          git branch --show-current
          git rev-parse --short HEAD

      # ==========================================================
      # FIX HWID
      # ==========================================================

      - name: Fix missing HWID references
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          sed -i '/drivers\/misc\/hwid/d' drivers/misc/Kconfig || true
          sed -i '/drivers\/misc\/hwid/d' drivers/misc/Makefile || true

          mkdir -p drivers/misc/hwid

          cat > drivers/misc/hwid/Makefile <<'EOF'
          obj-y :=
          EOF

          cat > drivers/misc/hwid/Kconfig <<'EOF'
          menu "Dummy HWID"
          endmenu
          EOF

          echo "[OK] HWID fixed"

      # ==========================================================
      # FIX FSA4480 FORMAT WARNING
      # ==========================================================

      - name: Fix FSA4480 format warning
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          FILE="drivers/soc/qcom/fsa4480-i2c.c"

          if [ ! -f "$FILE" ]; then
            echo "::error::FSA4480 source file not found."
            exit 1
          fi

          echo "===== BEFORE ====="
          grep -n -C 2 "usbc_mode.counter" "$FILE" || true

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          old = "usbc mode %ld, expected %d\\n"
          new = "usbc mode %d, expected %d\\n"

          if old not in data:
              print("Target format string not found.")
              sys.exit(1)

          data = data.replace(old, new, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)

          print("[OK] FSA4480 format fixed.")
          PY

          echo "===== AFTER ====="
          grep -n -C 2 "usbc_mode.counter" "$FILE" || true

                # ==========================================================
      # FIX MI FP REGULATOR FORMAT WARNING
      # ==========================================================

      - name: Fix MI FP regulator format warning
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          FILE="drivers/input/fingerprint/mi_fp/fp_driver.c"

          if [ ! -f "$FILE" ]; then
            echo "::error::MI FP driver not found."
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          old = 'pr_err("regulater addr is %d",fp_dev->vreg);'
          new = 'pr_err("regulater addr is %p", fp_dev->vreg);'

          if old not in data:
              print("Target MI FP regulator line not found.")
              sys.exit(1)

          data = data.replace(old, new, 1)

          with open(path, "w", encoding="utf-8") as f:
              f.write(data)

          print("[OK] MI FP regulator format fixed.")
          PY

          grep -n -C 2 \
            'regulater addr is' \
            "$FILE"
      # ==========================================================
      # VERIFY CONFIGS
      # ==========================================================

      - name: Verify Peridot configs
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          test -f arch/arm64/configs/gki_defconfig
          test -f arch/arm64/configs/vendor/peridot_GKI.config

          echo "[OK] Required configs exist"

      # ==========================================================
      # APPLY TEPUY PATCHES
      # ==========================================================

      - name: Apply Tepuy COMPAT patch
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          python3 \
            "${{ github.workspace }}/tepuy-patcher-compat.py" \
            "$HOME/kernel-peridot"

      - name: Apply Tepuy FULL patch
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          python3 \
            "${{ github.workspace }}/tepuy-patcher.py" \
            "$HOME/kernel-peridot"

      # ==========================================================
      # CONFIGURE KERNEL
      # ==========================================================

      - name: Configure Peridot Kernel
        run: |
          set -eo pipefail

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " CONFIGURE PERIDOT KERNEL"
          echo "=============================================="

          rm -rf out
          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export LLVM=1
          export LLVM_IAS=1

          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          echo "===== gki_defconfig ====="

          make O=out gki_defconfig

          echo "===== Apply vendor/peridot_GKI.config ====="

          cat \
            arch/arm64/configs/vendor/peridot_GKI.config \
            >> out/.config

          echo "===== Resolve configuration ====="

          make O=out olddefconfig

          echo "===== Important configs ====="

          grep "^CONFIG_MODULES=" out/.config || true
          grep "^CONFIG_CPU_FREQ=" out/.config || true
          grep "^CONFIG_THERMAL=" out/.config || true
          grep "^CONFIG_SYSFS=" out/.config || true

          echo ""
          echo "===== CONFIG COMPLETE ====="

          test -s out/.config

          echo "[OK] .config generado correctamente."

      # ==========================================================
      # COMPILE KERNEL
      # ==========================================================

      - name: Compile Image + DTBs
        run: |
          set -eo pipefail

          cd "$HOME/kernel-peridot"

          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LLVM=1
          export LLVM_IAS=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          make O=out \
            -j"$(nproc --all)" \
            Image dtbs \
            2>&1 | tee out/build.log

      # ==========================================================
      # DEBUG BUILD TREE
      # ==========================================================

      - name: Debug boot directory
        if: always()
        run: |
          cd "$HOME/kernel-peridot"

          echo "===== BOOT DIRECTORY ====="
          ls -lah out/arch/arm64/boot || true

          echo ""
          echo "===== SEARCHING FOR KERNEL ====="

          find out -type f \
            \( \
              -name "Image" -o \
              -name "Image.gz" -o \
              -name "Image.gz-dtb" -o \
              -name "Image.lz4" \
            \) \
            -print || true

          echo ""
          echo "===== DTBS ====="

          find out -name "*.dtb" | head -50 || true

      # ==========================================================
      # VERIFY FINAL IMAGE
      # ==========================================================

      - name: Verificar Image compilado
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          echo "========================================"
          echo " VERIFICANDO KERNEL IMAGE"
          echo "========================================"

          KERNEL_IMAGE="out/arch/arm64/boot/Image"

          if [ ! -f "$KERNEL_IMAGE" ]; then
            echo "::error::No se encontró Image."

            echo ""
            echo "===== BOOT DIRECTORY ====="

            find out/arch/arm64/boot \
              -maxdepth 1 \
              -type f \
              -ls || true

            echo ""
            echo "===== SEARCH ====="

            find out -type f \
              \( \
                -name "Image" -o \
                -name "Image.gz" -o \
                -name "Image.gz-dtb" -o \
                -name "Image.lz4" \
              \) \
              -print || true

            echo ""
            echo "===== LAST BUILD LOG ====="

            tail -150 out/build.log || true

            exit 1
          fi

          SIZE=$(stat -c%s "$KERNEL_IMAGE")
          SIZE_MB=$((SIZE / 1024 / 1024))

          echo ""
          echo "Image encontrado:"
          ls -lh "$KERNEL_IMAGE"
          echo "Tamaño: ${SIZE_MB} MB"

          if [ "$SIZE" -lt 2000000 ]; then
            echo "::error::Kernel Image demasiado pequeño."
            echo "Tamaño: $SIZE bytes"
            exit 1
          fi

          echo "[OK] Image válido."

      # ==========================================================
      # COMPRESS IMAGE
      # ==========================================================

      - name: Comprimir Image
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          mkdir -p final

          cp \
            out/arch/arm64/boot/Image \
            final/Image

          gzip -n -9 \
            -c final/Image \
            > final/Image.gz

          echo "===== FINAL IMAGE ====="

          ls -lh final/

      # ==========================================================
      # BUILD MODULES
      # ==========================================================

      - name: Build kernel modules
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          mkdir -p "$HOME/modules_staging"

          if grep -q '^CONFIG_MODULES=y' out/.config; then

            echo "[OK] Building modules"

            make O=out \
              -j"$(nproc --all)" \
              modules

            make O=out \
              INSTALL_MOD_PATH="$HOME/modules_staging" \
              INSTALL_MOD_STRIP=1 \
              modules_install

          else

            echo "[INFO] CONFIG_MODULES=n"
            echo "[INFO] Skipping module build."

          fi

          find "$HOME/modules_staging" \
            -name "*.ko" \
            | head || true

      # ==========================================================
      # DOWNLOAD MAGISKBOOT
      # ==========================================================

      - name: Download MagiskBoot
        run: |
          set -e

          mkdir -p "$HOME/magisk"
          cd "$HOME/magisk"

          APK_URL=$(curl -sf \
            https://api.github.com/repos/topjohnwu/Magisk/releases/latest \
            | jq -r '.assets[]
              | select(.name | test("^Magisk-v.*\\.apk$"))
              | .browser_download_url' \
            | head -n1)

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "::error::Magisk APK not found."
            exit 1
          fi

          curl -Lfo magisk.apk "$APK_URL"

          unzip -j magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d . 2>/dev/null || true

          if [ ! -f libmagiskboot.so ]; then
            unzip -j magisk.apk \
              "lib/arm64-v8a/libmagiskboot.so" \
              -d .
          fi

          mv libmagiskboot.so magiskboot
          chmod +x magiskboot

          ./magiskboot --help >/dev/null || true

      # ==========================================================
      # DOWNLOAD STOCK BOOT
      # ==========================================================

      - name: Download stock boot.img
        run: |
          set -e

          mkdir -p "$HOME/bootwork"

          curl -L \
            -o "$HOME/bootwork/boot.img" \
            "$BOOT_URL"

          ls -lh "$HOME/bootwork/boot.img"

          file "$HOME/bootwork/boot.img"

      # ==========================================================
      # BUILD BOOT
      # ==========================================================

      - name: Build boot_tepuy.img
        run: |
          set -e

          cd "$HOME/bootwork"

          "$HOME/magisk/magiskboot" unpack boot.img

          cp \
            "$HOME/kernel-peridot/final/Image.gz" \
            kernel

          "$HOME/magisk/magiskboot" repack \
            boot.img \
            boot_tepuy.img

          cp \
            boot_tepuy.img \
            "$HOME/boot_tepuy.img"

          ls -lh "$HOME/boot_tepuy.img"

      # ==========================================================
      # BUILD COMPAT ZIP
      # ==========================================================

      - name: Build Tepuy COMPAT ZIP
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          cd "$HOME"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3-compat

          cd AnyKernel3-compat

          cp \
            "${{ github.workspace }}/anykernel-compat.sh" \
            anykernel.sh

          cp \
            "$HOME/kernel-peridot/final/Image.gz" \
            Image.gz

          DTB=$(find \
            "$HOME/kernel-peridot/out" \
            -name "*.dtb" \
            | head -n1)

          if [ -n "$DTB" ]; then
            cp "$DTB" dtb
            echo "[OK] DTB copied."
          else
            echo "[WARNING] No DTB found."
          fi

          mkdir -p tools

          if [ -d "${{ github.workspace }}/tools" ]; then
            cp -r "${{ github.workspace }}/tools/"* tools/ || true
            chmod -R 755 tools || true
          fi

          zip -r9 \
            "$HOME/Tepuy-Kernel-Compat-peridot.zip" \
            * \
            -x "*.git*" "*.zip" "README*"

      # ==========================================================
      # BUILD FULL ZIP
      # ==========================================================

      - name: Build Tepuy FULL ZIP
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          cd "$HOME"

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3-full

          cd AnyKernel3-full

          cp \
            "${{ github.workspace }}/anykernel-full.sh" \
            anykernel.sh

          cp \
            "$HOME/kernel-peridot/final/Image.gz" \
            Image.gz

          DTB=$(find \
            "$HOME/kernel-peridot/out" \
            -name "*.dtb" \
            | head -n1)

          if [ -n "$DTB" ]; then
            cp "$DTB" dtb
          fi

          if [ -f "${{ github.workspace }}/dtbo.img" ]; then
            cp \
              "${{ github.workspace }}/dtbo.img" \
              dtbo.img
          fi

          mkdir -p \
            _modules \
            _system_dlkm \
            tools

          if [ -d "${{ github.workspace }}/tools" ]; then
            cp -r "${{ github.workspace }}/tools/"* tools/ || true
            chmod -R 755 tools || true
          fi

          if [ -f "${{ github.workspace }}/prepare-modules.py" ]; then

            if find "$HOME/modules_staging" \
              -name "*.ko" \
              -print \
              -quit | grep -q .; then

              python3 \
                "${{ github.workspace }}/prepare-modules.py" \
                --input "$HOME/modules_staging" \
                --vendor-out "_modules" \
                --system-out "_system_dlkm"

            fi
          fi

          zip -r9 \
            "$HOME/Tepuy-Kernel-Full-peridot.zip" \
            * \
            -x "*.git*" "*.zip" "README*"

      # ==========================================================
      # GAMEMODE MODULE
      # ==========================================================

      - name: Build Tepuy GameMode AutoActivator
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          mkdir -p "$HOME/gamemode-module"
          cd "$HOME/gamemode-module"

          cat > module.prop <<'EOF'
          id=tepuy-gamemode-auto
          name=Tepuy GameMode AutoActivator
          version=8.0
          versionCode=80
          author=CodigoCodm
          description=Automatic WildBoost activation for Tepuy Exclusive 8.0.
          EOF

          cat > service.sh <<'EOF'
          #!/system/bin/sh

          LOG="/data/local/tmp/tepuy-gamemode.log"
          NODE="/sys/kernel/tepuy_boost/game_mode"

          echo "=== Tepuy GameMode ===" > "$LOG"

          WAIT=0

          until [ -f "$NODE" ]; do
            sleep 1
            WAIT=$((WAIT+1))

            if [ "$WAIT" -ge 30 ]; then
              echo "ERROR: Tepuy sysfs node not found." >> "$LOG"
              exit 1
            fi
          done

          echo 1 > "$NODE"

          STATE=$(cat "$NODE" 2>/dev/null)

          echo "GameMode enabled: $STATE" >> "$LOG"
          EOF

          chmod 755 service.sh

          zip -r9 \
            "$HOME/Tepuy-GameMode-AutoActivator.zip" \
            module.prop service.sh

      # ==========================================================
      # CREATE PACKAGE
      # ==========================================================

      - name: Create kernel package
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          tar -czf \
            "$HOME/peridot-kernel.tar.gz" \
            -C final \
            Image Image.gz

          ls -lh "$HOME/peridot-kernel.tar.gz"

      - name: Verify generated files
        if: always()
        run: |
          echo "=============================================="
          echo " GENERATED FILES"
          echo "=============================================="

          echo ""
          echo "===== KERNEL ====="
          ls -lh /home/runner/kernel-peridot/out/arch/arm64/boot/ 2>/dev/null || true

          echo ""
          echo "===== FINAL ====="
          ls -lh /home/runner/kernel-peridot/final/ 2>/dev/null || true

          echo ""
          echo "===== HOME ====="
          ls -lh \
            /home/runner/*.img \
            /home/runner/*.zip \
            /home/runner/*.tar.gz \
            2>/dev/null || true

            # ==========================================================
      # ARTIFACTS
      # ==========================================================

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Exclusive-8.0-Peridot-${{ github.event.inputs.build_mode }}
          path: |
            /home/runner/kernel-peridot/out/arch/arm64/boot/Image
            /home/runner/kernel-peridot/final/Image
            /home/runner/kernel-peridot/final/Image.gz
            /home/runner/kernel-peridot/out/build.log
            /home/runner/peridot-kernel.tar.gz
            /home/runner/boot_tepuy.img
            /home/runner/Tepuy-Kernel-Compat-peridot.zip
            /home/runner/Tepuy-Kernel-Full-peridot.zip
            /home/runner/Tepuy-GameMode-AutoActivator.zip
          if-no-files-found: warn

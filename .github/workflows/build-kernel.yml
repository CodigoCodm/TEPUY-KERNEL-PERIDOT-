name: Build Tepuy Kernel for Poco F6 (peridot)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode'
        required: true
        default: 'compat'
        type: choice
        options:
          - compat
          - full
          - both

env:
  ARCH: arm64
  SUBARCH: arm64
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_NOHASHDIR: 'true'
  CCACHE_MAXSIZE: '2G'
  CCACHE_HARDLINK: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # BUILD ENVIRONMENT
      # ============================================================

      - name: Setup build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq

          sudo apt-get install -y -qq --no-install-recommends \
            git \
            bc \
            bison \
            flex \
            libssl-dev \
            make \
            gcc-aarch64-linux-gnu \
            clang \
            llvm \
            lld \
            device-tree-compiler \
            python3 \
            zip \
            unzip \
            wget \
            curl \
            ccache \
            libelf-dev \
            libncurses-dev \
            libxml2-utils \
            gcc-arm-linux-gnueabi \
            dwarves \
            jq


      # ============================================================
      # CCACHE
      # ============================================================

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-peridot
          max-size: 2G


      # ============================================================
      # CLONE ORIGINAL XIAOMI PERIDOT SOURCE
      # ============================================================

      - name: Clone original Xiaomi Peridot kernel
        run: |
          set -e

          echo "=============================================="
          echo " CLONE ORIGINAL XIAOMI PERIDOT SOURCE"
          echo "=============================================="

          rm -rf "$HOME/kernel-peridot"

          git clone --depth=1 \
            -b peridot-u-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            "$HOME/kernel-peridot"

          cd "$HOME/kernel-peridot"

          echo ""
          echo "=== SOURCE ==="
          git remote -v
          git branch --show-current
          git rev-parse --short HEAD

          echo ""
          echo "=== VERIFY PERIDOT SOURCE ==="

          if [ ! -d "arch/arm64/configs/vendor" ]; then
            echo "[ERROR] vendor configs directory missing!"
            exit 1
          fi

          if [ ! -f "arch/arm64/configs/vendor/peridot_consolidate.config" ]; then
            echo "[ERROR] peridot_consolidate.config not found!"
            exit 1
          fi

          if [ ! -f "arch/arm64/configs/vendor/peridot_GKI.config" ]; then
            echo "[ERROR] peridot_GKI.config not found!"
            exit 1
          fi

          echo "[OK] Peridot configuration files found."

          echo ""
          echo "Peridot configs:"
          find arch/arm64/configs/vendor \
            -maxdepth 1 \
            -type f \
            -iname '*peridot*' \
            -print


      # ============================================================
      # APPLY TEPUY PATCH - COMPAT
      #
      # IMPORTANTE:
      # Se mantiene tu patcher original que ya compilaba.
      # ============================================================

      - name: Apply Tepuy GameMode patches (COMPAT)
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          echo "=============================================="
          echo " APPLY TEPUY PATCH - COMPAT"
          echo "=============================================="

          cd "$HOME/kernel-peridot"

          python3 \
            "${{ github.workspace }}/tepuy-patcher-compat.py" \
            "$HOME/kernel-peridot"

          echo ""
          echo "=== VERIFY TEPUY PATCH ==="

          grep -n "tepuy_game_mode" \
            kernel/tepuy_sysfs.c \
            2>/dev/null | head -10 || true

          grep -n "tepuy_game_mode" \
            drivers/cpufreq/cpufreq.c \
            2>/dev/null | head -10 || true

          grep -n "tepuy_game_mode" \
            drivers/thermal/thermal_core.c \
            2>/dev/null | head -10 || true

          echo ""
          echo "[OK] Tepuy COMPAT patch applied."


      # ============================================================
      # APPLY TEPUY PATCH - FULL
      # ============================================================

      - name: Apply Tepuy GameMode patches (FULL)
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          echo "=============================================="
          echo " APPLY TEPUY PATCH - FULL"
          echo "=============================================="

          cd "$HOME/kernel-peridot"

          if [ ! -f "${{ github.workspace }}/tepuy-patcher.py" ]; then
            echo "[ERROR] tepuy-patcher.py not found!"
            exit 1
          fi

          python3 \
            "${{ github.workspace }}/tepuy-patcher.py" \
            "$HOME/kernel-peridot"

          echo ""
          echo "=== VERIFY FULL PATCH ==="

          grep -R -n "tepuy_game_mode" \
            drivers/cpufreq \
            drivers/gpu \
            2>/dev/null | head -30 || true

          echo ""
          echo "[OK] Tepuy FULL patch applied."


      # ============================================================
      # BUILD KERNEL
      #
      # IMPORTANTE:
      # NO usamos peridot_defconfig.
      #
      # El source Xiaomi contiene:
      #
      # arch/arm64/configs/gki_defconfig
      # arch/arm64/configs/vendor/peridot_GKI.config
      # arch/arm64/configs/vendor/peridot_consolidate.config
      #
      # Primero generamos gki_defconfig.
      # Luego aplicamos Peridot consolidate sobre .config.
      # ============================================================

      - name: Build kernel and modules
        run: |
          set -o pipefail

          echo "=============================================="
          echo " START KERNEL BUILD"
          echo "=============================================="

          cd "$HOME/kernel-peridot"

          rm -rf out
          mkdir -p out

          export ARCH=arm64
          export SUBARCH=arm64

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          export LLVM=1
          export LLVM_IAS=1

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          echo ""
          echo "=============================================="
          echo " BASE GKI DEFCONFIG"
          echo "=============================================="

          make O=out gki_defconfig \
            2>&1 | tee out/build.log

          echo ""
          echo "=============================================="
          echo " APPLY PERIDOT GKI CONFIG"
          echo "=============================================="

          if [ ! -f arch/arm64/configs/vendor/peridot_GKI.config ]; then
            echo "[ERROR] peridot_GKI.config missing!"
            exit 1
          fi

          scripts/kconfig/merge_config.sh \
            -m \
            out/.config \
            arch/arm64/configs/vendor/peridot_GKI.config \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " APPLY PERIDOT CONSOLIDATE CONFIG"
          echo "=============================================="

          if [ ! -f arch/arm64/configs/vendor/peridot_consolidate.config ]; then
            echo "[ERROR] peridot_consolidate.config missing!"
            exit 1
          fi

          scripts/kconfig/merge_config.sh \
            -m \
            out/.config \
            arch/arm64/configs/vendor/peridot_consolidate.config \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " FINALIZE CONFIG"
          echo "=============================================="

          make O=out olddefconfig \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=== CONFIG CHECK ==="

          if [ ! -f out/.config ]; then
            echo "[ERROR] Final .config was not generated!"
            exit 1
          fi

          echo "[OK] Final .config exists."

          echo ""
          echo "=== PERIDOT CONFIG OPTIONS ==="

          grep -E \
            'CONFIG_ARCH_QCOM|CONFIG_MSM|CONFIG_QCOM|CONFIG_ARM64' \
            out/.config \
            2>/dev/null | head -30 || true

          echo ""
          echo "=============================================="
          echo " COMPILE KERNEL"
          echo "=============================================="

          make O=out \
            -j"$(nproc --all)" \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " BUILD MODULES"
          echo "=============================================="

          make O=out \
            -j"$(nproc --all)" \
            modules \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " INSTALL MODULES"
          echo "=============================================="

          rm -rf "$HOME/modules_staging"

          make O=out \
            INSTALL_MOD_PATH="$HOME/modules_staging" \
            INSTALL_MOD_STRIP=1 \
            modules_install \
            2>&1 | tee -a out/build.log

          echo ""
          echo "=============================================="
          echo " KERNEL IMAGES"
          echo "=============================================="

          find out/arch/arm64/boot \
            -maxdepth 1 \
            -type f \
            -printf '%p\n' \
            2>/dev/null || true

          echo ""
          echo "=== MODULES COUNT ==="

          find "$HOME/modules_staging" \
            -name "*.ko" \
            -type f \
            2>/dev/null | wc -l


      # ============================================================
      # PREPARE IMAGE
      # ============================================================

      - name: Prepare kernel image
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          echo "=============================================="
          echo " PREPARE KERNEL IMAGE"
          echo "=============================================="

          KERNEL_IMAGE=""

          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image.gz-dtb"

          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image.gz"

          elif [ -f "out/arch/arm64/boot/Image" ]; then
            KERNEL_IMAGE="out/arch/arm64/boot/Image"
          fi

          if [ -z "$KERNEL_IMAGE" ]; then
            echo "[ERROR] No kernel image found!"
            exit 1
          fi

          echo "[OK] Kernel image:"
          echo "$KERNEL_IMAGE"

          if [ "$KERNEL_IMAGE" != "out/arch/arm64/boot/Image.gz" ]; then
            cp "$KERNEL_IMAGE" \
              out/arch/arm64/boot/Image.gz
          fi

          ls -lh out/arch/arm64/boot/Image.gz


      # ============================================================
      # MAGISKBOOT
      # ============================================================

      - name: Download magiskboot
        run: |
          set -e

          echo "=============================================="
          echo " DOWNLOAD MAGISKBOOT"
          echo "=============================================="

          mkdir -p "$HOME/magisk"
          cd "$HOME/magisk"

          APK_URL=$(
            curl -sf \
              https://api.github.com/repos/topjohnwu/Magisk/releases/latest |
            jq -r \
              '.assets[]
              | select(.name | test("^Magisk-v.*\\.apk$"))
              | .browser_download_url' |
            head -n1
          )

          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "[WARNING] Could not obtain latest Magisk."
            exit 1
          fi

          curl -Lfo magisk.apk "$APK_URL"

          unzip -j \
            magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            -d . \
            2>/dev/null || true

          if [ ! -f libmagiskboot.so ]; then
            unzip -j \
              magisk.apk \
              "lib/arm64-v8a/libmagiskboot.so" \
              -d . \
              2>/dev/null || true
          fi

          if [ ! -f libmagiskboot.so ]; then
            echo "[ERROR] Could not extract magiskboot."
            exit 1
          fi

          mv libmagiskboot.so magiskboot
          chmod +x magiskboot

          echo "[OK] magiskboot ready."


      # ============================================================
      # BUILD BOOT
      # ============================================================

      - name: Build boot.img
        run: |
          set -e

          echo "=============================================="
          echo " BUILD BOOT.IMG"
          echo "=============================================="

          if [ ! -f "${{ github.workspace }}/boot_stock.img" ]; then
            echo "[ERROR] boot_stock.img not found!"
            echo "Upload stock boot.img to repository root."
            exit 1
          fi

          cp \
            "${{ github.workspace }}/boot_stock.img" \
            "$HOME/boot_stock.img"

          cd "$HOME"

          "$HOME/magisk/magiskboot" \
            unpack boot_stock.img

          echo ""
          echo "=== REPLACING KERNEL ==="

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            "$HOME/kernel"

          echo ""
          echo "=== REPACKING ==="

          "$HOME/magisk/magiskboot" \
            repack boot_stock.img \
            boot_tepuy.img

          echo ""
          echo "=== BOOT RESULT ==="

          ls -lh boot_tepuy.img

          file boot_tepuy.img


      # ============================================================
      # COMPAT ZIP
      # ============================================================

      - name: Build COMPAT zip
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          cd "$HOME"

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3-compat

          cd AnyKernel3-compat

          cp \
            "${{ github.workspace }}/anykernel-compat.sh" \
            ./anykernel.sh

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            ./Image.gz

          if [ -f "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb" ]; then

            cp \
              "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb" \
              ./dtb

          else

            DTB=$(
              find \
                "$HOME/kernel-peridot/out/arch/arm64/boot/dts" \
                -name "*.dtb" |
              head -1
            )

            if [ -n "$DTB" ]; then
              cp "$DTB" ./dtb
            fi

          fi

          mkdir -p tools

          if [ -d "${{ github.workspace }}/tools" ]; then
            cp -r \
              "${{ github.workspace }}/tools/"* \
              tools/ \
              2>/dev/null || true

            chmod -R 755 tools/
          fi

          echo ""
          echo "=== BUILD COMPAT ZIP ==="

          zip -r9 \
            "$HOME/Tepuy-Kernel-Compat-peridot.zip" \
            * \
            -x "*.zip" "*.git*" "README*"

          ls -lh \
            "$HOME/Tepuy-Kernel-Compat-peridot.zip"


      # ============================================================
      # FULL ZIP
      # ============================================================

      - name: Build FULL zip
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          cd "$HOME"

          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AnyKernel3-full

          cd AnyKernel3-full

          cp \
            "${{ github.workspace }}/anykernel-full.sh" \
            ./anykernel.sh

          cp \
            "$HOME/kernel-peridot/out/arch/arm64/boot/Image.gz" \
            ./Image.gz

          if [ -f "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb" ]; then

            cp \
              "$HOME/kernel-peridot/out/arch/arm64/boot/dts/qcom/sm8635.dtb" \
              ./dtb

          else

            DTB=$(
              find \
                "$HOME/kernel-peridot/out/arch/arm64/boot/dts" \
                -name "*.dtb" |
              head -1
            )

            if [ -n "$DTB" ]; then
              cp "$DTB" ./dtb
            fi

          fi

          if [ -f "${{ github.workspace }}/dtbo.img" ]; then
            cp \
              "${{ github.workspace }}/dtbo.img" \
              ./dtbo.img
          fi

          mkdir -p _modules _system_dlkm

          if [ -f "${{ github.workspace }}/prepare-modules.py" ]; then

            python3 \
              "${{ github.workspace }}/prepare-modules.py" \
              --input "$HOME/modules_staging" \
              --vendor-out "_modules" \
              --system-out "_system_dlkm"

          fi

          mkdir -p tools

          if [ -d "${{ github.workspace }}/tools" ]; then

            cp -r \
              "${{ github.workspace }}/tools/"* \
              tools/ \
              2>/dev/null || true

            chmod -R 755 tools/

          else

            echo "[ERROR] tools directory missing!"
            exit 1

          fi

          echo ""
          echo "=== BUILD FULL ZIP ==="

          zip -r9 \
            "$HOME/Tepuy-Kernel-Full-peridot.zip" \
            * \
            -x "*.zip" "*.git*" "README*"

          ls -lh \
            "$HOME/Tepuy-Kernel-Full-peridot.zip"


      # ============================================================
      # GAMEMODE MODULE
      # ============================================================

      - name: Build GameMode Auto-Activator module
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          set -e

          mkdir -p "$HOME/gamemode-module"
          cd "$HOME/gamemode-module"

          cat > module.prop <<'EOF'
          id=tepuy-gamemode-auto
          name=Tepuy GameMode Auto-Activator
          version=1.0
          versionCode=1
          author=CodigoCodm
          description=Activa automaticamente Tepuy GameMode al arrancar. Requiere kernel Tepuy.
          EOF

          cat > service.sh <<'EOF'
          #!/system/bin/sh

          LOG_FILE="/data/local/tmp/tepuy-gamemode.log"
          SYSFS_NODE="/sys/kernel/tepuy_boost/game_mode"
          MAX_WAIT=30

          log_msg() {
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" >> "$LOG_FILE"
          }

          rm -f "$LOG_FILE"

          log_msg "=== Tepuy GameMode Auto-Activator iniciado ==="
          log_msg "Esperando sysfs node..."

          waited=0

          while [ ! -f "$SYSFS_NODE" ]; do
              sleep 1
              waited=$((waited + 1))

              if [ "$waited" -ge "$MAX_WAIT" ]; then
                  log_msg "ERROR: sysfs node no aparecio despues de ${MAX_WAIT}s"
                  log_msg "Kernel Tepuy no detectado."
                  exit 1
              fi
          done

          log_msg "sysfs node encontrado despues de ${waited}s"

          current=$(cat "$SYSFS_NODE" 2>/dev/null)
          log_msg "Estado actual: $current"

          if echo 1 > "$SYSFS_NODE" 2>/dev/null; then
              new_state=$(cat "$SYSFS_NODE" 2>/dev/null)
              log_msg "SUCCESS: GameMode activado. Estado: $new_state"
          else
              log_msg "ERROR: No se pudo escribir en sysfs."
              exit 1
          fi

          log_msg "=== Activacion completada ==="
          EOF

          chmod 755 service.sh

          zip -r9 \
            "$HOME/Tepuy-GameMode-AutoActivator.zip" \
            module.prop \
            service.sh

          ls -lh \
            "$HOME/Tepuy-GameMode-AutoActivator.zip"


      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot_tepuy
          path: ~/boot_tepuy.img
          retention-days: 30


      - name: Upload COMPAT zip
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Kernel-Compat-peridot
          path: ~/Tepuy-Kernel-Compat-peridot.zip
          retention-days: 30


      - name: Upload FULL zip
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Kernel-Full-peridot
          path: ~/Tepuy-Kernel-Full-peridot.zip
          retention-days: 30


      - name: Upload GameMode Auto-Activator
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-GameMode-AutoActivator
          path: ~/Tepuy-GameMode-AutoActivator.zip
          retention-days: 30


      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz
            ~/kernel-peridot/out/arch/arm64/boot/Image.gz-dtb
            ~/kernel-peridot/out/arch/arm64/boot/Image
          retention-days: 30
          if-no-files-found: ignore


      # ============================================================
      # BUILD LOG
      # ============================================================

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/kernel-peridot/out/build.log
          retention-days: 7

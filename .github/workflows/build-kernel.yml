name: Build Tepuy Kernel (peridot)

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "compat (portable, recomendado) | full (requiere build exacto) | both"
        required: true
        default: "compat"
        type: choice
        options: [compat, full, both]
      kernel_branch:
        description: "Rama del kernel fuente"
        default: "peridot-u-oss"

env:
  ARCH: arm64
  SUBARCH: arm64
  LLVM: "1"
  LLVM_IAS: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Tepuy repository
        uses: actions/checkout@v4

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git bc bison flex make \
            clang llvm lld \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev libelf-dev libncurses-dev \
            python3 jq curl wget zip unzip gzip rsync file \
            device-tree-compiler ccache dwarves pahole

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tepuy-${{ github.event.inputs.kernel_branch }}
          max-size: 3G

      - name: Clone Xiaomi Peridot source
        run: |
          set -e
          rm -rf "$HOME/kernel-peridot"
          git clone --depth=1 -b "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            "$HOME/kernel-peridot"
          cd "$HOME/kernel-peridot"
          echo "branch=$(git branch --show-current)"
          echo "commit=$(git rev-parse --short HEAD)"

      - name: Fix missing HWID references
        run: |
          set -e
          cd "$HOME/kernel-peridot"
          sed -i '/drivers\\/misc\\/hwid/d' drivers/misc/Kconfig || true
          sed -i '/drivers\\/misc\\/hwid/d' drivers/misc/Makefile || true
          mkdir -p drivers/misc/hwid
          cat > drivers/misc/hwid/Makefile <<'EOF'
          obj-y :=
          EOF
          cat > drivers/misc/hwid/Kconfig <<'EOF'
          menu "Dummy HWID"
          endmenu
          EOF

      - name: Fix known format-string warnings
        run: |
          set -e
          cd "$HOME/kernel-peridot"

          FSA="drivers/soc/qcom/fsa4480-i2c.c"
          if [ -f "$FSA" ]; then
            sed -i 's/usbc mode %ld, expected %d/usbc mode %d, expected %d/' "$FSA" || true
          fi

          FP="drivers/input/fingerprint/mi_fp/fp_driver.c"
          if [ -f "$FP" ]; then
            sed -i 's/regulater addr is %d",fp_dev->vreg)/regulater addr is %p", fp_dev->vreg)/' "$FP" || true
          fi

      - name: Verify Peridot configs exist
        run: |
          set -e
          cd "$HOME/kernel-peridot"
          test -f arch/arm64/configs/gki_defconfig
          test -f arch/arm64/configs/vendor/peridot_GKI.config
          echo "[OK] Configs presentes"

      # ==========================================================
      # APLICAR PARCHES TEPUY
      # ==========================================================
      - name: Apply Tepuy COMPAT patch (KMI-safe)
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: python3 "${{ github.workspace }}/tepuy-patcher-compat.py" "$HOME/kernel-peridot"

      - name: Apply Tepuy FULL patch (GameMode)
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        run: python3 "${{ github.workspace }}/tepuy-patcher.py" "$HOME/kernel-peridot"

      # ==========================================================
      # CONFIGURAR — un solo método (olddefconfig, resuelve
      # dependencias correctamente; NO usar KCONFIG_ALLCONFIG)
      # ==========================================================
      - name: Configure kernel
        run: |
          set -eo pipefail
          cd "$HOME/kernel-peridot"
          rm -rf out && mkdir -p out

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          export USE_CCACHE=1 CCACHE_EXEC=/usr/bin/ccache

          make O=out gki_defconfig
          cat arch/arm64/configs/vendor/peridot_GKI.config >> out/.config
          make O=out olddefconfig

          grep "^CONFIG_MODULES=" out/.config || true
          grep "^CONFIG_MODULE_SIG_FORCE=" out/.config || true
          test -s out/.config

      - name: Compile Image + modules + dtbs
        run: |
          set -eo pipefail
          cd "$HOME/kernel-peridot"
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out -j"$(nproc --all)" Image dtbs modules 2>&1 | tee out/build.log

      - name: Verify Image compiled
        run: |
          set -e
          cd "$HOME/kernel-peridot"
          KERNEL_IMAGE="out/arch/arm64/boot/Image"
          test -f "$KERNEL_IMAGE" || { echo "::error::No se generó Image"; tail -150 out/build.log; exit 1; }
          SIZE=$(stat -c%s "$KERNEL_IMAGE")
          [ "$SIZE" -ge 2000000 ] || { echo "::error::Image demasiado pequeño ($SIZE bytes)"; exit 1; }
          echo "[OK] Image válido: $((SIZE/1024/1024)) MB"

      - name: Compress Image
        run: |
          set -e
          cd "$HOME/kernel-peridot"
          mkdir -p final
          cp out/arch/arm64/boot/Image final/Image
          gzip -n -9 -c final/Image > final/Image.gz
          ls -lh final/

      - name: Install modules to staging
        run: |
          set -e
          cd "$HOME/kernel-peridot"
          mkdir -p "$HOME/modules_staging"
          if grep -q '^CONFIG_MODULES=y' out/.config; then
            make O=out INSTALL_MOD_PATH="$HOME/modules_staging" INSTALL_MOD_STRIP=1 modules_install
          fi

          # Firmar módulos si el defconfig lo exige
          if grep -q '^CONFIG_MODULE_SIG_FORCE=y' out/.config; then
            find "$HOME/modules_staging" -name "*.ko" -exec \
              out/scripts/sign-file sha256 out/certs/signing_key.pem out/certs/signing_key.x509 {} \;
            echo "[OK] Módulos firmados"
          fi

      # ==========================================================
      # ZIP COMPAT — el paquete portable recomendado. NO usa un
      # boot.img fijo: dump_boot/write_boot leen el boot ACTUAL
      # del dispositivo en el momento del flasheo.
      # ==========================================================
      - name: Build Tepuy COMPAT ZIP
        if: github.event.inputs.build_mode == 'compat' || github.event.inputs.build_mode == 'both'
        run: |
          set -e
          cd "$HOME"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cd AK3
          sed 's/__TEPUY_MODE__/compat/' "${{ github.workspace }}/anykernel.sh" > anykernel.sh
          cp "$HOME/kernel-peridot/final/Image.gz" Image.gz
          mkdir -p tools
          [ -d "${{ github.workspace }}/tools" ] && cp -r "${{ github.workspace }}/tools/"* tools/ && chmod -R 755 tools
          zip -r9 "$HOME/Tepuy-Kernel-Compat-peridot.zip" * -x "*.git*" "*.zip" "README*"

      # ==========================================================
      # ZIP FULL — incluye módulos vendor_dlkm. Requiere que el
      # usuario esté en la MISMA build de HyperOS que este CI.
      # ==========================================================
      - name: Build Tepuy FULL ZIP
        if: github.event.inputs.build_mode == 'full' || github.event.inputs.build_mode == 'both'
        run: |
          set -e
          cd "$HOME"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3FULL
          cd AK3FULL
          sed 's/__TEPUY_MODE__/full/' "${{ github.workspace }}/anykernel.sh" > anykernel.sh
          cp "$HOME/kernel-peridot/final/Image.gz" Image.gz

          DTB=$(find "$HOME/kernel-peridot/out" -name "*.dtb" | head -n1)
          [ -n "$DTB" ] && cp "$DTB" dtb
          [ -f "${{ github.workspace }}/dtbo.img" ] && cp "${{ github.workspace }}/dtbo.img" dtbo.img

          mkdir -p _modules tools
          [ -d "${{ github.workspace }}/tools" ] && cp -r "${{ github.workspace }}/tools/"* tools/ && chmod -R 755 tools

          if find "$HOME/modules_staging" -name "*.ko" -print -quit | grep -q .; then
            find "$HOME/modules_staging" -name "*.ko" -exec cp {} _modules/ \;
          fi

          zip -r9 "$HOME/Tepuy-Kernel-Full-peridot.zip" * -x "*.git*" "*.zip" "README*"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-Kernel-peridot-${{ github.event.inputs.build_mode }}
          path: |
            /home/runner/kernel-peridot/final/Image
            /home/runner/kernel-peridot/final/Image.gz
            /home/runner/kernel-peridot/out/build.log
            /home/runner/Tepuy-Kernel-Compat-peridot.zip
            /home/runner/Tepuy-Kernel-Full-peridot.zip
          if-no-files-found: warn

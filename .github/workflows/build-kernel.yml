name: Build Tepuy Kernel for Poco F6 (peridot)

'on':
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to use'
        required: true
        default: 'peridot_defconfig'
        type: string

env:
  ARCH: arm64
  SUBARCH: arm64
  CCACHE_COMPILERCHECK: '%compiler% -dumpmachine; %compiler% -dumpversion'
  CCACHE_NOHASHDIR: 'true'
  CCACHE_MAXSIZE: '2G'
  CCACHE_HARDLINK: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev make gcc-aarch64-linux-gnu clang llvm lld device-tree-compiler python3 zip unzip wget ccache libelf-dev libncurses5-dev libxml2-utils

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-peridot
          max-size: 2G

      - name: Download Google Clang toolchain
        run: |
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          wget -q --show-progress "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz" -O clang.tar.gz
          mkdir -p clang-r530567
          tar -xzf clang.tar.gz -C clang-r530567 --strip-components=1
          rm clang.tar.gz
          echo "Clang downloaded successfully"
          $HOME/toolchains/clang-r530567/bin/clang --version

      - name: Clone LineageOS kernel for peridot
        run: |
          git clone --depth=1 -b lineage-23.2 https://github.com/LineageOS/android_kernel_xiaomi_sm8635 $HOME/kernel-peridot

      - name: Apply Tepuy GameMode patch
        run: |
          cd $HOME/kernel-peridot
          cp ${{ github.workspace }}/tepuy-gamemode.patch .
          git apply --whitespace=nowarn tepuy-gamemode.patch
          echo "Patch applied successfully"
          grep -n "tepuy_game_mode" drivers/cpufreq/qcom-cpufreq-hw.c | head -5

      - name: Build kernel
        run: |
          cd $HOME/kernel-peridot
          export CC="$HOME/toolchains/clang-r530567/bin/clang"
          export CXX="$HOME/toolchains/clang-r530567/bin/clang++"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export AR="$HOME/toolchains/clang-r530567/bin/llvm-ar"
          export NM="$HOME/toolchains/clang-r530567/bin/llvm-nm"
          export OBJCOPY="$HOME/toolchains/clang-r530567/bin/llvm-objcopy"
          export OBJDUMP="$HOME/toolchains/clang-r530567/bin/llvm-objdump"
          export STRIP="$HOME/toolchains/clang-r530567/bin/llvm-strip"
          export LLVM=1
          export LLVM_IAS=1
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          make O=out ${{ github.event.inputs.defconfig }}
          make -j$(nproc --all) O=out
          echo "Build completed"
          ls -lh out/arch/arm64/boot/

      - name: Prepare AnyKernel3
        run: |
          cd $HOME
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cd AnyKernel3
          cp ${{ github.workspace }}/anykernel.sh ./anykernel.sh
          cp $HOME/kernel-peridot/out/arch/arm64/boot/Image.gz ./Image.gz
          zip -r9 $HOME/Tepuy-GameMode-peridot.zip * -x "*.zip" "*.git*" "README*"
          echo "AnyKernel3 zip created"
          ls -lh $HOME/Tepuy-GameMode-peridot.zip

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: ~/kernel-peridot/out/arch/arm64/boot/Image.gz
          retention-days: 30

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-GameMode-peridot
          path: ~/Tepuy-GameMode-peridot.zip
          retention-days: 30

      - name: Upload build log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ~/kernel-peridot/out/build.log
          retention-days: 7

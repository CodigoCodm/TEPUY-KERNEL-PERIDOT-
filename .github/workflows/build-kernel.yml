name: Build Tepuy Kernel - SAFE BOOT

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Rama del kernel fuente"
        required: true
        default: "peridot-u-oss"
        type: string

env:
  ARCH: arm64
  SUBARCH: arm64
  LLVM: "1"
  LLVM_IAS: "1"

jobs:
  build:
    name: SAFE BOOT - Xiaomi peridot
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:

      # ==========================================================
      # CHECKOUT TEPUY
      # ==========================================================
      - name: Checkout Tepuy repository
        uses: actions/checkout@v4

      # ==========================================================
      # DEPENDENCIAS
      # ==========================================================
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e

          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            git \
            bc \
            bison \
            flex \
            make \
            clang \
            llvm \
            lld \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            python3 \
            jq \
            curl \
            wget \
            zip \
            unzip \
            gzip \
            rsync \
            file \
            device-tree-compiler \
            ccache \
            dwarves \
            pahole

      # ==========================================================
      # CCACHE
      # ==========================================================
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: tepuy-safe-${{ github.event.inputs.kernel_branch }}
          max-size: 3G

      # ==========================================================
      # CLONAR FUENTE OFICIAL XIAOMI
      # ==========================================================
      - name: Clone Xiaomi Peridot source
        run: |
          set -e

          rm -rf "$HOME/kernel-peridot"

          git clone \
            --depth=1 \
            -b "${{ github.event.inputs.kernel_branch }}" \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git \
            "$HOME/kernel-peridot"

          cd "$HOME/kernel-peridot"

          echo "=========================================="
          echo "TEPUY SAFE BOOT"
          echo "=========================================="
          echo "Branch:"
          git branch --show-current

          echo "Commit:"
          git rev-parse --short HEAD

      # ==========================================================
      # FIX HWID
      # ==========================================================
      - name: Fix missing HWID references
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          sed -i '/drivers\/misc\/hwid/d' \
            drivers/misc/Kconfig || true

          sed -i '/drivers\/misc\/hwid/d' \
            drivers/misc/Makefile || true

          mkdir -p drivers/misc/hwid

          cat > drivers/misc/hwid/Makefile <<'EOF'
          obj-y :=
          EOF

          cat > drivers/misc/hwid/Kconfig <<'EOF'
          menu "Dummy HWID"
          endmenu
          EOF

      # ==========================================================
      # FIX WARNINGS CONOCIDOS
      # ==========================================================
      - name: Fix known format-string warnings
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          FSA="drivers/soc/qcom/fsa4480-i2c.c"

          if [ -f "$FSA" ]; then
            sed -i \
              's/usbc mode %ld, expected %d/usbc mode %d, expected %d/' \
              "$FSA" || true
          fi

          FP="drivers/input/fingerprint/mi_fp/fp_driver.c"

          if [ -f "$FP" ]; then
            sed -i \
              's/regulater addr is %d",fp_dev->vreg)/regulater addr is %p", fp_dev->vreg)/' \
              "$FP" || true
          fi

      # ==========================================================
      # VERIFICAR CONFIGURACION
      # ==========================================================
      - name: Verify Peridot configs
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          echo "Buscando configuraciones Peridot..."

          test -f arch/arm64/configs/gki_defconfig

          test -f arch/arm64/configs/vendor/peridot_GKI.config

          echo "[OK] gki_defconfig encontrado"
          echo "[OK] peridot_GKI.config encontrado"

      # ==========================================================
      # IMPORTANTE:
      #
      # NO SE EJECUTA:
      #   tepuy-patcher.py
      #   tepuy-patcher-compat.py
      #
      # Esta compilación es únicamente para comprobar
      # que el kernel Xiaomi base arranca correctamente.
      # ==========================================================
      - name: Confirm SAFE BOOT mode
        run: |
          echo "=========================================="
          echo "SAFE BOOT"
          echo "=========================================="
          echo "NO Tepuy patcher"
          echo "NO CPU frequency modifications"
          echo "NO GPU modifications"
          echo "NO GameMode"
          echo "NO thermal modifications"
          echo "NO Tepuy sysfs"
          echo "NO vendor_dlkm replacement"

      # ==========================================================
      # CONFIGURAR KERNEL
      # ==========================================================
      - name: Configure kernel
        run: |
          set -eo pipefail

          cd "$HOME/kernel-peridot"

          rm -rf out
          mkdir -p out

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache

          echo "=========================================="
          echo "CONFIGURANDO GKI"
          echo "=========================================="

          make O=out gki_defconfig

          echo "=========================================="
          echo "APLICANDO PERIDOT_GKI.CONFIG"
          echo "=========================================="

          cat \
            arch/arm64/configs/vendor/peridot_GKI.config \
            >> out/.config

          echo "=========================================="
          echo "RESOLVIENDO CONFIGURACION"
          echo "=========================================="

          make O=out olddefconfig

          echo "=========================================="
          echo "CONFIG FINAL"
          echo "=========================================="

          grep "^CONFIG_MODULES=" out/.config || true
          grep "^CONFIG_MODULE_SIG_FORCE=" out/.config || true
          grep "^CONFIG_KALLSYMS=" out/.config || true
          grep "^CONFIG_KALLSYMS_ALL=" out/.config || true

          test -s out/.config

      # ==========================================================
      # GUARDAR CONFIG FINAL
      # ==========================================================
      - name: Save final config
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          mkdir -p final

          cp out/.config final/defconfig-safe

          echo "Configuración final guardada."

      # ==========================================================
      # COMPILAR
      # ==========================================================
      - name: Compile kernel
        run: |
          set -eo pipefail

          cd "$HOME/kernel-peridot"

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          echo "=========================================="
          echo "COMPILANDO SAFE BOOT"
          echo "=========================================="

          make \
            O=out \
            -j"$(nproc --all)" \
            Image \
            dtbs \
            modules \
            2>&1 | tee out/build.log

      # ==========================================================
      # VERIFICAR IMAGE
      # ==========================================================
      - name: Verify Image
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          KERNEL_IMAGE="out/arch/arm64/boot/Image"

          test -f "$KERNEL_IMAGE"

          SIZE=$(stat -c%s "$KERNEL_IMAGE")

          echo "Image size: $SIZE bytes"

          if [ "$SIZE" -lt 2000000 ]; then
            echo "::error::Image demasiado pequeño"
            exit 1
          fi

          echo "[OK] Image válido"

      # ==========================================================
      # PREPARAR IMAGE.GZ
      # ==========================================================
      - name: Compress Image
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          mkdir -p final

          cp \
            out/arch/arm64/boot/Image \
            final/Image

          gzip \
            -n \
            -9 \
            -c final/Image \
            > final/Image.gz

          ls -lh final/

      # ==========================================================
      # INSTALAR MODULOS SOLO PARA ANALISIS
      #
      # NO SE INCLUYEN EN EL ZIP COMPAT.
      # ==========================================================
      - name: Install modules for analysis
        run: |
          set -e

          cd "$HOME/kernel-peridot"

          rm -rf "$HOME/modules_staging"

          mkdir -p "$HOME/modules_staging"

          if grep -q '^CONFIG_MODULES=y' out/.config; then

            make \
              O=out \
              INSTALL_MOD_PATH="$HOME/modules_staging" \
              INSTALL_MOD_STRIP=1 \
              modules_install

          else

            echo "CONFIG_MODULES no está habilitado."

          fi

      # ==========================================================
      # CREAR ZIP COMPAT SAFE BOOT
      # ==========================================================
      - name: Build SAFE BOOT ZIP
        run: |
          set -e

          cd "$HOME"

          rm -rf AK3

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            AK3

          cd AK3

          sed \
            's/__TEPUY_MODE__/compat/' \
            "${{ github.workspace }}/anykernel.sh" \
            > anykernel.sh

          cp \
            "$HOME/kernel-peridot/final/Image.gz" \
            Image.gz

          mkdir -p tools

          if [ -d "${{ github.workspace }}/tools" ]; then

            cp \
              -r \
              "${{ github.workspace }}/tools/"* \
              tools/

            chmod -R 755 tools

          fi

          echo "=========================================="
          echo "CREANDO ZIP SAFE BOOT"
          echo "=========================================="

          zip \
            -r9 \
            "$HOME/Tepuy-Kernel-SafeBoot-peridot.zip" \
            * \
            -x "*.git*" \
            -x "*.zip" \
            -x "README*"

          echo "ZIP creado:"
          ls -lh "$HOME/Tepuy-Kernel-SafeBoot-peridot.zip"

      # ==========================================================
      # ARTIFACTS
      # ==========================================================
      - name: Upload SAFE BOOT artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tepuy-SafeBoot-peridot
          path: |
            /home/runner/kernel-peridot/final/Image
            /home/runner/kernel-peridot/final/Image.gz
            /home/runner/kernel-peridot/final/defconfig-safe
            /home/runner/kernel-peridot/out/build.log
            /home/runner/Tepuy-Kernel-SafeBoot-peridot.zip
          if-no-files-found: error
